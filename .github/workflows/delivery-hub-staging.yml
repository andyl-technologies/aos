name: AOS Hub hybrid staging delivery

on:
  push:
    branches: [dplecki/hub-hybrid-topology]

permissions:
  contents: read

concurrency:
  group: aos-hub-hybrid-staging
  cancel-in-progress: false

jobs:
  base:
    if: >-
      github.repository == 'andyl-technologies/aos' &&
      github.repository_id == '1156711779' &&
      github.repository_owner_id == '159484437' &&
      github.ref == 'refs/heads/dplecki/hub-hybrid-topology' &&
      github.workflow_ref == 'andyl-technologies/aos/.github/workflows/delivery-hub-staging.yml@refs/heads/dplecki/hub-hybrid-topology'
    runs-on: andyl-nixos-latest-2
    timeout-minutes: 70
    environment: aos-hub-hybrid-staging
    permissions:
      contents: read
      id-token: write
    outputs:
      operation: ${{ steps.reconcile.outputs.operation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the API client and declaration before authentication
        run: |
          set -Eeuo pipefail
          nix build .#pkg-aos-delivery --out-link "$RUNNER_TEMP/aos-delivery"
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" prove-source --source-sha "$GITHUB_SHA"
          nix eval --json --file deployment/application-project.nix > "$RUNNER_TEMP/application-project.json"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.DELIVERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DELIVERY_SERVICE_ACCOUNT }}
          audience: ${{ vars.DELIVERY_WIF_AUDIENCE }}
          token_format: id_token
          id_token_audience: ${{ vars.DELIVERY_ENDPOINT }}
          id_token_include_email: true
          create_credentials_file: false
      - id: reconcile
        name: Reconcile the registered base graph and retain its engine generation
        env:
          DELIVERY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          DELIVERY_ENDPOINT: ${{ vars.DELIVERY_ENDPOINT }}
        run: |
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" reconcile \
            --endpoint "$DELIVERY_ENDPOINT" --source-sha "$GITHUB_SHA" \
            --declaration "$RUNNER_TEMP/application-project.json" \
            --github-output "$GITHUB_OUTPUT" --timeout 3000

  artifact:
    needs: base
    runs-on: andyl-nixos-latest-2
    timeout-minutes: 180
    environment: aos-hub-hybrid-staging-artifact
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and qualify exact hermetic Native image and scanner tools
        run: |
          set -Eeuo pipefail
          nix build .#pkg-aos-delivery --out-link "$RUNNER_TEMP/aos-delivery"
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" prove-source --source-sha "$GITHUB_SHA"
          nix eval --json --file deployment/application-project.nix > "$RUNNER_TEMP/application-project.json"
          nix build -f . containerImages.aos-hub.ociIndex --out-link "$RUNNER_TEMP/hub-image"
          nix build -f . containerImages.aos-hub.evidence --out-link "$RUNNER_TEMP/hub-evidence"
          nix build -f . containerImages.aos-hub.checks.reproducibility --no-link
          nix build -f . checks.fleet.hub-native-container checks.fleet.hub-hybrid --no-link
          nix build -f . pkgs.grype --out-link "$RUNNER_TEMP/grype"
          nix build -f . pkgs.syft --out-link "$RUNNER_TEMP/syft"
          nix build -f . pkgs.grype.passthru.databaseArchive --out-link "$RUNNER_TEMP/grype-db"
      - name: Import and validate the pinned vulnerability database
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db-cache
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_VALIDATE_BY_HASH_ON_START: 'true'
          GRYPE_DB_VALIDATE_AGE: 'true'
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/grype/bin/grype" db import "$RUNNER_TEMP/grype-db"
          "$RUNNER_TEMP/grype/bin/grype" db status -o json > "$RUNNER_TEMP/grype-db-status.json"
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" validate-database \
            --status "$RUNNER_TEMP/grype-db-status.json"
      - name: Catalog and scan the actual image and assemble source-bound evidence
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db-cache
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_VALIDATE_BY_HASH_ON_START: 'true'
          GRYPE_DB_VALIDATE_AGE: 'true'
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" bundle \
            --source-sha "$GITHUB_SHA" --declaration "$RUNNER_TEMP/application-project.json" \
            --image "$RUNNER_TEMP/hub-image" --evidence "$RUNNER_TEMP/hub-evidence" \
            --cataloger "$RUNNER_TEMP/syft/bin/syft" --scanner "$RUNNER_TEMP/grype/bin/grype" \
            --database-status "$RUNNER_TEMP/grype-db-status.json" \
            --output "$RUNNER_TEMP/hub-native-artifact.tar"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.DELIVERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DELIVERY_SERVICE_ACCOUNT }}
          audience: ${{ vars.DELIVERY_WIF_AUDIENCE }}
          token_format: id_token
          id_token_audience: ${{ vars.DELIVERY_ENDPOINT }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Reserve, upload and finalize through the API-only artifact audience
        env:
          DELIVERY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          DELIVERY_ENDPOINT: ${{ vars.DELIVERY_ENDPOINT }}
        run: |
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" upload-artifact \
            --endpoint "$DELIVERY_ENDPOINT" --source-sha "$GITHUB_SHA" \
            --declaration "$RUNNER_TEMP/application-project.json" \
            --artifact "$RUNNER_TEMP/hub-native-artifact.tar" \
            > "$RUNNER_TEMP/hub-native-artifact.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aos-hub-native-coordinate-${{ github.sha }}
          path: ${{ runner.temp }}/hub-native-artifact.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [base, artifact]
    runs-on: andyl-nixos-latest-2
    timeout-minutes: 70
    environment: aos-hub-hybrid-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and prove the exact release source before authentication
        run: |
          set -Eeuo pipefail
          nix build .#pkg-aos-delivery --out-link "$RUNNER_TEMP/aos-delivery"
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" prove-source --source-sha "$GITHUB_SHA"
          nix eval --json --file deployment/application-project.nix > "$RUNNER_TEMP/application-project.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aos-hub-native-coordinate-${{ github.sha }}
          path: ${{ runner.temp }}/artifact-coordinate
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.DELIVERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DELIVERY_SERVICE_ACCOUNT }}
          audience: ${{ vars.DELIVERY_WIF_AUDIENCE }}
          token_format: id_token
          id_token_audience: ${{ vars.DELIVERY_ENDPOINT }}
          id_token_include_email: true
          create_credentials_file: false
      - id: reconcile
        name: Submit and observe the signed Native release and registered continuations
        env:
          DELIVERY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          DELIVERY_ENDPOINT: ${{ vars.DELIVERY_ENDPOINT }}
          GENERATION_ANCHOR: ${{ needs.base.outputs.operation }}
        run: |
          "$RUNNER_TEMP/aos-delivery/bin/aos-delivery" reconcile-artifact \
            --endpoint "$DELIVERY_ENDPOINT" --source-sha "$GITHUB_SHA" \
            --declaration "$RUNNER_TEMP/application-project.json" \
            --artifact-coordinate "$RUNNER_TEMP/artifact-coordinate/hub-native-artifact.json" \
            --generation-anchor "$GENERATION_ANCHOR" \
            --github-output "$GITHUB_OUTPUT" --timeout 3000
