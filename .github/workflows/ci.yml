name: CI

# Every check AOS runs is a Nix derivation under `checks.<system>` in
# flake.nix. This workflow does not enumerate checks by hand: it asks Nix
# for the set (`githubActions.matrix`) and fans each one out into its own
# job — so adding a check in Nix automatically adds a CI status here.
#
# Layout:
#   fast lane   format / lint / cargo-fmt / cargo-clippy — dedicated jobs
#               that start immediately and give sub-minute red/green on the
#               most common mistakes.
#   matrix      everything else, one job per check, routed to the right
#               runner by tier (see lib/ci/github-matrix.nix).
#   ci-success  a single aggregate status for branch protection.
#
# Builds read pre-built store paths from the `andyl-os` Attic cache via the
# self-hosted runners' nix.conf (see docs/ci.md for the infra prerequisite);
# only paths affected by the diff are rebuilt.

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  # One run per ref; a new push cancels the previous run's jobs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Fast lane (tier 0): instant feedback, no dependency on matrix gen ---
  nix-fmt:
    name: nix fmt
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L '.#checks.x86_64-linux.format'

  nix-lint:
    name: nix lint
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L '.#checks.x86_64-linux.lint'

  cargo-fmt:
    name: cargo fmt
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L '.#checks.x86_64-linux.cargo-fmt'

  cargo-clippy:
    name: cargo clippy
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L '.#checks.x86_64-linux.cargo-clippy'

  # --- Matrix generation: the single source of truth ---
  matrix:
    name: Generate matrix
    runs-on: andyl-nixos-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: Enumerate checks
        run: |
          set -Eeuo pipefail
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # A markdown bullet per check, rendered by Nix (no host jq) so the
          # summary lists exactly what the fan-out will run.
          {
            echo "### Checks fanned out"
            nix eval --raw '.#githubActions.matrix' --apply \
              'm: builtins.concatStringsSep "\n" (map (e: "- `" + e.name + "` — tier " + builtins.toString e.tier + " (`" + e.runner + "`)") m.include)'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Fan-out: one job per check, routed to its tier's runner ---
  checks:
    name: ${{ matrix.name }}
    needs: [matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.attr }}
        id: build
        run: |
          set -o pipefail
          start=$SECONDS
          nix build -L --no-link --print-out-paths '.#${{ matrix.attr }}'
          echo "duration=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
      - name: Capture failure log
        if: failure()
        run: |
          echo "::group::nix log for ${{ matrix.attr }}"
          nix log '.#${{ matrix.attr }}' 2>/dev/null | tail -n 200 || true
          echo "::endgroup::"
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then icon="✅"; else icon="❌"; fi
          dur="${{ steps.build.outputs.duration }}"
          echo "$icon \`${{ matrix.name }}\` — tier ${{ matrix.tier }} on \`${{ matrix.runner }}\` (${dur:-?}s)" \
            >> "$GITHUB_STEP_SUMMARY"

  # --- Single required status for branch protection ---
  ci-success:
    name: CI Success
    needs: [nix-fmt, nix-lint, cargo-fmt, cargo-clippy, matrix, checks]
    if: always()
    runs-on: andyl-nixos-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more CI jobs failed ($r)."
              exit 1
            fi
          done
          echo "All CI checks passed."
