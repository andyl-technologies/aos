name: CI

# CI is segmented into a few jobs by function. Each job builds one
# aggregate from `ciGroups` (defined in flake.nix / lib/ci/groups.nix)
# with a single `nix build`, so a shared build closure (toolchain,
# packages, kernel) is realised once per job instead of once per check.
#
# Adding a check never adds a job — it joins an existing group by name.
# The individual checks remain addressable as `checks.<system>.<name>`
# for local runs and `nix flake check`.
#
# Builds substitute pre-built paths from the `andyl-os` Attic cache via
# the self-hosted runners' nix.conf (see docs/ci.md); only paths the diff
# changes are rebuilt.

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --no-link '.#ciGroups.x86_64-linux.lint'

  eval:
    name: eval
    runs-on: andyl-nixos-latest
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --no-link '.#ciGroups.x86_64-linux.eval'

  rust:
    name: rust
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --no-link '.#ciGroups.x86_64-linux.rust'

  tla:
    name: tla
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --no-link '.#ciGroups.x86_64-linux.tla'

  build:
    name: build
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --no-link '.#ciGroups.x86_64-linux.build'

  integration:
    name: integration
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --keep-going --no-link '.#ciGroups.x86_64-linux.integration'

  vm:
    name: vm
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --keep-going --no-link '.#ciGroups.x86_64-linux.vm'

  fleet:
    name: fleet
    runs-on: andyl-nixos-latest-32
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L --keep-going --no-link '.#ciGroups.x86_64-linux.fleet'

  # Single aggregate status for branch protection.
  ci-success:
    name: CI Success
    needs: [lint, eval, rust, tla, build, integration, vm, fleet]
    if: always()
    runs-on: andyl-nixos-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more CI jobs failed ($r)."
              exit 1
            fi
          done
          echo "All CI checks passed."
