name: Deploy Hub staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aos-hub-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: staging
      url: https://aos.staging.andyl.org
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Build and export the immutable installer closure
        id: build
        shell: bash
        run: |
          set -euo pipefail
          installer="$(nix build .#pkg-aos-hub-cloudflare --no-link --print-out-paths)"
          test -x "$installer/bin/aos-hub"

          artifact="$RUNNER_TEMP/aos-hub-cloudflare"
          mkdir -p "$artifact/cache"
          nix copy --to "file://$artifact/cache" "$installer"
          printf '%s\n' "$GITHUB_SHA" > "$artifact/source-commit"
          printf '%s\n' "$installer" > "$artifact/store-path"

          printf 'installer=%s\n' "$installer" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Retain the exact staging artifact for production promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aos-hub-cloudflare-${{ github.sha }}
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Deploy isolated staging Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUB_CLOUDFLARE_API_TOKEN: ${{ secrets.HUB_CLOUDFLARE_API_TOKEN }}
          HUB_JWT_SECRET: ${{ secrets.HUB_JWT_SECRET }}
          HUB_ROUTE_RESERVATION_KEYRING: ${{ secrets.HUB_ROUTE_RESERVATION_KEYRING }}
          HUB_SEAL_KEY: ${{ secrets.HUB_SEAL_KEY }}
          INSTALLER: ${{ steps.build.outputs.installer }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$HUB_CLOUDFLARE_API_TOKEN"
          test -n "$HUB_JWT_SECRET"
          test -n "$HUB_ROUTE_RESERVATION_KEYRING"
          test -n "$HUB_SEAL_KEY"

          umask 077
          keyring="$RUNNER_TEMP/route-reservation-keyring.json"
          printf '%s' "$HUB_ROUTE_RESERVATION_KEYRING" > "$keyring"

          "$INSTALLER/bin/aos-hub" worker deploy \
            --name aos-hub-staging \
            --domain aos.staging.andyl.org \
            --external-url https://aos.staging.andyl.org \
            --deployment-id "$GITHUB_SHA" \
            --rate-limit-namespace-base 2000 \
            --route-reservation-keys-file "$keyring"

      - name: Probe the hosted staging deployment
        shell: bash
        run: |
          set -euo pipefail
          curl_package="$(nix build .#pkg-curl --no-link --print-out-paths)"
          response="$("$curl_package/bin/curl" \
            --fail-with-body \
            --proto '=https' \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --header 'cache-control: no-cache' \
            --write-out $'\n%{http_code}' \
            "https://aos.staging.andyl.org/.well-known/aos-deployment?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"
          status="${response##*$'\n'}"
          deployment_id="${response%$'\n'*}"
          test "$status" = 200
          test "$deployment_id" = "$GITHUB_SHA"
