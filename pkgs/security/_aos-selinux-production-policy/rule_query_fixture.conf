# Small offline query fixture. This is not a production kernel class map,
# installed policy, or authority carrier.
class file
class dir
class process
class fd
sid kernel

class file { getattr open read write ioctl }
class dir { getattr open read search }
class process { transition ptrace }
class fd { use }

attribute subjects;
attribute targets;
attribute outputs;
type first_t, subjects;
type second_t, subjects;
type data_t, targets;
type other_t, targets;
type result_t, outputs;

bool query_enabled false;
bool query_other_enabled true;

allow first_t data_t:file { open read };
allow subjects targets:file getattr;
allow second_t other_t:file ioctl;
allowxperm second_t other_t:file ioctl { 0x1000-0x1002 };

if (query_enabled) {
    allow subjects targets:fd use;
    allow subjects targets:file read;
    type_transition first_t data_t:process result_t;
} else {
    allow subjects targets:file write;
    type_transition second_t other_t:process result_t;
}

if (query_other_enabled) {
    allow first_t data_t:file read;
}

type_transition subjects data_t:dir result_t;
type_transition first_t other_t:file result_t "named";

role query_r;
role query_r types { first_t second_t data_t other_t result_t };
user query_u roles query_r;
sid kernel query_u:query_r:first_t
