# ANDYL OS -- Package Versions
# Single source of truth for all package versions.
# Referenced via (config-version "section" "key") in Guix modules.

[toolchain]
gcc = "13.3.0"
glibc = "2.39"
binutils = "2.42"
linux-headers = "6.12.11"

[base]
make = "4.4.1"
coreutils = "9.5"
bash = "5.2.32"
findutils = "4.10.0"
gawk = "5.3.1"
grep = "3.11"
sed = "4.9"
tar = "1.35"
gzip = "1.13"
xz = "5.6.0"
diffutils = "3.10"
patch = "2.7.6"
pkg-config = "0.29.2"
perl = "5.38.2"
bison = "3.8.2"
texinfo = "7.1"

[kernel]
linux = "6.12.11"

[security]
