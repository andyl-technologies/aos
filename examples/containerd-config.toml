# ANDYL OS -- containerd Configuration
# /etc/containerd/config.toml
#
# This configuration is baked into the golden image.  Per-machine
# overrides can be applied via Ignition to the /etc overlay.
#
# Key settings:
#   - gRPC socket at /run/containerd/containerd.sock (CRI endpoint)
#   - Pause image from registry.k8s.io (sandbox container)
#   - SystemdCgroup=true (matches kubelet cgroupDriver: systemd)
#   - CNI bin_dir=/opt/cni/bin (standard CNI plugin binaries)
#   - CNI conf_dir=/etc/cni/net.d (written at runtime by deployed CNI)
#   - Default runtime: runc (OCI runtime)
#   - Snapshotter: overlayfs (default) or zfs (for ZFS storage layout)
#
# See:
#   RFC-0007 section 2 (Container Runtime Interface)
#   Phase 7 section 7.6 (containerd Configuration)

version = 2

# Root directory for containerd metadata and state.
# Must be on mutable storage (/var on ZFS).
root = "/var/lib/containerd"

# State directory for runtime state (ephemeral, on tmpfs is fine
# but we keep it on /var for simplicity).
state = "/run/containerd"

# OOM score for containerd.  -999 protects it from the OOM killer.
oom_score = -999

[grpc]
  address = "/run/containerd/containerd.sock"
  uid = 0
  gid = 0
  max_recv_message_size = 16777216
  max_send_message_size = 16777216

[debug]
  address = ""
  uid = 0
  gid = 0
  level = "info"

[metrics]
  address = "127.0.0.1:1338"
  grpc_histogram = false

[plugins]

  # CRI plugin configuration -- this is the interface kubelet uses
  [plugins."io.containerd.grpc.v1.cri"]
    # Sandbox (pause) container image.  This image is used to hold the
    # network namespace for each pod.
    sandbox_image = "registry.k8s.io/pause:3.10"

    # Tolerate missing CNI config on startup.  The node starts in
    # NotReady state until a CNI plugin is deployed at runtime.
    tolerate_missing_hugetlb_controller = true

    # Maximum container log line size
    max_container_log_line_size = 16384

    [plugins."io.containerd.grpc.v1.cri".containerd]
      # Snapshotter for container image layers.
      # Use "overlayfs" for ext4 storage or "zfs" for ZFS storage layout.
      # If using ZFS, Ignition should create the dataset:
      #   zfs create -o mountpoint=/var/lib/containerd datapool/containerd
      snapshotter = "overlayfs"

      # Disable deprecated CRI image decryption
      disable_snapshot_annotations = true

      # Default OCI runtime
      default_runtime_name = "runc"

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]

        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
          runtime_type = "io.containerd.runc.v2"
          # Discard any potentially stale shim sockets on restart
          privileged_without_host_devices = false

          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            # Use systemd cgroup driver.  This MUST match the kubelet
            # cgroupDriver setting (systemd).  Mismatches cause containers
            # to be created in the wrong cgroup hierarchy.
            SystemdCgroup = true

            # Path to the runc binary in the Guix store.
            # The image assembly module patches this path.
            BinaryName = "/gnu/store/placeholder-runc/sbin/runc"

    # CNI plugin configuration
    [plugins."io.containerd.grpc.v1.cri".cni]
      # Directory containing CNI plugin binaries.
      # Standard plugins (bridge, loopback, host-local, portmap) are
      # installed here by the andyl-cni-plugins package.
      # CNI init containers (e.g., Cilium) may install additional
      # binaries here at runtime.
      bin_dir = "/opt/cni/bin"

      # Directory containing CNI configuration files.
      # This directory is EMPTY in the base image.  The deployed CNI
      # plugin (Cilium, Calico, Flannel) writes its configuration here
      # at runtime.  This directory is on the /etc overlay (mutable).
      conf_dir = "/etc/cni/net.d"

    # Registry configuration
    [plugins."io.containerd.grpc.v1.cri".registry]
      # Per-host registry configuration (TLS certificates, mirrors).
      # Place per-registry config at /etc/containerd/certs.d/<host>/
      config_path = "/etc/containerd/certs.d"

  # Opt directory for additional containerd plugins
  [plugins."io.containerd.internal.v1.opt"]
    path = "/var/lib/containerd/opt"
