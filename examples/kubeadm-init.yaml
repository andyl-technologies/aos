# ANDYL OS -- kubeadm init Configuration
#
# Example kubeadm init configuration for bootstrapping a Kubernetes
# control plane on ANDYL OS.  This file is used with:
#
#   kubeadm init --config /path/to/kubeadm-init.yaml
#
# In production, this configuration is delivered via Ignition to the
# control plane node and customized per-cluster with:
#   - API server advertise address
#   - etcd initial cluster endpoints
#   - Certificate SANs for the API server
#   - Pod and service CIDR ranges
#
# After kubeadm init completes:
#   1. Node is in NotReady state (no CNI deployed)
#   2. Deploy CNI plugin: helm install cilium cilium/cilium ...
#   3. Node transitions to Ready
#   4. Join worker nodes: kubeadm join ...
#
# See:
#   RFC-0007 sections 5, 6 (Static Pods, etcd)
#   Phase 7 section 7.12 (Single-Node Cluster Test)

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: InitConfiguration

# Node registration settings
nodeRegistration:
  # Use containerd as the CRI runtime
  criSocket: "unix:///run/containerd/containerd.sock"
  # Apply standard ANDYL OS node labels
  kubeletExtraArgs:
    node-labels: "node.andyl.internal/os=andyl-os,node.andyl.internal/role=control-plane"
    root-dir: "/var/lib/kubelet"
    v: "2"
  # Taint control plane to prevent workload scheduling
  taints:
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"

# Local API endpoint
localAPIEndpoint:
  # Replace with the actual IP address of this control plane node.
  # Delivered via Ignition per-machine.
  advertiseAddress: "10.0.1.1"
  bindPort: 6443

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration

# Kubernetes version must match the installed kubelet/kubeadm version
kubernetesVersion: "v1.31.4"

# Cluster name
clusterName: "andyl-cluster"

# Control plane endpoint (load balancer for HA, or single node IP)
# Replace with actual endpoint. Use a DNS name for HA setups.
controlPlaneEndpoint: "k8s-api.andyl.internal:6443"

# Network configuration
networking:
  # Pod network CIDR -- must not overlap with node or service CIDRs.
  # This CIDR is used by the CNI plugin for pod IP allocation.
  podSubnet: "10.244.0.0/16"
  # Service CIDR -- virtual IPs for Kubernetes services.
  serviceSubnet: "10.96.0.0/12"
  # DNS domain for the cluster
  dnsDomain: "cluster.local"

# Certificate directory -- on mutable /var
certificatesDir: "/var/lib/kubernetes/pki"

# etcd configuration (local stacked topology)
etcd:
  local:
    dataDir: "/var/lib/etcd"
    extraArgs:
      # Performance tuning for etcd
      quota-backend-bytes: "8589934592"    # 8 GiB
      auto-compaction-mode: "periodic"
      auto-compaction-retention: "8"       # 8 hours
      snapshot-count: "10000"
      max-snapshots: "5"
      max-wals: "5"

# API server configuration
apiServer:
  # Additional SANs for the API server certificate.
  # Include all hostnames and IPs that clients use to reach the API server.
  certSANs:
    - "k8s-api.andyl.internal"
    - "10.0.1.1"
    - "127.0.0.1"
    - "localhost"
  extraArgs:
    # Enable PodSecurity admission controller
    enable-admission-plugins: "NodeRestriction,PodSecurity"
    # Audit logging
    audit-log-path: "/var/log/kubernetes/audit.log"
    audit-log-maxage: "30"
    audit-log-maxbackup: "10"
    audit-log-maxsize: "100"
    # Feature gates
    feature-gates: "GracefulNodeShutdownBasedOnPodPriority=true"
  extraVolumes:
    - name: audit-log
      hostPath: "/var/log/kubernetes"
      mountPath: "/var/log/kubernetes"
      pathType: DirectoryOrCreate

# Controller manager configuration
controllerManager:
  extraArgs:
    # Allocate pod CIDRs to nodes
    allocate-node-cidrs: "true"
    node-cidr-mask-size: "24"
    # Feature gates
    feature-gates: "GracefulNodeShutdownBasedOnPodPriority=true"

# Scheduler configuration
scheduler:
  extraArgs:
    feature-gates: "GracefulNodeShutdownBasedOnPodPriority=true"

---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

# Container runtime
containerRuntimeEndpoint: "unix:///run/containerd/containerd.sock"
cgroupDriver: "systemd"

# Cluster DNS (CoreDNS service IP)
clusterDNS:
  - "10.96.0.10"
clusterDomain: "cluster.local"

# Static pod manifests (control plane components)
staticPodPath: "/etc/kubernetes/manifests"

# Logging
containerLogMaxSize: "50Mi"
containerLogMaxFiles: 5

# Authentication and authorization
authentication:
  x509:
    clientCAFile: "/var/lib/kubernetes/pki/ca.crt"
  webhook:
    enabled: true
    cacheTTL: "2m0s"
  anonymous:
    enabled: false
authorization:
  mode: "Webhook"

# Resource management
systemReserved:
  cpu: "500m"
  memory: "512Mi"
  ephemeral-storage: "1Gi"
kubeReserved:
  cpu: "500m"
  memory: "512Mi"
  ephemeral-storage: "1Gi"

# Eviction thresholds
evictionHard:
  memory.available: "256Mi"
  nodefs.available: "10%"
  imagefs.available: "15%"
evictionSoft:
  memory.available: "512Mi"
  nodefs.available: "15%"
  imagefs.available: "20%"
evictionSoftGracePeriod:
  memory.available: "1m"
  nodefs.available: "1m"
  imagefs.available: "1m"

# Immutable OS hardening
protectKernelDefaults: true
readOnlyPort: 0
makeIPTablesUtilChains: false

# Node allocatable enforcement
enforceNodeAllocatable:
  - "pods"
  - "system-reserved"
  - "kube-reserved"

# Feature gates
featureGates:
  RotateKubeletServerCertificate: true
  GracefulNodeShutdown: true

# Graceful shutdown (integrates with systemd)
shutdownGracePeriod: "30s"
shutdownGracePeriodCriticalPods: "10s"
