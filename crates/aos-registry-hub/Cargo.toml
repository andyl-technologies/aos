[package]
name = "aos-registry-hub"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant AOS registry management WebUI and read index (RFC-0004)"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
lzma-rs = { workspace = true }
bzip2-rs = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
ciborium = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic", "limit"] }
clap = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
aos-core = { workspace = true }
aos-package = { workspace = true }
aos-registry-surface = { workspace = true }
aos-proto = { workspace = true }
connectrpc = { workspace = true }
buffa = { workspace = true }

[features]
default = []
# Enable the postgres / mysql sqlx Database backends (RFC-0004 phase 5). sqlite
# is always compiled in; these add the matching sqlx driver and the enum arm.
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]

[dev-dependencies]
aos-cache = { workspace = true }
# Migration tests stage old-schema sqlite files with raw rusqlite, then reopen
# them through the sqlx Database to assert the upgrade path (RFC-0004 Phase 5).
rusqlite = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
futures = { workspace = true }

[[bin]]
name = "aos-registry-hub"
path = "src/main.rs"
