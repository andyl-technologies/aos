[package]
name = "aos-registry-hub"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant AOS registry management WebUI and read index (RFC-0004)"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
ed25519-dalek = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic"] }
clap = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
aos-package = { workspace = true }
aos-proto = { workspace = true }
connectrpc = { workspace = true }
buffa = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
futures = { workspace = true }

[[bin]]
name = "aos-registry-hub"
path = "src/main.rs"
