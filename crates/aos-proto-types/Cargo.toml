[package]
name = "aos-proto-types"
version = "0.1.0"
edition = "2021"
description = "wasm-clean message structs for the aos.hub.v1 API: generated from the .proto with prost-build + serde, the Connect-JSON lingua franca shared by the native hub, the Cloudflare Worker, and aos-remote — no connectrpc/buffa runtime"

[dependencies]
prost = { workspace = true }
serde = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
