[package]
name = "crucible-ram"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
thiserror = { workspace = true }

[features]
test-support = ["dep:sha2", "dep:serde_json"]

[dependencies.sha2]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[[example]]
name = "ram-hash-benchmark"
path = "examples/ram_hash_benchmark.rs"
required-features = ["test-support"]

[dev-dependencies]
crucible-linux-resource = { path = "../crucible-linux-resource", default-features = false, features = ["test-support"] }
