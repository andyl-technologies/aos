[package]
name = "crucible-daemon"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
crucible = { path = "../crucible" }
crucible-api = { path = "../crucible-api" }
crucible-campaign = { path = "../crucible-campaign" }
crucible-cas = { workspace = true }
crucible-qemu = { path = "../crucible-qemu" }
rustix = { workspace = true, features = ["net"] }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
crucible = { path = "../crucible", features = ["test-double"] }
crucible-protocol = { path = "../crucible-protocol" }
crucible-qemu = { path = "../crucible-qemu", features = ["test-support"] }
crucible-shmem = { path = "../crucible-shmem" }
crucible-session = { path = "../crucible-session" }
tempfile = { workspace = true }
tokio = { workspace = true }
