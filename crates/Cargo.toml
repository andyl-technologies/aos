[workspace]
resolver = "2"
members = [
    "aos",
    "aos-core",
    "aos-nix",
    "aos-nix-syntax",
    "aos-nix-compat",
    "aos-nix-harness",
    "ratchet-core",
    "ratchet-dialect",
    "ratchet-cache",
    "ratchet-jit",
    "ratchet-runtime-ffi",
    "aos-nix-dialect",
    "ratchet-value",
    "ratchet-oracle",
    "aos-net",
    "aos-proto",
    "aos-server",
    "aos-cache",
    "aos-remote",
    "aos-doc",
    "aos-package",
    "aos-systemd",
]

[workspace.dependencies]
# Shared dependencies
anyhow = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "signal", "macros", "net", "io-util", "fs", "time"] }
crossbeam-deque = "0.8"
md-5 = "0.11"
sha1 = "0.10"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
regex = "1"
stacker = "0.1.24"
glob = "0.3"
ignore = "0.4"
proptest = "1"
hex = "0.4"
bzip2 = { version = "0.5", features = ["static"] }
flate2 = "1"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
indicatif = "0.17"
console = "0.15"
humantime = "2"
humantime-serde = "1"
tracing = "0.1"
alejandra = "3.1.0"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
nix-compat = { git = "https://git.snix.dev/snix/snix.git", rev = "f9a731021455c402430af1aa1ab749fd2f66293d", package = "nix-compat", default-features = false }

# HTTP / networking
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
async-trait = "0.1"
futures-util = "0.3"

# D-Bus (systemd client). default-features=false drops the async-io reactor so
# zbus runs on the existing tokio runtime instead of a second event loop.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
zstd = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tower = { version = "0.5", features = ["util"] }

# Cache backends
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
aws-sdk-s3 = "1"
aws-config = "1"
suppaftp = { version = "6", features = ["async-rustls"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
atty = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Package manager
toml = "0.8"
semver = "1"

# Code generation
cranelift-codegen = "=0.127.4"
cranelift-jit = "=0.127.4"
cranelift-module = "=0.127.4"
cranelift-native = "=0.127.4"
target-lexicon = "=0.13.5"

# Dev
tempfile = "3"
libc = "0.2"
loom = "0.7"

# ConnectRPC
connectrpc = { version = "0.3", features = ["server", "client", "client-tls", "axum"] }
buffa = "0.3"
prost = "0.13"
futures = "0.3"
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = "0.26"
rcgen = "0.14"

# Internal crates
aos-core = { path = "aos-core" }
aos-nix = { path = "aos-nix" }
aos-nix-syntax = { path = "aos-nix-syntax" }
aos-nix-compat = { path = "aos-nix-compat" }
aos-nix-harness = { path = "aos-nix-harness" }
ratchet-core = { path = "ratchet-core" }
ratchet-dialect = { path = "ratchet-dialect" }
ratchet-cache = { path = "ratchet-cache" }
ratchet-jit = { path = "ratchet-jit" }
ratchet-runtime-ffi = { path = "ratchet-runtime-ffi" }
aos-nix-dialect = { path = "aos-nix-dialect" }
ratchet-value = { path = "ratchet-value" }
ratchet-oracle = { path = "ratchet-oracle" }
aos-net = { path = "aos-net" }
aos-proto = { path = "aos-proto" }
aos-server = { path = "aos-server" }
aos-cache = { path = "aos-cache" }
aos-remote = { path = "aos-remote" }
aos-doc = { path = "aos-doc" }
aos-package = { path = "aos-package" }
aos-systemd = { path = "aos-systemd" }

[profile.release]
lto = "thin"
codegen-units = 1
