[workspace]
resolver = "2"
exclude = ["accache"]
members = [
    "activation/aos-activation",
    "activation/aos-activation-bpf-lsm",
    "activation/aos-activation-bpf-network",
    "activation/aos-activation-config-files",
    "activation/aos-activation-crucible",
    "activation/aos-activation-filesystem",
    "activation/aos-activation-kubernetes",
    "activation/aos-activation-nftables",
    "activation/aos-activation-nix-store",
    "activation/aos-activation-storage",
    "activation/aos-activation-sysctl",
    "activation/aos-activation-systemd",

    "artifacts/aos-artifact-evidence",
    "artifacts/aos-nar",
    "artifacts/aos-oci",
    "artifacts/aos-oci-types",

    "bindings/libssh2-sys",

    "boot/aos-boot-identity",
    "boot/aos-boot-runtime",
    "boot/aos-configuration-image",
    "boot/aos-platform-metadata",
    "boot/aos-recovery",
    "boot/aos-storage-layout",

    "cli/aos-cli",
    "cli/aos-cli-ui",
    "cli/aos-closure-analysis",
    "cli/aos-nix-docs",

    "core/aos-core",

    "crucible/crucible-campaign",
    "crucible/crucible-cli",
    "crucible/crucible-control-api",
    "crucible/crucible-control-client",
    "crucible/crucible-control-server",
    "crucible/crucible-daemon",
    "crucible/crucible-determinism",
    "crucible/crucible-device",
    "crucible/crucible-engine",
    "crucible/crucible-guest",
    "crucible/crucible-host-resources",
    "crucible/crucible-qemu-debug-gateway",
    "crucible/crucible-qemu-host",
    "crucible/crucible-qemu-plugin",
    "crucible/crucible-qemu-protocol",
    "crucible/crucible-qemu-shmem",
    "crucible/crucible-ram",
    "crucible/crucible-session",
    "crucible/crucible-sqlite-heap",
    "crucible/crucible-store",
    "crucible/crucible-store-s3",
    "crucible/crucible-test-support",

    "hub/aos-hub-api",
    "hub/aos-hub-client",
    "hub/aos-hub-console",
    "hub/aos-hub-db",
    "hub/aos-hub-model",
    "hub/aos-hub-native",
    "hub/aos-hub-service",
    "hub/aos-hub-ui",
    "hub/aos-hub-worker",

    "linux/aos-linux-project-quota",
    "linux/aos-systemd-client",

    "modules/aos-module-docs",
    "modules/aos-module-format",

    "nix/aos-nix",

    "packages/aos-build-api",
    "packages/aos-build-client",
    "packages/aos-build-server",
    "packages/aos-deployment",
    "packages/aos-deployment-format",
    "packages/aos-nix-cache",
    "packages/aos-package-manager",

    "registry/aos-registry-authoring",
    "registry/aos-registry-client",
    "registry/aos-registry-format",
    "registry/aos-registry-web",

    "release/aos-image-finalizer",
    "release/aos-package-maintenance",
    "release/aos-release-coordinator",
    "release/aos-release-format",
    "release/aos-release-signer",

    "transfer/aos-transfer",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
regex-syntax = "=0.8.11"
regex-automata = "=0.4.14"
crucible-ram = { path = "crucible/crucible-ram" }
crucible-host-resources = { path = "crucible/crucible-host-resources" }
crucible-sqlite-heap = { path = "crucible/crucible-sqlite-heap" }
# Shared dependencies
anyhow = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# `application/x-www-form-urlencoded` (de)serialization — the same decoder
# axum 0.8's `Form` extractor uses, so hand-routing a form body to a shared
# handler reproduces axum's parsing exactly.
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "signal", "macros", "net", "io-util", "io-std", "fs", "time"] }
sha2 = { version = "0.10", features = ["compress"] }
sha1 = "0.10"
md-5 = "0.11"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
hmac = "0.12"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1"
regex = "1"
rnix = "0.10"
glob = "0.3"
ignore = "0.4"
hex = "0.4"
rustix = { version = "1.1.4", features = ["event", "fs"] }
indicatif = "0.17"
console = "0.15"
humantime = "2"
humantime-serde = "1"
tracing = "0.1"
alejandra = "3.1.0"

# HTTP / networking
bytes = "1"
http-body-util = "0.1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
url = "2"
unicode-normalization = "0.1"
async-trait = "0.1"
futures-util = "0.3"

# D-Bus (systemd client). default-features=false drops the async-io reactor so
# zbus runs on the existing tokio runtime instead of a second event loop.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Async SQL toolkit implementing aos-hub-db's native Backend over concrete pools.
# SQLite is enabled by aos-hub-db; aos-hub-native selects optional PostgreSQL
# and MySQL drivers through the database crate's features. runtime-tokio reuses
# the native application's existing Tokio runtime.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
# Used by aos-build-server and crucible-store, and by Hub database/native
# migration fixtures. Production Hub database operations use SQLx.
rusqlite = "0.32"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# Pure-Rust Argon2id password hashing for the registry-hub PASSWORD auth path
# (RFC-0004; the operator-requested reversal of the original "no passwords"
# stance). PHC-string output, constant-time verify.
argon2 = "0.5"
# In-house WebAuthn RP verifier (RFC-0004 passkeys, attestation: none). These
# round out the COSE signature algorithms beyond Ed25519 (already present):
# p256 for ES256 ECDSA, rsa for RS256 PKCS#1v1.5, and ciborium as the CBOR
# decoder for COSE keys + the attestationObject. All are pure-Rust RustCrypto
# crates, wasm-clean for the Workers target.
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2"
# `zstdmt` enables multi-threaded compression for apr's parallel NAR generation.
zstd = { version = "0.13", features = ["zstdmt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tower = { version = "0.5", features = ["util"] }

# Cache backends
ssh2 = "0.9"
# Keep the modern HTTPS client and signing features without the SDK's legacy
# rustls 0.21 compatibility connector; clients use BehaviorVersion::latest().
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = "1"
aws-credential-types = "1"
aws-types = "1"
suppaftp = { version = "6", features = ["async-rustls"] }

# TUI
ratatui = "0.30.2"
crossterm = "0.29"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Package manager
toml = "0.8"
toml_edit = "0.22"
semver = "1"
# Git access for the apm/apr registry. libgit2 (vendored, built with
# -DEXPERIMENTAL_SHA256=ON via unstable-sha256) drives local object/ref
# operations and the git://+ssh:// smart transports; the registry's static
# dumb-HTTP(S) layout is read by our own loose-object walker since libgit2
# speaks only smart HTTP. unstable-sha256 is an ABI-breaking feature, enabled
# here because the registry is SHA-256-only.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "unstable-sha256"] }
# SSHSIG signing/verification (`gpg.format=ssh`) in pure Rust, replacing
# shell-outs to `git verify-commit`/`verify-tag` and `ssh-keygen -Y`.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
# Tar archive writing for the `git archive`-equivalent tree extraction.
tar = "0.4"
# Data-parallelism for building thin-pack candidate strategies in parallel.
rayon = "1"

# zlib (de)compression for loose git objects (dumb-HTTP reader + hub indexer);
# pure-Rust rust_backend so it stays wasm-clean for the Cloudflare Worker.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
bzip2 = { version = "0.5", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
# Pure-Rust NAR decompressors used by the mirror/pull-through to verify a
# compressed NAR's *decompressed* bytes against the signed NarHash (sec CR-1).
# In-process (no subprocess) so the verification path cannot be subverted by a
# missing/hijacked external binary, and pure-Rust to stay wasm-clean.
lzma-rs = "0.3"
bzip2-rs = "0.1"

# Dev
tempfile = "3"
libc = "0.2"

# ConnectRPC
connectrpc = { version = "0.9.1", features = ["server", "client", "client-tls", "axum"] }
buffa = "0.9.2"
prost = "0.13"
prost-build = "0.13"
pbjson = "0.7"
pbjson-build = "0.7"
futures = "0.3"
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = "0.26"
rcgen = "0.14"

# Internal crates
aos-module-format = { path = "modules/aos-module-format" }
aos-activation = { path = "activation/aos-activation" }
aos-activation-crucible = { path = "activation/aos-activation-crucible" }
aos-package-maintenance = { path = "release/aos-package-maintenance" }
crucible-store = { path = "crucible/crucible-store" }
aos-linux-project-quota = { path = "linux/aos-linux-project-quota" }
crucible-store-s3 = { path = "crucible/crucible-store-s3" }
crucible-campaign = { path = "crucible/crucible-campaign" }
aos-core = { path = "core/aos-core" }
aos-oci-types = { path = "artifacts/aos-oci-types" }
aos-oci = { path = "artifacts/aos-oci" }
aos-boot-identity = { path = "boot/aos-boot-identity" }
aos-transfer = { path = "transfer/aos-transfer", default-features = false }
aos-build-api = { path = "packages/aos-build-api" }
aos-hub-api = { path = "hub/aos-hub-api" }
aos-build-server = { path = "packages/aos-build-server" }
aos-nix-cache = { path = "packages/aos-nix-cache" }
aos-build-client = { path = "packages/aos-build-client" }
aos-nix-docs = { path = "cli/aos-nix-docs" }
aos-module-docs = { path = "modules/aos-module-docs" }
aos-package-manager = { path = "packages/aos-package-manager" }
aos-platform-metadata = { path = "boot/aos-platform-metadata" }
aos-storage-layout = { path = "boot/aos-storage-layout" }
aos-configuration-image = { path = "boot/aos-configuration-image" }
aos-activation-filesystem = { path = "activation/aos-activation-filesystem" }
aos-activation-nix-store = { path = "activation/aos-activation-nix-store" }
aos-hub-ui = { path = "hub/aos-hub-ui" }
aos-hub-service = { path = "hub/aos-hub-service" }
aos-hub-native = { path = "hub/aos-hub-native" }
aos-registry-format = { path = "registry/aos-registry-format" }
aos-release-format = { path = "release/aos-release-format" }
aos-release-signer = { path = "release/aos-release-signer" }
aos-image-finalizer = { path = "release/aos-image-finalizer" }
aos-closure-analysis = { path = "cli/aos-closure-analysis" }
aos-systemd-client = { path = "linux/aos-systemd-client" }
aos-activation-kubernetes = { path = "activation/aos-activation-kubernetes" }

aos-artifact-evidence = { path = "artifacts/aos-artifact-evidence" }
aos-nar = { path = "artifacts/aos-nar" }
aos-nix = { path = "nix/aos-nix" }
aos-cli-ui = { path = "cli/aos-cli-ui" }
aos-boot-runtime = { path = "boot/aos-boot-runtime" }
aos-release-coordinator = { path = "release/aos-release-coordinator" }
aos-deployment-format = { path = "packages/aos-deployment-format" }
aos-deployment = { path = "packages/aos-deployment" }
aos-registry-client = { path = "registry/aos-registry-client" }
aos-registry-authoring = { path = "registry/aos-registry-authoring" }
aos-hub-model = { path = "hub/aos-hub-model" }
aos-hub-db = { path = "hub/aos-hub-db" }
aos-hub-client = { path = "hub/aos-hub-client" }
crucible-control-client = { path = "crucible/crucible-control-client" }
crucible-control-server = { path = "crucible/crucible-control-server" }

[patch.crates-io]
libssh2-sys = { path = "bindings/libssh2-sys" }

[workspace.lints.clippy]
all = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"

# The topology-cutover E2E authenticates and bundles the actual `aos` test
# executable. Full dependency debug information makes that binary hundreds of
# MiB and unlike the release artifact operators deploy; tests keep assertions
# and backtraces while omitting linked DWARF from the executable under test.
[profile.test]
debug = 0
opt-level = "s"
