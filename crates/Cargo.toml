[workspace]
resolver = "2"
members = [
    "aos",
    "aos-core",
    "aos-boot-identity",
    "aos-recovery",
    "aos-net",
    "aos-proto",
    "aos-proto-types",
    "aos-server",
    "aos-cache",
    "aos-remote",
    "aos-doc",
    "aos-doc-model",
    "aos-package",
    "aos-hub-console-contract",
    "aos-hub-core",
    "aos-hub",
    "aos-registry-surface",
    "aos-registry-spa",
    "aos-hub-worker",
    "aos-hub-console",
    "aos-profile",
    "aos-systemd",
    "aos-filesystem-view",
    "aos-sandbox-core",
    "aos-sandbox-ownership-protocol",
    "aos-sandbox-protocol",
    "aos-sandbox",
    "aos-sandbox-linux",
    "aos-sandbox-broker",
    "aos-sandbox-host",
    "aos-sandbox-mount",
    "aos-sandbox-network",
    "aos-sandbox-storage",
    "crucible-cas",
    "crucible-sim",
    "crucible-assert",
    "crucible-shmem",
    "crucible-protocol",
    "crucible-device",
    "crucible-debug-gateway",
    "crucible-qemu",
    "crucible-qemu-plugin",
    "crucible-guest",
    "crucible",
    "crucible-session",
    "crucible-api",
    "crucible-daemon",
    "crucible-cli",
    "crucible-harness",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
# Shared dependencies
anyhow = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# `application/x-www-form-urlencoded` (de)serialization — the same decoder
# axum 0.8's `Form` extractor uses, so hand-routing a form body to a shared
# handler reproduces axum's parsing exactly.
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "signal", "macros", "net", "io-util", "io-std", "fs", "time"] }
sha2 = { version = "0.10", features = ["compress"] }
sha1 = "0.10"
md-5 = "0.11"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
hmac = "0.12"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1"
regex = "1"
glob = "0.3"
ignore = "0.4"
hex = "0.4"
rustix = { version = "1.1.4", features = ["fs"] }
indicatif = "0.17"
console = "0.15"
humantime = "2"
humantime-serde = "1"
tracing = "0.1"
alejandra = "3.1.0"

# HTTP / networking
bytes = "1"
http-body-util = "0.1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
unicode-normalization = "0.1"
async-trait = "0.1"
futures-util = "0.3"

# D-Bus (systemd client). default-features=false drops the async-io reactor so
# zbus runs on the existing tokio runtime instead of a second event loop.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Async SQL toolkit driving the registry-hub `Backend` over concrete pools
# (RFC-0004 phase 5, step 3b). The per-engine driver features (sqlite/postgres/
# mysql) are selected by `aos-hub`'s own cargo features; the bundled
# sqlite driver is pure-Rust and needs no system library. `runtime-tokio` reuses
# the existing tokio runtime rather than spawning a second reactor.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
# Still used by aos-package, aos-server, and aos-hub-worker; the registry
# hub moved off it to sqlx (RFC-0004 Phase 5 step 3b).
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# Pure-Rust Argon2id password hashing for the registry-hub PASSWORD auth path
# (RFC-0004; the operator-requested reversal of the original "no passwords"
# stance). PHC-string output, constant-time verify.
argon2 = "0.5"
# In-house WebAuthn RP verifier (RFC-0004 passkeys, attestation: none). These
# round out the COSE signature algorithms beyond Ed25519 (already present):
# p256 for ES256 ECDSA, rsa for RS256 PKCS#1v1.5, and ciborium as the CBOR
# decoder for COSE keys + the attestationObject. All are pure-Rust RustCrypto
# crates, wasm-clean for the Workers target.
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2"
# `zstdmt` enables multi-threaded compression for apr's parallel NAR generation.
zstd = { version = "0.13", features = ["zstdmt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tower = { version = "0.5", features = ["util"] }

# Cache backends
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
aws-sdk-s3 = "1"
aws-config = "1"
suppaftp = { version = "6", features = ["async-rustls"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
atty = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Package manager
toml = "0.8"
semver = "1"
# Git access for the apm/apr registry. libgit2 (vendored, built with
# -DEXPERIMENTAL_SHA256=ON via unstable-sha256) drives local object/ref
# operations and the git://+ssh:// smart transports; the registry's static
# dumb-HTTP(S) layout is read by our own loose-object walker since libgit2
# speaks only smart HTTP. unstable-sha256 is an ABI-breaking feature, enabled
# here because the registry is SHA-256-only.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "unstable-sha256"] }
# SSHSIG signing/verification (`gpg.format=ssh`) in pure Rust, replacing
# shell-outs to `git verify-commit`/`verify-tag` and `ssh-keygen -Y`.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
# Tar archive writing for the `git archive`-equivalent tree extraction.
tar = "0.4"
# Data-parallelism for building thin-pack candidate strategies in parallel.
rayon = "1"

# zlib (de)compression for loose git objects (dumb-HTTP reader + hub indexer);
# pure-Rust rust_backend so it stays wasm-clean for the Cloudflare Worker.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
bzip2 = { version = "0.5", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
# Pure-Rust NAR decompressors used by the mirror/pull-through to verify a
# compressed NAR's *decompressed* bytes against the signed NarHash (sec CR-1).
# In-process (no subprocess) so the verification path cannot be subverted by a
# missing/hijacked external binary, and pure-Rust to stay wasm-clean.
lzma-rs = "0.3"
bzip2-rs = "0.1"

# Dev
tempfile = "3"
libc = "0.2"

# ConnectRPC
connectrpc = { version = "0.3", features = ["server", "client", "client-tls", "axum"] }
buffa = "0.3"
prost = "0.13"
prost-build = "0.13"
pbjson = "0.7"
pbjson-build = "0.7"
futures = "0.3"
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = "0.26"
rcgen = "0.14"

# Internal crates
crucible-cas = { path = "crucible-cas" }
aos-core = { path = "aos-core" }
aos-boot-identity = { path = "aos-boot-identity" }
aos-net = { path = "aos-net" }
aos-proto = { path = "aos-proto" }
aos-proto-types = { path = "aos-proto-types" }
aos-server = { path = "aos-server" }
aos-cache = { path = "aos-cache" }
aos-remote = { path = "aos-remote" }
aos-doc = { path = "aos-doc" }
aos-doc-model = { path = "aos-doc-model" }
aos-package = { path = "aos-package" }
aos-hub-console-contract = { path = "aos-hub-console-contract" }
aos-hub-core = { path = "aos-hub-core" }
aos-hub = { path = "aos-hub" }
aos-registry-surface = { path = "aos-registry-surface" }
aos-profile = { path = "aos-profile" }
aos-systemd = { path = "aos-systemd" }
aos-filesystem-view = { path = "aos-filesystem-view" }
aos-sandbox-core = { path = "aos-sandbox-core" }
aos-sandbox-ownership-protocol = { path = "aos-sandbox-ownership-protocol" }
aos-sandbox-protocol = { path = "aos-sandbox-protocol" }
aos-sandbox = { path = "aos-sandbox" }
aos-sandbox-broker = { path = "aos-sandbox-broker" }
aos-sandbox-mount = { path = "aos-sandbox-mount" }
aos-sandbox-network = { path = "aos-sandbox-network" }
aos-sandbox-storage = { path = "aos-sandbox-storage" }
aos-sandbox-linux = { path = "aos-sandbox-linux" }
aos-sandbox-host = { path = "aos-sandbox-host" }

[workspace.lints.clippy]
all = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"

# The topology-cutover E2E authenticates and bundles the actual `aos` test
# executable. Full dependency debug information makes that binary hundreds of
# MiB and unlike the release artifact operators deploy; tests keep assertions
# and backtraces while omitting linked DWARF from the executable under test.
[profile.test]
debug = 0
opt-level = "s"
