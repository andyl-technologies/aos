# Cloudflare Workers config for the AOS registry hub Worker (RFC-0004).
#
# PREFER THE INSTALLER. `aos-registry-hub cloudflare install` (the
# `aos-registry-hub-cloudflare` package) generates this config over the prebuilt
# wasm dist, provisions the resources, sets the secrets, and runs /_init — see
# deploy/DEPLOY.md. This checked-in file is for the manual `wrangler deploy`
# path; its placeholder ids are not real and must be replaced.
#
# Runtime configuration the Worker reads (the installer sets these for you):
#   HUB_JWT_SECRET      (secret, required) HS256 JWT signing key
#   HUB_SEAL_KEY        (secret, required) at-rest AES-GCM sealing key
#   HUB_EXTERNAL_URL    ([vars], required) externally-reachable base URL
#   HUB_ROOT_EMAIL      ([vars], optional) bootstrap root admin email
#   HUB_ROOT_PASSWORD   (secret, optional) bootstrap root admin password
#   HUB_EMAIL_API_URL   ([vars], optional) magic-link email relay endpoint
#   HUB_EMAIL_API_TOKEN (secret, optional) bearer token for the relay
# Set secrets with `wrangler secret put <NAME>`; put [vars] in this file.
#
# Live validation requires a Cloudflare account; none of this can be validated
# in a sandbox — see README.md and deploy/DEPLOY.md.

name = "aos-registry-hub"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

# Build the Rust cdylib to wasm with the workers-rs wasm-pack pipeline.
# `worker-build` (installed via `cargo install worker-build`) wraps
# `cargo build --target wasm32-unknown-unknown` + wasm-bindgen and emits the JS
# shim wrangler loads.
[build]
command = "worker-build --release"

# The D1 (sqlite) database. The binding name must match
# `handlers::bindings::D1` (REGISTRY_DB). Apply the schema once after deploy by
# requesting `GET /_init`, which constructs the shared
# `aos_registry_core::db::Database` over D1 and applies the exact `MIGRATIONS`
# the native hub uses (tracked in the `schema_version` table). This is the
# single source of truth for the schema — there is intentionally no separate
# `migrations_dir`, since a hand-maintained wrangler migration would diverge
# from core's `MIGRATIONS` (which the worker's reads and indexer now run
# against) and the two version-tracking systems would conflict.
[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "aos-registry-hub"
database_id = "00000000-0000-0000-0000-000000000000"  # replace with your D1 id

# The R2 bucket that holds the registry surfaces (the zero-egress facade
# source). The binding name must match `handlers::bindings::R2`
# (REGISTRY_BUCKET). Registries are prefixes within this shared bucket.
[[r2_buckets]]
binding = "REGISTRY_BUCKET"
bucket_name = "aos-registry-surfaces"

# KV for human sessions (RFC-0004 "KV holds sessions"). The read path does not
# require it for public registries; it is bound here for the deferred
# private-registry auth path. The binding name matches
# `handlers::bindings::KV_SESSIONS` (SESSIONS).
[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000000"  # replace with your KV namespace id

# The Cron trigger that drives the indexer (RFC-0004 "Cron Triggers/Queues
# drive the indexer"). Every 15 minutes re-walks every public registry's R2
# surface into D1. Fires the `scheduled` event handler.
[triggers]
crons = ["*/15 * * * *"]
