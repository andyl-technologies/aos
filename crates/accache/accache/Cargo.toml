[package]
name = "accache"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Daemonless compiler action cache for declared Nix build environments"

[dependencies]
accache-frontend = { path = "../accache-frontend" }
anyhow = "1"
hex = "0.4"
prost = "0.13"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
