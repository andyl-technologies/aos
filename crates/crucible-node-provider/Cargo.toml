[package]
name = "crucible-node-provider"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
autobins = false

[[bin]]
name = "crucible-node-conformance"
path = "src/bin/crucible-node-conformance.rs"

[[bin]]
name = "crucible-reference-device"
path = "src/bin/crucible-reference-device.rs"

[[bin]]
name = "crucible-reference-manifest"
path = "src/bin/crucible-reference-manifest.rs"

[[bin]]
name = "crucible-reference-provider"
path = "src/bin/crucible-reference-provider.rs"

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
crucible-node-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rustix = { workspace = true, features = ["net", "process"] }
