[package]
name = "aos-sandbox"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Selects reserved remote placement, transport and watch adapters explicitly.
# Local lease issuance and snapshot inventory remain available without it.
multi-node = ["aos-proto/multi-node"]
# Compiles private fixed-helper mechanics without installing an authority caller.
git-helper-mechanics = []
# Run explicitly in the AOS kernel-test VM, outside the package-build sandbox.
kernel-tests = ["aos-sandbox-linux/kernel-tests"]
# Enables a private-directory protected-journal opener for dependent crate tests.
test-fixtures = []
# Only the isolated KVM fixture can prepare an inert Cache hold and empty manifest.
cache-physical-join-vm-fixture = []
# Only a debug VM probe can seed nonauthorizing original-Effect history.
project-negative-recovery-vm-fixture = []

[dependencies]
aos-filesystem-view-core.workspace = true
aos-proto.workspace = true
aos-sandbox-agent.workspace = true
aos-sandbox-guest.workspace = true
aos-sandbox-broker-session-protocol.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-journal.workspace = true
aos-sandbox-policy.workspace = true
aos-sandbox-ownership-protocol.workspace = true
aos-sandbox-ownership.workspace = true
aos-sandbox-protocol.workspace = true
aos-sandbox-source-provider-ledger.workspace = true
aos-sandbox-source-provider-protocol.workspace = true
axum.workspace = true
buffa.workspace = true
connectrpc.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
futures.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "process", "rand", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aos-sandbox-linux.workspace = true
aos-systemd.workspace = true
base64.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
rand.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
aos-sandbox-journal = { workspace = true, features = ["test-fixtures"] }
hex.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
