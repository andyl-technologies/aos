[package]
name = "aos-sandbox"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Run explicitly in the AOS kernel-test VM, outside the package-build sandbox.
kernel-tests = ["aos-sandbox-linux/kernel-tests"]

[dependencies]
aos-proto.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-ownership-protocol.workspace = true
aos-sandbox-protocol.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aos-sandbox-linux.workspace = true
rand.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["net"] }
buffa.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true

[lints]
workspace = true
