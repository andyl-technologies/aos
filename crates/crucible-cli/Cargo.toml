[package]
name = "crucible-cli"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
test-double = ["crucible-session/test-double"]

[[bin]]
name = "crucible"
path = "src/main.rs"

[[test]]
name = "machine_readable"
path = "tests/machine_readable.rs"
required-features = ["test-double"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
crucible-api = { path = "../crucible-api" }
crucible-session = { path = "../crucible-session" }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
crucible-harness = { path = "../crucible-harness" }
crucible-protocol = { path = "../crucible-protocol" }
libc = { workspace = true }
serde_json = { workspace = true }
