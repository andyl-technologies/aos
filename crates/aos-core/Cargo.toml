[package]
name = "aos-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
native-eval = ["dep:aos-nix"]
# RFC-0007 Candidate-C value-ABI cutover variant (task #12): implies native-eval
# and forwards to aos-nix; gates the native JIT off by construction under the
# variant (see `EvalConfig::native_jit`).
candidate_c_value = ["native-eval", "aos-nix/candidate_c_value"]
# Default-off serial Apply/GenList active packed-thunk experiment.
active_packed_thunk_probe = ["candidate_c_value", "aos-nix/active_packed_thunk_probe"]

[dependencies]
anyhow = { workspace = true }
aos-nix-compat = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
humantime = { workspace = true }
alejandra = { workspace = true }
tokio = { workspace = true }
atty = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
aos-nix = { workspace = true, optional = true }

[dev-dependencies]
