[package]
name = "aos-configuration-image"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Deterministic configuration images, verified boot mounting, and certificate bundles"

[dependencies]
aos-core.workspace = true
anyhow.workspace = true
aos-activation.workspace = true
base64.workspace = true
rustix = {workspace = true, features = ["fs", "process"]}
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "aos-configuration-mount"
path = "src/mount_main.rs"

[[bin]]
name = "aos-configuration-boot"
path = "src/boot_main.rs"

[[bin]]
name = "aos-certificate-bundle"
path = "src/certificate_main.rs"

# Keep the installed command stable when its Cargo package is renamed.
[[bin]]
name = "aos-configuration-lower"
path = "src/main.rs"
