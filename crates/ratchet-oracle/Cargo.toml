[package]
name = "ratchet-oracle"
version = "0.1.0"
edition = "2024"

[features]
default = []
# RFC-0007 Candidate-C value-ABI cutover variant (task #12): forwards the
# one-word carrier to `ratchet-value` and the matching layout descriptor to
# `ratchet-core`. Both are enabled together so the runtime never sees an 8-byte
# `Value` under a 16-byte layout descriptor (or vice-versa).
candidate_c_value = [
  "ratchet-value/candidate_c_value",
  "ratchet-core/candidate_c_value",
]
# Default-off serial execution experiment for fixed-capacity packed Apply and
# GenListElemAtAddOne thunk lanes.
active_packed_thunk_probe = ["candidate_c_value"]
# Compile-time-only peak locator for RFC-0007 memory experiments. Ordinary
# builds omit its counters, samples, fields, and allocation-path branches.
peak_ordinal_probe = []
# Compile-time-only Ready-import ownership and reuse-window census. The feature
# depends on Candidate C because the primary experiment projects its compressed
# values and headerless typed-thunk heads.
ready_exclusive_probe = ["candidate_c_value"]
# Compile-time-only projected duplicate-work census for maximal-laziness
# experiments. Ordinary builds omit its maps, timers, fields, and force hooks.
maximal_laziness_probe = ["candidate_c_value"]
# Compile-time-only allocation-byte and statepoint shadow census for the
# requested-attribute demand epoch.
demand_region_shadow_probe = ["candidate_c_value"]
# Compile-time-only report shadow that selects the four guard-heaviest
# whole-demand callers and links their bounded runtime code identities. It
# reuses the demand-region observation hooks and never dispatches a plan.
whole_demand_trace_shadow_probe = ["demand_region_shadow_probe"]
# Compile-time-only checkpoint aggregate for chronological lifetime-cohort
# experiments. Ordinary builds omit every field, scan, and branch.
lifetime_cohort_probe = ["candidate_c_value"]
# Compile-time-only root-session continuation coverage shadow. Successful
# finalConfig canary completions are counted at their nested production site
# and reconciled only after the root evaluator has fully unwound.
root_continuation_probe = ["candidate_c_value"]
# Compile-time-only no-collection preflight and coverage-only outer dispatcher
# skeleton. The runtime door leaves ordinary evaluation byte-for-byte inert.
collection_poll_probe = ["candidate_c_value"]
# Compile-time-only read-only projection of a compact evacuation destination
# at the final import peak-band root census.
compact_destination_probe = ["candidate_c_value"]
# Compile-time-only all-object immutable-cohort packing projection. The probe
# observes final-config epochs but never moves, retires, or publishes values.
immutable_cohort_projection_probe = ["candidate_c_value"]
# Compile-time-only read-only planner for a same-layout moving evacuation.
# The planner computes forwarding metadata and dense lane accounting but never
# allocates a destination or mutates the evaluator heap. Its execution-count
# checkpoint observes successful final-config canary folds, so the probe must
# compile that otherwise default-off detection seam as well.
evacuation_plan_probe = ["candidate_c_value"]
# Default-off replay of real Candidate-C allocation and GC-retirement events
# through a bounded-search, address-neutral reusable-hole model.
hole_reuse_shadow_probe = [
  "candidate_c_value",
  "ratchet-value/hole_reuse_shadow_probe",
]
# Default-off read-only projection of weak-object invalidation, dead-page
# advice, metadata shrinking, and its carried adjusted-RSS schedule.
nonmoving_reclaim_probe = ["candidate_c_value"]
# Default-off report-only admission planner for one root-complete nested
# nonmoving retirement ordinal. This never mutates or advises heap storage.
nested_nonmoving_retirement_probe = [
  "collection_poll_probe",
  "nonmoving_reclaim_probe",
]
# Default-off read-only projection of packed-at-birth chronological typed
# increments. It reuses the nonmoving root proof and allocation fences, but
# never retires, advises, moves, or rewrites a value.
young_increment_projection_probe = [
  "nested_nonmoving_retirement_probe",
  "demand_region_shadow_probe",
  "compact_destination_probe",
]
# Default-off read-only projection of address-preserving virtual-page meshing.
mesh_projection_probe = ["candidate_c_value"]
option_map_fold_probe = ["candidate_c_value"]

[dependencies]
anyhow = { workspace = true }
aos-nix-compat = { workspace = true }
aos-nix-syntax = { workspace = true }
ratchet-core = { workspace = true }
ratchet-cache = { workspace = true }
aos-nix-dialect = { workspace = true }
ratchet-value = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bzip2 = { workspace = true }
crossbeam-deque = { workspace = true }
flate2 = { workspace = true }
git2 = { workspace = true }
md-5 = { workspace = true }
miette = { workspace = true }
nix-compat = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
ring = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xxhash-rust = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
loom = { workspace = true }
proptest = { workspace = true }
ratchet-core = { workspace = true, features = ["test-util"] }
