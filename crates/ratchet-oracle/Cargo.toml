[package]
name = "ratchet-oracle"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints.rust]
# Recognize retired experimental cfg names while their unreachable generic
# plumbing is removed incrementally. They are deliberately not Cargo features,
# so no build can activate the deleted benchmark-coordinate schedulers.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("compact_destination_probe", "evacuation_plan_probe", "immutable_cohort_projection_probe", "lifetime_cohort_probe", "nested_nonmoving_retirement_probe", "nonmoving_reclaim_probe", "ready_exclusive_probe", "root_continuation_probe", "young_increment_projection_probe"))'] }

[features]
default = []
# RFC-0007 Candidate-C value-ABI cutover variant (task #12): forwards the
# one-word carrier to `ratchet-value` and the matching layout descriptor to
# `ratchet-core`. Both are enabled together so the runtime never sees an 8-byte
# `Value` under a 16-byte layout descriptor (or vice-versa).
candidate_c_value = [
  "ratchet-value/candidate_c_value",
  "ratchet-core/candidate_c_value",
]
# Default-off serial execution experiment for fixed-capacity packed Apply and
# GenListElemAtAddOne thunk lanes.
active_packed_thunk_probe = ["candidate_c_value"]
# Compile-time-only peak locator for RFC-0007 memory experiments. Ordinary
# builds omit its counters, samples, fields, and allocation-path branches.
peak_ordinal_probe = []
# Compile-time-only projected duplicate-work census for maximal-laziness
# experiments. Ordinary builds omit its maps, timers, fields, and force hooks.
maximal_laziness_probe = ["candidate_c_value"]
# Compile-time-only allocation-byte and statepoint shadow census for the
# requested-attribute demand epoch.
demand_region_shadow_probe = ["candidate_c_value"]
# Compile-time-only report shadow that selects the four guard-heaviest
# whole-demand callers and links their bounded runtime code identities. It
# reuses the demand-region observation hooks and never dispatches a plan.
whole_demand_trace_shadow_probe = ["demand_region_shadow_probe"]
# Compile-time-only no-collection preflight and coverage-only outer dispatcher
# skeleton. The runtime door leaves ordinary evaluation byte-for-byte inert.
collection_poll_probe = ["candidate_c_value"]
# Default-off replay of real Candidate-C allocation and GC-retirement events
# through a bounded-search, address-neutral reusable-hole model.
hole_reuse_shadow_probe = [
  "candidate_c_value",
  "ratchet-value/hole_reuse_shadow_probe",
]
# Default-off read-only projection of address-preserving virtual-page meshing.
mesh_projection_probe = ["candidate_c_value"]

[dependencies]
anyhow = { workspace = true }
aos-nix-compat = { workspace = true }
aos-nix-syntax = { workspace = true }
ratchet-core = { workspace = true }
ratchet-cache = { workspace = true }
aos-nix-dialect = { workspace = true }
ratchet-value = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bzip2 = { workspace = true }
crossbeam-deque = { workspace = true }
flate2 = { workspace = true }
git2 = { workspace = true }
md-5 = { workspace = true }
miette = { workspace = true }
nix-compat = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
ring = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xxhash-rust = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
loom = { workspace = true }
proptest = { workspace = true }
ratchet-core = { workspace = true, features = ["test-util"] }
