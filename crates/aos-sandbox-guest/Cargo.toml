[package]
name = "aos-sandbox-guest"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "aos-sandbox-guest-agent"
path = "src/main.rs"

[[bin]]
name = "aos-sandbox-guest-exec"
path = "src/exec_child.rs"

[[bin]]
name = "aos-sandbox-guest-init"
path = "src/init.rs"

[[bin]]
name = "aos-sandbox-agent"
path = "src/bin/aos-sandbox-agent.rs"

[[bin]]
name = "aos-sandbox-exec-gate"
path = "src/bin/aos-sandbox-exec-gate.rs"

[[bin]]
name = "aos-sandbox-guest-root-builder"
path = "src/bin/aos-sandbox-guest-root-builder.rs"

[[bin]]
name = "aos-sandbox-guest-root-tree-digest"
path = "src/bin/aos-sandbox-guest-root-tree-digest.rs"

[dependencies]
aos-sandbox-agent.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-guest-root-tree.workspace = true
aos-sandbox-linux.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
nix = { version = "0.31.3", default-features = false, features = ["feature"] }
ssh-key.workspace = true
zeroize.workspace = true
rustix = { workspace = true, features = ["fs", "process", "pty", "stdio", "termios", "thread", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
