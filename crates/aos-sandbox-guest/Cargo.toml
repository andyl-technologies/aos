[package]
name = "aos-sandbox-guest"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "aos-sandbox-guest-agent"
path = "src/main.rs"

[[bin]]
name = "aos-sandbox-guest-exec"
path = "src/exec_child.rs"

[dependencies]
aos-sandbox-agent.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-linux.workspace = true
rustix = { workspace = true, features = ["fs", "process", "pty", "termios"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
