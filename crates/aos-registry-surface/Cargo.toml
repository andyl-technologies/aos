[package]
name = "aos-registry-surface"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust, no-IO reader for the AOS registry wire surface (RFC-0004): loose git objects, SSHSIG verification, signed tags, and refs — compiles to wasm32 for in-browser verification"

[dependencies]
anyhow = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
