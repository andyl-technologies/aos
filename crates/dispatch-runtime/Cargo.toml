[package]
name = "dispatch-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Bounded assignment solving sessions and supervised worker execution"
repository = "https://github.com/andyl-technologies/aos"
homepage = "https://github.com/andyl-technologies/aos"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
systemd = ["dep:zbus", "dep:tempfile", "dep:uuid"]

[dependencies]
dispatch-model = { version = "0.1.0", path = "../dispatch-model" }
dispatch-protocol = { version = "0.1.0", path = "../dispatch-protocol" }
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zbus = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "dispatch-worker"
path = "src/bin/dispatch-worker.rs"
