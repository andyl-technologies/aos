[package]
name = "aos-sandbox-network"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata.aos]
test_source_inputs = [
    "tests/sandbox/network-kernel-plan-v1.cases",
    "tests/sandbox/network-kernel-plan-v1.hex",
]

[features]
default = []
kernel-tests = ["aos-sandbox-linux/kernel-tests"]
protected-store-fixture = []

[dependencies]
aos-sandbox-api.workspace = true
aos-sandbox-ledger-replay.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-model.workspace = true
aos-sandbox-journal.workspace = true
aos-sandbox-linux.workspace = true
aos-linux-descriptors.workspace = true
aos-sandbox-protocol.workspace = true
aos-systemd-client.workspace = true
base64.workspace = true
buffa.workspace = true
ed25519-dalek.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mount", "process", "rand", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
# The kernel fixture composes the real Controller and Network service.
# Domain stays outside the normal/build graph of the Network role.
aos-sandbox-controller-domain.workspace = true
tempfile.workspace = true

[lints]
workspace = true
