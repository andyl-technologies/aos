[package]
name = "aos-sandbox-coordinator-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata.aos]
source_inputs = [
    "api/proto/aos/sandbox/coordinator",
    "crates/sandbox/protocol/aos-sandbox-api/build_support",
]

[dependencies]
aos-sandbox-api.workspace = true
aos-sandbox-model.workspace = true
sha2.workspace = true
buffa = "0.9.2"
connectrpc = "0.9.1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
http-body = "1"

[build-dependencies]
buffa = "0.9.2"
buffa-codegen = "0.9.2"
connectrpc-build = "0.9"

[dev-dependencies]
buffa-codegen = "0.9.2"
serde_json.workspace = true

[lints]
workspace = true
