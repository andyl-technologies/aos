[package]
name = "aos-sandbox-api"
version = "0.1.0"
edition = "2021"
description = "Generated Sandbox public, local broker, and shared coordinator APIs"
license.workspace = true

[package.metadata.aos]
source_inputs = ["api/proto/aos/sandbox"]

[features]
default = []

[dependencies]
connectrpc = "0.9.1"
buffa = "0.9.2"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
http-body = "1"

[build-dependencies]
buffa = "0.9.2"
buffa-codegen = "0.9.2"
connectrpc-build = "0.9"

[dev-dependencies]
buffa-codegen = "0.9.2"
