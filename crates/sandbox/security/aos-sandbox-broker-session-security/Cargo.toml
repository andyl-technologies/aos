[package]
name = "aos-sandbox-broker-session-security"
version = "0.1.0"
edition = "2024"
license.workspace = true
autobins = false

[package.metadata.aos]
test_source_inputs = [
    "crates/sandbox/controller/aos-sandbox-controller-runtime/Cargo.toml",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/activation.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/activation/configuration.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/commands.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/admission.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/execution.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/execution/tests.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/lifecycle.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/lifecycle/tests.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/mod.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/effects/snapshot_coordination.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/public_rpc.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/public_rpc/tests.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/worker.rs",
    "crates/sandbox/controller/aos-sandbox-controller-runtime/src/controller_service/worker/tests.rs",
    "crates/sandbox/controller/aos-sandbox-services/Cargo.toml",
    "crates/sandbox/controller/aos-sandbox-services/src/controller.rs",
]

[features]
default = []
kernel-tests = ["aos-sandbox-linux/kernel-tests"]
online-nix = ["dep:base64"]

[dependencies]
aos-sandbox-ownership-protocol.workspace = true
aos-sandbox-api.workspace = true
aos-sandbox-filesystem-format.workspace = true
aos-sandbox-controller-domain.workspace = true
aos-sandbox-guest-protocol.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-broker-session-protocol.workspace = true
aos-sandbox-model.workspace = true
aos-sandbox-journal.workspace = true
aos-sandbox-policy.workspace = true
aos-sandbox-host.workspace = true
aos-sandbox-linux.workspace = true
aos-linux-descriptors.workspace = true
aos-sandbox-mount.workspace = true
aos-sandbox-mount-native.workspace = true
aos-sandbox-network.workspace = true
aos-sandbox-protocol.workspace = true
aos-sandbox-ledger-replay.workspace = true
aos-sandbox-storage.workspace = true
aos-systemd-client.workspace = true
aos-sandbox-source-provider.workspace = true
aos-sandbox-source-provider-protocol.workspace = true
aos-sandbox-source-provider-security.workspace = true
base64 = { workspace = true, optional = true }
buffa.workspace = true
connectrpc.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
futures.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "process", "rand", "time"] }
serde.workspace = true
serde_json.workspace = true
ssh-key.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

aos-sandbox-cache = { workspace = true }
[dev-dependencies]
axum.workspace = true
aos-sandbox-controller-domain = { workspace = true, features = ["test-fixtures"] }
async-trait.workspace = true
hex.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rustix = { workspace = true, features = ["net", "pipe"] }
tempfile = "3"

[lints]
workspace = true
