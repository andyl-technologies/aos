[package]
name = "aos-sandbox-service-journal-probe"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[features]
native-recovery-vm-fixture = ["aos-sandbox-source-provider/native-recovery-vm-fixture"]

[[bin]]
name = "aos-sandbox-source-provider-owner-vm-server"
path = "src/bin/aos-sandbox-source-provider-owner-vm-server.rs"
required-features = ["native-recovery-vm-fixture"]

[dependencies]
aos-sandbox-controller-domain = { workspace = true, features = ["cache-physical-join-vm-fixture", "project-negative-recovery-vm-fixture"] }
aos-sandbox-model.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-broker-session-protocol.workspace = true
aos-sandbox-broker-session-security.workspace = true
aos-sandbox-linux.workspace = true
aos-sandbox-protocol.workspace = true
aos-sandbox-policy = { workspace = true, features = ["native-journal"] }
aos-sandbox-source.workspace = true
aos-sandbox-source-provider.workspace = true
aos-sandbox-source-provider-ledger.workspace = true
aos-sandbox-source-provider-protocol.workspace = true
aos-sandbox-source-provider-security.workspace = true
ed25519-dalek.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
serde_json.workspace = true
sha2.workspace = true

aos-sandbox-cache = { workspace = true }
[lints]
workspace = true
