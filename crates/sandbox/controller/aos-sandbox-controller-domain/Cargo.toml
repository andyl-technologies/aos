[package]
name = "aos-sandbox-controller-domain"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Selects protected remote contracts and orchestration explicitly.
# The local issuer is a separate protected crate; snapshot inventory remains local.
multi-node = ["dep:aos-sandbox-coordinator-protocol"]
# Compiles private fixed-helper mechanics without installing an authority caller.
git-helper-mechanics = []
# Run explicitly in the AOS kernel-test VM, outside the package-build sandbox.
kernel-tests = ["aos-sandbox-linux/kernel-tests", "aos-sandbox-cache/kernel-tests"]
# Enables a private-directory protected-journal opener for dependent crate tests.
test-fixtures = ["aos-sandbox-journal/test-fixtures", "aos-sandbox-broker/test-fixtures", "aos-sandbox-cache/test-fixtures"]
# Only the isolated KVM fixture can prepare an inert Cache hold and empty manifest.
cache-physical-join-vm-fixture = ["aos-sandbox-cache/cache-physical-join-vm-fixture"]
# Only a debug VM probe can seed nonauthorizing original-Effect history.
project-negative-recovery-vm-fixture = []

[dependencies]
aos-sandbox-ownership-protocol.workspace = true
aos-sandbox-filesystem-format.workspace = true
aos-sandbox-api.workspace = true
aos-sandbox-coordinator-protocol = { workspace = true, optional = true }
aos-sandbox-guest-protocol.workspace = true
aos-sandbox-guest-root-measurement.workspace = true
aos-sandbox-broker-session-protocol.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-model.workspace = true
aos-sandbox-journal = { workspace = true, features = ["protected-unix"] }
aos-sandbox-policy = { workspace = true, features = ["native-journal"] }
aos-sandbox-protocol.workspace = true
aos-sandbox-publisher.workspace = true
aos-sandbox-ledger-replay.workspace = true
aos-sandbox-source.workspace = true
aos-sandbox-source-provider-ledger.workspace = true
aos-sandbox-source-provider-protocol.workspace = true
axum.workspace = true
blake3.workspace = true
buffa.workspace = true
connectrpc.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
futures.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "param", "process", "rand", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

aos-sandbox-cache = { workspace = true }
[target.'cfg(target_os = "linux")'.dependencies]
aos-sandbox-linux.workspace = true
aos-linux-descriptors.workspace = true
aos-systemd-client.workspace = true
base64.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
rand.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
aos-sandbox-broker = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-ledger-replay = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-ownership = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-journal = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-protocol = { workspace = true, features = ["test-fixtures"] }
hex.workspace = true
rcgen.workspace = true
tempfile.workspace = true

aos-sandbox-cache = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-policy = { workspace = true, features = ["native-journal", "test-fixtures"] }
[lints]
workspace = true
