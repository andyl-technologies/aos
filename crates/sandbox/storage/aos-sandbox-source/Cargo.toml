[package]
name = "aos-sandbox-source"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
# Enables the existing protected-storage fixtures without original-role grants.
test-fixtures = ["aos-sandbox-broker/test-fixtures", "aos-sandbox-ledger-replay/test-fixtures"]

[dependencies]
aos-sandbox-broker.workspace = true
aos-sandbox-model.workspace = true
aos-sandbox-journal.workspace = true
aos-sandbox-protocol.workspace = true
aos-sandbox-ledger-replay.workspace = true
aos-sandbox-source-provider-ledger.workspace = true
aos-sandbox-source-provider-protocol.workspace = true
thiserror.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aos-sandbox-linux.workspace = true
aos-linux-descriptors.workspace = true
rustix.workspace = true

[dev-dependencies]
aos-sandbox-broker = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-ledger-replay = { workspace = true, features = ["test-fixtures"] }
aos-sandbox-api.workspace = true
buffa.workspace = true
tempfile.workspace = true

[lints]
workspace = true
