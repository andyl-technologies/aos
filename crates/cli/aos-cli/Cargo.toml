[package]
name = "aos-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata.aos]
# The packaged wrapper verifies materialization against this exact recipe.
source_inputs = ["docs/rfcs/0012-hub-surface-topology/hub-topology-cutover-bundle-generation-v1.fixture.json"]
test_source_inputs = ["docs/rfcs/0012-hub-surface-topology"]

[features]
# Enables the native fleet fixture and runtime audit binaries in the
# separately retained testSupport output.
release-fleet-fixture = []

[[bin]]
name = "aos"
path = "src/main.rs"

[[bin]]
name = "apr"
path = "src/apr.rs"

[[bin]]
name = "apm"
path = "src/apm.rs"

[[bin]]
name = "aos-package-runtime"
path = "src/package_runtime.rs"

[[bin]]
name = "aos-boot-configuration"
path = "src/boot_configuration.rs"

[[bin]]
name = "aos-provisioning-configuration-evaluator"
path = "src/provisioning_configuration_evaluator.rs"

[[bin]]
name = "aos-release-fleet-fixture"
path = "tests/support/release_fleet_fixture.rs"
required-features = ["release-fleet-fixture"]

[[bin]]
name = "aos-ability-interruption-audit"
path = "tests/support/ability_interruption_audit.rs"
required-features = ["release-fleet-fixture"]

[[bin]]
name = "aos-ability-authority-audit"
path = "tests/support/ability_authority_audit.rs"
required-features = ["release-fleet-fixture"]

[dependencies]
aos-registry-client.workspace = true
aos-registry-authoring.workspace = true
aos-deployment-format.workspace = true
aos-deployment.workspace = true
thiserror.workspace = true
aos-release-coordinator.workspace = true
aos-nar = { workspace = true, features = ["compression"] }
aos-nix.workspace = true
aos-cli-ui.workspace = true
aos-artifact-evidence.workspace = true
rustix = { workspace = true, features = ["process"] }
aos-module-format = { workspace = true }
aos-activation = { workspace = true }
aos-core = { workspace = true }
aos-transfer = { workspace = true, features = ["transfer"] }
aos-oci = { workspace = true }
aos-oci-types = { workspace = true }
aos-build-server = { workspace = true }
aos-nix-cache = { workspace = true }
aos-build-client = { workspace = true }
aos-hub-client = { workspace = true }
aos-hub-api = { workspace = true }
aos-nix-docs = { workspace = true }
aos-module-docs = { workspace = true }
aos-package-manager = { workspace = true }
aos-registry-format = { workspace = true }
aos-package-maintenance = { workspace = true }
aos-release-format = { workspace = true }
aos-image-finalizer = { workspace = true }
aos-closure-analysis = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
humantime = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ignore = { workspace = true }
alejandra = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
rnix = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
libc = { workspace = true }
ed25519-dalek = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
aos-module-format = { workspace = true }
aos-hub-native = { workspace = true }
aos-hub-db = { workspace = true }
aos-hub-model = { workspace = true }
aos-hub-service = { workspace = true, features = ["test-fixtures"] }
flate2 = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }
