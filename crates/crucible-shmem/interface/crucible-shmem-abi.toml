# SPDX-License-Identifier: MIT OR Apache-2.0
# This manifest is the machine-readable identity and policy for the public
# process ABI. Numeric layouts remain frozen by the committed golden fixture
# and generated C/Rust layout assertions.

[interface]
name = "crucible-shmem"
kind = "process-shared-memory"
license = "MIT OR Apache-2.0"
abi_version = 9
magic_ascii = "CRUCSHM1"
target = "x86_64-unknown-linux-gnu"
byte_order = "little"
independently_implementable = true

[transport]
control_plane = "versioned-unix-socket"
data_plane = "shared-memory"
steady_state_syscalls_required = true
data_plane_socket_round_trips = false
scheduler_ceiling_futex_wake = "unconditional-currently"
additional_futex_wake_categories = [
  "service-or-backpressure-producer-release",
  "frame-delivery",
]
wakeup = "non-private-futex+plugin-eventfd"
plugin_eventfd_quantum_wake_write = "minimum-one"
plugin_eventfd_qemu_registration = "required-before-ready"
plugin_eventfd_additional_writes = [
  "unchanged-icount-retry",
  "host-io-service",
]
future_waiter_armed_wake_optimization = "documented-not-implemented"

[representation]
allowed = [
  "fixed-width-integer",
  "fixed-size-byte-array",
  "region-relative-byte-offset",
  "shared-atomic-integer",
]
forbidden = [
  "native-pointer",
  "function-pointer",
  "callback-table",
  "qemu-private-structure",
  "rust-native-enum-layout",
  "compiler-dependent-bitfield",
]

[fault_command_protocol]
abi_major = 1
abi_minor = 1
semantic_version = 1
command_header_bytes = 216
result_header_bytes = 188
capability_row_bytes = 60
command_slot_bytes = 256
result_slot_bytes = 256
payload_arena_header_bytes = 128
default_payload_bytes = 2106448
hard_payload_bytes = 33563728
default_payload_arena_bytes = 2106448
hard_payload_arena_bytes = 33563728
default_ring_capacity = 4096
hard_ring_capacity = 65536
encoding = "explicit-little-endian-byte-arrays"
payload_authentication = "blake3"
unknown_tags = "reject"
nonzero_reserved_fields = "reject"
payload_arena = "bounded-spsc-monotonic-cursors-contiguous-reservations"
malformed_command_consumption = "release-sound-transport-reservation-and-reject"

[node_fault_protocol]
semantic_version = 1
payload_header_bytes = 128
field_header_bytes = 8
evidence_bytes = 228
encoding = "closed-command-schema-canonical-typed-fields"
operations = ["upsert", "remove", "apply"]
target_kinds = ["node", "vcpu", "register", "memory", "interrupt", "clock", "accelerator"]
preparation = "validation-only-before-equals-after"
commit_evidence = "typed-request-and-state-digests"
unknown_fields = "reject"

[fault_event_protocol]
semantic_version = 1
event_header_bytes = 320
event_slot_bytes = 384
payload_arena_header_bytes = 128
default_ring_capacity = 4096
hard_ring_capacity = 65536
encoding = "explicit-little-endian-byte-arrays"
payload_authentication = "blake3+sha256"
ordering = "strictly-increasing-per-node-event-sequence"
producer = "qemu-plugin"
consumer = "apache-host"
command_results_are_events = false
overflow = "fail-run-without-dropping-event"

[conformance]
c_header = "../include/crucible_shmem_abi.h"
rust_version = "../src/abi_version.in"
golden_fixture = "../tests/fixtures/shmem_abi_golden.fixture"
header_generator = "../src/abi_header.rs"
