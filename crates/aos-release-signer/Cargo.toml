[package]
name = "aos-release-signer"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "File-backed release signing adapter for the aos release signer-exchange protocol"

[[bin]]
name = "aos-release-signer"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
aos-release = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true }
tempfile = { workspace = true }
