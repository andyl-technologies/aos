# getrandom 0.3 (pulled by rand 0.9, used in aos-hub-core's secret/token
# generators) requires BOTH the `wasm_js` cargo feature AND this backend cfg to
# compile for the Cloudflare Workers target (wasm32-unknown-unknown). Without
# the cfg, getrandom 0.3 emits a compile error on that target. This applies only
# to wasm32 builds; native builds use the OS CSPRNG directly. RFC-0004 Phase 5.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
