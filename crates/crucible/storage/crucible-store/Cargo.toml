[package]
name = "crucible-store"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[features]
private-measurement-domain = []
destructive-recovery-faults = []
test-support = []

[[bin]]
name = "crucible-fleet-store"
path = "src/bin/crucible-fleet-store.rs"

[dependencies]
crucible-sqlite-heap = { path = "../crucible-sqlite-heap" }
aes-gcm = { workspace = true, features = ["zeroize"] }
blake3 = { workspace = true }
crucible-ram = { path = "../../protocol/crucible-ram" }
crucible-qemu-protocol = { path = "../../protocol/crucible-qemu-protocol" }
rustix = { workspace = true }
rusqlite = { workspace = true, features = ["blob"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
crucible-store = { path = ".", features = ["test-support"] }
crucible-host-resources = { path = "../../host/crucible-host-resources", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }

[[test]]
name = "gate_campaign_store_equivalence"
path = "tests/gate_campaign_store_equivalence.rs"
required-features = ["test-support"]
