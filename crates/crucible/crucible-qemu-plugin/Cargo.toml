[package]
name = "crucible-qemu-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
native-conformance = []
kernel-swap-measurement = []

[lints]
workspace = true

[dependencies]
crucible-ram = { workspace = true }
blake3 = { workspace = true }
crucible-qemu-protocol = { path = "../crucible-qemu-protocol" }
crucible-qemu-shmem = { path = "../crucible-qemu-shmem" }
hex = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test-only HARN-16 cross-check: production plugin dependencies stay L1-only.
crucible-engine = { path = "../crucible-engine", features = ["test-double", "test-support"] }
sha2 = { workspace = true }
