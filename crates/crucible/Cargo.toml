[package]
name = "crucible"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
test-support = []
test-double = ["dep:crucible-shmem"]

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
ciborium = { workspace = true }
crucible-sim = { path = "../crucible-sim" }
crucible-device = { path = "../crucible-device" }
crucible-shmem = { path = "../crucible-shmem", optional = true }
crucible-protocol = { path = "../crucible-protocol" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crucible-harness = { path = "../crucible-harness" }

[[test]]
name = "gate_layer0_determinism"
path = "tests/gate_layer0_determinism.rs"
required-features = ["test-double"]

[[test]]
name = "gate_replay_oracle"
path = "tests/gate_replay_oracle.rs"
required-features = ["test-double"]

[[test]]
name = "gate_single_vm_fingerprint"
path = "tests/gate_single_vm_fingerprint.rs"
required-features = ["test-double"]

[[test]]
name = "gate_content_address"
path = "tests/gate_content_address.rs"
required-features = ["test-double"]

[[test]]
name = "gate_abi_conformance"
path = "tests/gate_abi_conformance.rs"
required-features = ["test-double"]

[[test]]
name = "gate_scheduler_liveness"
path = "tests/gate_scheduler_liveness.rs"
required-features = ["test-double"]

[[test]]
name = "gate_e2e_determinism_concurrency"
path = "tests/gate_e2e_determinism_concurrency.rs"
required-features = ["test-double"]

[[test]]
name = "gate_fleet_equivalence"
path = "tests/gate_fleet_equivalence.rs"
required-features = ["test-double"]
