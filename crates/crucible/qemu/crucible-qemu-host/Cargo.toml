[package]
name = "crucible-qemu-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
kernel-swap-measurement = []
test-support = ["crucible-engine/test-double", "crucible-ram/test-support"]
private-measurement-domain = ["crucible-host-resources/private-measurement-domain", "crucible-store/private-measurement-domain"]

[lints]
workspace = true

[dependencies]
crucible-host-resources = { workspace = true }
crucible-store = { workspace = true }
crucible-ram = { workspace = true }
blake3 = { workspace = true }
crucible-engine = { path = "../../engine/crucible-engine" }
crucible-device = { path = "../../engine/crucible-device" }
aos-linux-project-quota = { path = "../../../shared/aos-linux-project-quota", default-features = false }
crucible-qemu-protocol = { path = "../../protocol/crucible-qemu-protocol" }
crucible-qemu-shmem = { path = "../../protocol/crucible-qemu-shmem" }
libc = { workspace = true }
rustix = { workspace = true, features = ["net", "param", "process", "thread"] }
serde_json = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crucible-host-resources = { path = "../../host/crucible-host-resources", default-features = false, features = ["test-support"] }
crucible-store = { workspace = true, features = ["test-support"] }
crucible-engine = { path = "../../engine/crucible-engine", features = ["test-double", "test-support"] }
rustix = { workspace = true, features = ["time"] }
