[package]
name = "crucible-daemon"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
destructive-recovery-faults = ["crucible-campaign/destructive-recovery-faults"]
test-support = ["crucible-control-server/test-support", "crucible-engine/test-support", "crucible-qemu-host/test-support"]

[lints]
workspace = true

[dependencies]
crucible-device = { path = "../../engine/crucible-device" }
crucible-control-client = { path = "../crucible-control-client" }
crucible-control-server = { path = "../crucible-control-server" }
sha2 = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
crucible-engine = { path = "../../engine/crucible-engine" }
crucible-control-api = { path = "../crucible-control-api" }
crucible-campaign = { path = "../../engine/crucible-campaign" }
crucible-store = { workspace = true }
aos-linux-project-quota = { workspace = true }
crucible-qemu-protocol = { path = "../../protocol/crucible-qemu-protocol" }
crucible-qemu-host = { path = "../../qemu/crucible-qemu-host" }
crucible-qemu-shmem = { path = "../../protocol/crucible-qemu-shmem" }
crucible-store-s3 = { workspace = true }
crucible-session = { path = "../crucible-session" }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true, features = ["event", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
crucible-engine = { path = "../../engine/crucible-engine", features = ["test-double"] }
crucible-control-api = { path = "../crucible-control-api" }
crucible-guest = { path = "../../guest/crucible-guest" }
crucible-qemu-host = { path = "../../qemu/crucible-qemu-host", features = ["test-support"] }

[[test]]
name = "gate_campaign_component_contract"
required-features = ["test-support"]

[[test]]
name = "gate_exact_closure_streaming"
required-features = ["test-support"]
