[package]
name = "crucible-control-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Crucible lifecycle dispatch, actor adapters, and authenticated HTTP/2 servers"

[features]
default = []
test-support = ["crucible-engine/test-support"]

[lints]
workspace = true

[dependencies]
crucible-engine = { path = "../../engine/crucible-engine" }
crucible-qemu-protocol = { path = "../../protocol/crucible-qemu-protocol" }
crucible-session = { path = "../crucible-session" }
thiserror = { workspace = true }
crucible-control-api = { path = "../crucible-control-api" }
crucible-control-client = { path = "../crucible-control-client" }
axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
crucible-engine = { path = "../../engine/crucible-engine", features = ["test-double", "test-support"] }
crucible-session = { path = "../crucible-session", features = ["test-support"] }
crucible-qemu-shmem = { path = "../../protocol/crucible-qemu-shmem" }
