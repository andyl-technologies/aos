[package]
name = "crucible-control-api"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Native transport-independent Crucible control contracts and canonical codecs"

[features]
test-support = ["crucible-engine/test-support", "crucible-store/test-support"]

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
bytes = { workspace = true }
crucible-store = { workspace = true }
crucible-host-resources = { workspace = true }
crucible-ram = { workspace = true }
crucible-campaign = { workspace = true }
crucible-engine = { path = "../crucible-engine" }
crucible-qemu-protocol = { path = "../crucible-qemu-protocol" }
crucible-session = { path = "../crucible-session" }
thiserror = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
crucible-engine = { path = "../crucible-engine", features = ["test-support"] }
crucible-host-resources = { workspace = true, features = ["test-support"] }
