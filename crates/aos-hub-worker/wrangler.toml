# Development fixture for the AOS Hub Worker.
#
# Do not use this file as an operator deployment template. The
# `pkg-aos-hub-cloudflare` package and `aos-hub worker` installer generate the
# current production configuration over the bundled artifact, provision its
# resources, preserve secrets on routine updates, and bootstrap the root account.
# See docs/users/aos-hub/cloudflare.md.

name = "aos-hub"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[vars]
HUB_REQUEST_SHARDING = "on"
HUB_OCI_PULL_ENABLED = "false"
HUB_OCI_PUSH_ENABLED = "false"
HUB_OCI_VERIFIED_PUBLICATION_ENABLED = "false"
HUB_OCI_ADMINISTRATION_ENABLED = "false"
HUB_OCI_GC_ENABLED = "false"

# Build the Rust cdylib to wasm with the workers-rs wasm-pack pipeline.
# `worker-build` (installed via `cargo install worker-build`) wraps
# `cargo build --target wasm32-unknown-unknown` + wasm-bindgen and emits the JS
# shim wrangler loads.
[build]
command = "worker-build --release"

# Run at the edge near each client (never smart placement): the worker is a thin
# edge that forwards to resource-affine execution objects or the `HubDb`
# Durable Object, so the worker itself should stay near the client. Hardcoded
# `off` so a dashboard toggle to `smart` is reverted on deploy.
[placement]
mode = "off"

# The relational system of record is the `HubDb` Durable Object's colocated
# SQLite (declared below under
# `[[durable_objects.bindings]]` + the `new_sqlite_classes` migration). The
# schema is the shared `MIGRATIONS`, applied to the DO's SQLite on first use — no
# external init step.

# The R2 bucket that holds the registry surfaces (the zero-egress facade
# source). The binding name must match `handlers::bindings::R2`
# (REGISTRY_BUCKET). Registries are prefixes within this shared bucket.
[[r2_buckets]]
binding = "REGISTRY_BUCKET"
bucket_name = "aos-registry-surfaces"

# KV for human sessions (RFC-0004 "KV holds sessions"). The read path does not
# require it for public registries; it is bound here for the deferred
# private-registry auth path. The binding name matches
# `handlers::bindings::KV_SESSIONS` (SESSIONS).
[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000000"  # replace with your KV namespace id

# The Cron trigger that drives the indexer (RFC-0004 "Cron Triggers/Queues
# drive the indexer"). Every 15 minutes re-walks every public registry's R2
# surface into HubDb. Fires the `scheduled` event handler.
[triggers]
crons = ["*/15 * * * *"]

# The coordinator Durable Object (RFC-0004 ch.14 Phase B): the
# strongly-consistent rate-limit counter, publish lease, and (future) channel
# floors. The binding name must match `handlers::bindings::COORDINATOR`; the
# class name is the `#[durable_object]` struct `CoordinatorObject`.
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "CoordinatorObject"

# The colocated-SQLite **system of record** (RFC-0004 ch.14 Phase E). Internal
# SQL calls and administrative requests always reach this SQLite-backed DO;
# `HUB_REQUEST_SHARDING` controls whether public service execution runs here or
# in the resource-affine objects below.
[[durable_objects.bindings]]
name = "HUB_DB"
class_name = "HubDb"

# Stateless request-execution partitions. Each logical namespace has
# resource-affine instances and sends only short SQL operations to HubDb.
[[durable_objects.bindings]]
name = "HUB_CONTROL_SHARDS"
class_name = "HubControlShard"

[[durable_objects.bindings]]
name = "HUB_TENANT_SHARDS"
class_name = "HubTenantShard"

[[durable_objects.bindings]]
name = "HUB_REGISTRY_SHARDS"
class_name = "HubRegistryShard"

[[durable_objects.bindings]]
name = "HUB_CACHE_SHARDS"
class_name = "HubCacheShard"

# Declare the DO classes on first deploy. `CoordinatorObject` uses the
# transactional key-value storage (`new_classes`); `HubDb` uses SQLite storage.
[[migrations]]
tag = "v1"
new_classes = ["CoordinatorObject"]
new_sqlite_classes = ["HubDb"]

[[migrations]]
tag = "v2"
new_classes = ["HubControlShard", "HubTenantShard", "HubRegistryShard", "HubCacheShard"]

# Edge Rate Limiting bindings (RFC-0004 ch.14, corrected): edge-local counters,
# no network hop. One binding per budget tier (period 60); the worker routes a
# rate class to the binding matching its budget. Names match
# `handlers::bindings::RL_*`.
[[ratelimits]]
name = "RL_BURST5"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "RL_BURST10"
namespace_id = "1002"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "RL_BROWSE120"
namespace_id = "1003"
[ratelimits.simple]
limit = 120
period = 60

# The deferred-jobs queue (RFC-0004 ch.14 Phase D): the Worker is both a producer
# (the write path enqueues post-write propagation) and the consumer (it drains
# the batch in the `queue` event handler). The binding name must match
# `handlers::bindings::QUEUE`.
[[queues.producers]]
binding = "JOBS"
queue = "aos-hub-jobs"

[[queues.consumers]]
queue = "aos-hub-jobs"
max_batch_size = 10
max_batch_timeout = 5
# Keep one CPU-bound index from head-of-line blocking maintenance and uploads.
max_concurrency = 4
max_retries = 5
dead_letter_queue = "aos-hub-jobs-dlq"

# KV for human sessions (RFC-0004) — now also the Phase C read-through cache for
# hot point-key state (sessions/tokens/config/routing). The binding name matches
# `handlers::bindings::KV_SESSIONS`. (Declared above under `[[kv_namespaces]]`.)
