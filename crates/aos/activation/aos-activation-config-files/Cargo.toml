[package]
name = "aos-activation-config-files"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

# Keep the installed command stable when its Cargo package is renamed.
[[bin]]
name = "aos-configuration-provider"
path = "src/main.rs"
