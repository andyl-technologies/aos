[package]
name = "aos"
version = "0.1.0"
edition = "2024"

[features]
default = []
native-eval = ["aos-core/native-eval", "dep:aos-nix"]

[[bin]]
name = "aos"
path = "src/main.rs"

[[bin]]
name = "apr"
path = "src/main.rs"

[dependencies]
aos-core = { workspace = true }
aos-nix = { workspace = true, optional = true }
aos-nix-harness = { workspace = true }
aos-server = { workspace = true }
aos-cache = { workspace = true }
aos-remote = { workspace = true }
aos-doc = { workspace = true }
aos-package = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
atty = { workspace = true }
humantime = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ignore = { workspace = true }
alejandra = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
