[package]
name = "aos"
version = "0.1.0"
edition = "2024"

[features]
default = ["mimalloc"]
native-eval = ["aos-core/native-eval", "dep:aos-nix"]
# RFC-0007 Candidate-C value-ABI cutover variant (task #12). Build with
# `--features native-eval,candidate_c_value` for the variant carrier; off by
# default so the shipped carrier is unaffected.
candidate_c_value = ["native-eval", "aos-core/candidate_c_value", "aos-nix/candidate_c_value"]
# Install mimalloc as the process-wide `#[global_allocator]` (on by default).
# The declaration in `src/main.rs` is cfg-gated to the complement of alejandra's
# own allocator gate (alejandra declares mimalloc on Linux gnu/musl), so this
# feature supplies mimalloc on the remaining targets (notably macOS) — exactly
# one declaration per target, avoiding the E0152 conflict. mimalloc's crate
# source is already vendored (a transitive dep of `alejandra`), so this adds no
# new vendored crate. Disable with `--no-default-features` for an allocator A/B.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "aos"
path = "src/main.rs"

[[bin]]
name = "apr"
path = "src/main.rs"

[dependencies]
aos-core = { workspace = true }
aos-nix = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true }
aos-nix-harness = { workspace = true }
aos-server = { workspace = true }
aos-cache = { workspace = true }
aos-remote = { workspace = true }
aos-doc = { workspace = true }
aos-package = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
atty = { workspace = true }
humantime = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ignore = { workspace = true }
alejandra = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
# nix-bench builds a fresh evaluator per cold sample with an isolated temp cache
# dir, so tempfile is a runtime (not just test) dependency.
tempfile = { workspace = true }
