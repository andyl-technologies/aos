[package]
name = "aos"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "aos"
path = "src/main.rs"

[[bin]]
name = "apr"
path = "src/apr.rs"

[[bin]]
name = "apm"
path = "src/apm.rs"

[[bin]]
name = "aos-package-runtime"
path = "src/package_runtime.rs"

[[bin]]
name = "aos-release-fleet-fixture"
path = "tests/support/release_fleet_fixture.rs"

[dependencies]
rustix = { workspace = true, features = ["process"] }
aos-contract = { workspace = true }
aos-core = { workspace = true }
aos-net = { workspace = true }
aos-oci = { workspace = true }
aos-oci-types = { workspace = true }
aos-server = { workspace = true }
aos-cache = { workspace = true }
aos-remote = { workspace = true }
aos-proto-types = { workspace = true }
aos-doc = { workspace = true }
aos-doc-model = { workspace = true }
aos-package = { workspace = true }
aos-maintain = { workspace = true }
aos-release = { workspace = true }
aos-image-finalizer = { workspace = true }
aos-profile = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
atty = { workspace = true }
humantime = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ignore = { workspace = true }
alejandra = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
rnix = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
tokio-rustls = { workspace = true }
