[package]
name = "aos"
version = "0.1.0"
edition = "2024"

[features]
default = ["mimalloc"]
native-eval = ["aos-core/native-eval", "dep:aos-nix"]
# RFC-0007 Candidate-C one-word value carrier — the SHIPPED carrier since the
# S5 promotion ruling (the hermetic pkgs.aos build enables it; see
# pkgs/tools/aos/aos.nix). Build without it for the deprecated two-word Active
# carrier during the deprecation window.
candidate_c_value = ["native-eval", "aos-core/candidate_c_value", "aos-nix/candidate_c_value"]
# Default-off serial Apply/GenList active packed-thunk experiment.
active_packed_thunk_probe = [
  "candidate_c_value",
  "aos-core/active_packed_thunk_probe",
  "aos-nix/active_packed_thunk_probe",
]
# Compile-time-only Ready-import ownership and reuse-window census.
ready_exclusive_probe = ["candidate_c_value", "aos-nix/ready_exclusive_probe"]
# Compile-time-only projected duplicate-work census.
maximal_laziness_probe = ["candidate_c_value", "aos-nix/maximal_laziness_probe"]
# Compile-time-only allocation-byte and statepoint shadow census.
demand_region_shadow_probe = ["candidate_c_value", "aos-nix/demand_region_shadow_probe"]
whole_demand_trace_shadow_probe = [
  "demand_region_shadow_probe",
  "aos-nix/whole_demand_trace_shadow_probe",
]
# Compile-time-only chronological lifetime-cohort aggregate probe.
lifetime_cohort_probe = ["candidate_c_value", "aos-nix/lifetime_cohort_probe"]
# Compile-time-only root-session continuation coverage shadow.
root_continuation_probe = ["candidate_c_value", "aos-nix/root_continuation_probe"]
# Compile-time-only no-collection explicit-dispatcher safepoint preflight.
collection_poll_probe = ["candidate_c_value", "aos-nix/collection_poll_probe"]
# Default-off report-only admission planner for nested nonmoving retirement.
nested_nonmoving_retirement_probe = [
  "candidate_c_value",
  "aos-nix/nested_nonmoving_retirement_probe",
]
# Default-off exact string-list deduplication canary.
dedup_string_list_canary = ["candidate_c_value", "aos-nix/dedup_string_list_canary"]
# Default-off exact finalConfig trie-fold canary.
final_config_trie_canary = ["candidate_c_value", "aos-nix/final_config_trie_canary"]
option_map_fold_probe = ["candidate_c_value", "aos-nix/option_map_fold_probe"]
# Compile-time-only read-only evacuation-plan and first-slice census.
evacuation_plan_probe = ["candidate_c_value", "aos-nix/evacuation_plan_probe"]
# Compile-time-only all-object immutable-cohort packing projection.
immutable_cohort_projection_probe = [
  "candidate_c_value",
  "aos-nix/immutable_cohort_projection_probe",
]
# Compile-time-only read-only chronological segment projection.
young_increment_projection_probe = [
  "candidate_c_value",
  "aos-nix/young_increment_projection_probe",
]
# Default-off mutating immutable/scalar publication at the rooted FinalForce portal.
packed_portal_cutover = [
  "young_increment_projection_probe",
  "aos-nix/packed_portal_cutover",
]
# Install mimalloc as the process-wide `#[global_allocator]` (on by default).
# The declaration in `src/main.rs` is cfg-gated to the complement of alejandra's
# own allocator gate (alejandra declares mimalloc on Linux gnu/musl), so this
# feature supplies mimalloc on the remaining targets (notably macOS) — exactly
# one declaration per target, avoiding the E0152 conflict. mimalloc's crate
# source is already vendored (a transitive dep of `alejandra`), so this adds no
# new vendored crate. Disable with `--no-default-features` for an allocator A/B.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "aos"
path = "src/main.rs"

[[bin]]
name = "apr"
path = "src/main.rs"

[dependencies]
aos-core = { workspace = true }
aos-nix = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true }
aos-nix-harness = { workspace = true }
aos-server = { workspace = true }
aos-cache = { workspace = true }
aos-remote = { workspace = true }
aos-doc = { workspace = true }
aos-package = { workspace = true }
aos-profile = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
atty = { workspace = true }
humantime = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ignore = { workspace = true }
alejandra = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
# nix-bench builds a fresh evaluator per cold sample with an isolated temp cache
# dir, so tempfile is a runtime (not just test) dependency.
tempfile = { workspace = true }
