[package]
name = "aos-platform-metadata"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Platform facts acquisition, configuration authorization, and first-boot network values"

[dependencies]
aos-nix.workspace = true
aos-core.workspace = true
aos-module-format = { workspace = true }
aos-activation.workspace = true
aos-transfer = { workspace = true, features = ["transfer"] }
aos-storage-layout = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[[bin]]
name = "aos-metadata-acquisition-provider"
path = "src/bin/aos-metadata-acquisition-provider.rs"

[[bin]]
name = "aos-metadata-policy-provider"
path = "src/bin/aos-metadata-policy-provider.rs"
