[package]
name = "dispatch"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Portable resource assignment models and scoped solver sessions"
repository = "https://github.com/andyl-technologies/aos"
homepage = "https://github.com/andyl-technologies/aos"
readme = "README.md"

[package.metadata.aos]
source_inputs = ["docs/users/dispatch.md"]

[features]
default = ["runtime", "cli"]
runtime = ["dep:dispatch-runtime", "protocol"]
protocol = ["dep:dispatch-protocol"]
cli = ["runtime", "dep:dispatch-protocol", "dep:clap", "dep:tokio"]

[dependencies]
dispatch-model = { version = "0.1.0", path = "../dispatch-model" }
dispatch-runtime = { version = "0.1.0", path = "../dispatch-runtime", optional = true }
dispatch-protocol = { version = "0.1.0", path = "../dispatch-protocol", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "dispatch"
path = "src/main.rs"
required-features = ["cli"]

[lints]
workspace = true
