[package]
name = "aos-sandbox-network"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "aos-netd"
path = "src/main.rs"

[features]
default = []
kernel-tests = ["aos-sandbox-linux/kernel-tests"]

[dependencies]
aos-proto.workspace = true
aos-sandbox.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-linux.workspace = true
aos-sandbox-protocol.workspace = true
buffa.workspace = true
rustix = { workspace = true, features = ["event", "process", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true

[lints]
workspace = true
