[package]
name = "aos-sandbox-network"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "aos-netd"
path = "src/main.rs"

[features]
default = []
kernel-tests = ["aos-sandbox-linux/kernel-tests"]
protected-store-fixture = []

[dependencies]
aos-proto.workspace = true
aos-sandbox.workspace = true
aos-sandbox-broker.workspace = true
aos-sandbox-core.workspace = true
aos-sandbox-linux.workspace = true
aos-sandbox-protocol.workspace = true
base64.workspace = true
buffa.workspace = true
ed25519-dalek.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mount", "process", "rand", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
