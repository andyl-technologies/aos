[package]
name = "libssh2-sys"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
links = "ssh2"
build = "build.rs"
description = "Native bindings to the AOS libssh2 package"
repository = "https://github.com/andyl-org/aos"

[lib]
path = "lib.rs"

[features]
vendored-openssl = ["openssl-sys/vendored"]
openssl-on-win32 = ["dep:openssl-sys"]
zlib-ng-compat = ["libz-sys/zlib-ng"]

[dependencies]
libc = "0.2"
libz-sys = { version = "1.1.0", default-features = false, features = ["libc"] }

[target.'cfg(unix)'.dependencies]
openssl-sys = "0.9.35"

[target.'cfg(windows)'.dependencies]
openssl-sys = { version = "0.9.35", optional = true }

[build-dependencies]
pkg-config = "0.3.11"
