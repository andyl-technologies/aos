[package]
name = "aos-hub-api"
version = "0.1.0"
edition = "2021"
description = "Portable Hub API messages, ProtoJSON codecs, and Connect descriptors"
license.workspace = true

# API generation depends only on canonical protobuf source.
[package.metadata.aos]
source_inputs = ["api/proto/aos/hub"]
test_source_inputs = [
    "crates/hub/aos-hub-console/src",
    "docs/rfcs/0012-hub-surface-topology",
]

[dependencies]
prost = { workspace = true }
pbjson = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pbjson-build = { workspace = true }
prost = { workspace = true }
prost-build = { workspace = true }
prost-types = "0.13"
