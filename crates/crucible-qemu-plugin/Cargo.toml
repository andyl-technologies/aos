[package]
name = "crucible-qemu-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
crucible-protocol = { path = "../crucible-protocol" }
crucible-shmem = { path = "../crucible-shmem" }
libc = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test-only HARN-16 cross-check: production plugin dependencies stay L1-only.
crucible = { path = "../crucible", features = ["test-double", "test-support"] }
