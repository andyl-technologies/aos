[package]
name = "aos-configuration-lower"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
aos-ability-runtime.workspace = true
aos-contract.workspace = true
base64.workspace = true
rustix = {workspace = true, features = ["fs", "process"]}
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "aos-configuration-mount"
