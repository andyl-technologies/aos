[package]
name = "aos-nar"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Nix archive formats, binary-cache metadata, and content signing"

[features]
default = []
compression = ["dep:thiserror", "dep:zstd"]

[dependencies]
thiserror = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
