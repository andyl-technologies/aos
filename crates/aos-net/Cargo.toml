[package]
name = "aos-net"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["transfer"]
transfer = [
    "dep:async-trait",
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-types",
    "dep:bytes",
    "dep:digest",
    "dep:futures-util",
    "dep:hex",
    "dep:rand",
    "dep:reqwest",
    "dep:serde",
    "dep:sha2",
    "dep:ssh2",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
]

direct-upload = ["transfer", "dep:aos-proto-types", "dep:base64", "dep:md-5"]

[dependencies]
aos-proto-types = { workspace = true, optional = true }
aos-ability-model = { workspace = true }

# HTTP
reqwest = { workspace = true, features = ["stream"], optional = true }
url = { workspace = true, optional = true }
bytes = { version = "1", optional = true }

# Async
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "io-util"], optional = true }
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Hashing
sha2 = { workspace = true, optional = true }
digest = { version = "0.10", optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }

# S3
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }

# SSH/SFTP
ssh2 = { workspace = true, optional = true }

# Streaming IO
tokio-util = { workspace = true, optional = true }

# Serialization (for auth token refresh)
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["limits"] }
rustix = { workspace = true, features = ["fs", "process"] }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true, optional = true }

# Misc
tempfile = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
# The loopback HTTP fixture does not construct a TLS trust store.
aws-smithy-http-client = { version = "1.1.12", default-features = false, features = ["default-client"] }
tempfile = { workspace = true }
