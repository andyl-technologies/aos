[package]
name = "aos-net"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
aos-proto-types = { workspace = true }
# HTTP
reqwest = { workspace = true, features = ["stream"] }
url = { workspace = true }
bytes = "1"

# Async
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "io-util"] }
async-trait = { workspace = true }
futures-util = { workspace = true }

# Hashing
sha2 = { workspace = true }
digest = "0.10"
hex = { workspace = true }
base64 = { workspace = true }
md-5 = { workspace = true }

# S3
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }

# SSH/SFTP
ssh2 = { workspace = true }

# Streaming IO
tokio-util = { workspace = true }

# Serialization (for auth token refresh)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["limits"] }
rustix = { workspace = true, features = ["fs", "process"] }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Misc
rand = { workspace = true }

[dev-dependencies]
# The loopback HTTP fixture does not construct a TLS trust store.
aws-smithy-http-client = { version = "1.1.12", default-features = false, features = ["default-client"] }
tempfile = { workspace = true }
