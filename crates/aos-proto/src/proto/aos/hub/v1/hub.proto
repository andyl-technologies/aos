  string store_hash = 1;
  // The narinfo body (uploaded to the origin and parsed for the index).
  string narinfo = 2;
  // Ticket returned for the direct NAR PUT. When present, registration first
  // HEAD-acknowledges that exact NAR object on its pinned placement.
  string nar_upload_ticket_id = 3;
}

