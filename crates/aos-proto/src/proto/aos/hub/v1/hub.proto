// One immutable disk encoding belonging to a signed logical AOS release.
message SystemImage {
  string package = 1;
  string release = 2;
  string channel = 3;
  string platform = 4;
  string architecture = 5;
  string format = 6;
  string logical_image_id = 7;
  string filename = 8;
  // Immutable byte URL. Private images resolve to the Hub control origin so
  // the caller can reuse its bearer or browser session; public images may
  // resolve to a ready CDN/direct route.
  string download_url = 9;
  string media_type = 10;
  string compression = 11;
  uint64 byte_size = 12;
  string sha256 = 13;
  repeated string compatible_targets = 14;
  // Secure Boot/UKI verification state for the boot payload.
  string boot_verification = 15;
  string object_key = 16;
  ImageInfo image_info = 17;
  string logical_disk_sha256 = 18;
  string rootfs_sha256 = 19;
  ImageUki uki = 20;
  // Verification state of the registry release signature. Published images
  // are returned only after this state reaches "verified".
  string release_verification = 21;
  // Canonical store identity signed by the registry release. Store-backed
  // clients fetch this artifact through cache_urls; download_url remains only
  // for bounded compatibility with legacy direct-delivery releases.
  string store_path = 22;
  string nar_hash = 23;
  uint64 nar_size = 24;
  // Ordered binary-cache bases from the registry's signed consumer stack.
  repeated string cache_urls = 25;
}

message ImageUki {
  string filename = 1;
  string esp_path = 2;
  uint64 byte_size = 3;
  string sha256 = 4;
  string verification = 5;
  string signer_cert_sha256 = 6;
  repeated SbatGeneration sbat = 7;
  bool measured = 8;
  string expected_pcr11 = 9;
}

message SbatGeneration {
  string component = 1;
  uint32 generation = 2;
}

message ImageInfo {
  string filename = 1;
  string object_key = 2;
  string download_url = 3;
  string media_type = 4;
  uint64 byte_size = 5;
  string sha256 = 6;
  // Canonical cache identity for store-backed metadata artifacts.
  string store_path = 7;
  string nar_hash = 8;
  uint64 nar_size = 9;
}

// One registered registry with its verified index status.
message Registry {
  reserved 4;
  reserved "source_url";
  string slug = 1;
  // Committed registry name from registry.toml (empty until indexed).
  string name = 2;
  string description = 3;
  // Index state: fresh | indexing | stale | failed.
  string index_state = 5;
  // Failure detail when index_state is failed.
  string index_error = 6;
  // Commit the current index was built from (64-hex sha256).
  string last_indexed_commit = 7;
  // Unix seconds of the last successful index.
  int64 indexed_at = 8;
  // Pinned trust anchors in name:Ed25519:<base64> form.
  repeated string trust_keys = 9;
  // Flattened committed cache-stack endpoints, highest priority first.
  repeated ConsumerCacheStackEntry consumer_cache_stack = 10;
  // Committed signing-key roster.
  repeated RosterKey roster = 11;
  // Crawl posture backing the generated robots.txt:
  // allow_all | allow_no_ai | deny_all.
  string crawl_policy = 12;
  // Operator-authored llms.txt body served verbatim (empty = auto-generated).
  string llms_txt_body = 13;
  string stable_id = 14;
  string visibility = 15;
  string resource_version = 16;
  int64 updated_at = 17;
  // Exact immutable scope used to authorize registry-local operations.
  string authorization_scope_key = 18;
  // Exact scope that owns shared infrastructure usable by this registry.
  string owner_scope_key = 19;
}

message ConsumerCacheStackEntry {
  string entry_id = 1;
  oneof source {
    string binary_cache_id = 2;
    ExternalConsumerCache external = 3;
  }
  uint32 priority = 4;
  string mirror_group_id = 5;
}

message ExternalConsumerCache {
  string url = 1;
}

message RosterKey {
  string id = 1;
  // Key in name:Ed25519:<base64> form; empty for revoked entries whose
  // key material left the roster.
  string key = 2;
  // active | revoked.
  string status = 3;
}

message PackageSummary {
  string name = 1;
  string description = 2;
  string license = 3;
  string latest_version = 4;
}

// Full package detail: every version and platform artifact.
message Package {
  string name = 1;
  string description = 2;
  string homepage = 3;
  string license = 4;
  string maintainer = 5;
  bool sysroot = 6;
  repeated Version versions = 7;
}

message Version {
  string version = 1;
  // Previous version in the sysroot upgrade chain.
  string previous = 2;
  repeated Platform platforms = 3;
}

message Platform {
  string platform = 1;
  string store_path = 2;
  string nar_hash = 3;
  uint64 nar_size = 4;
  uint64 closure_size = 5;
}

// One rollout channel with its 256-partition assignment map.
message Channel {
  string name = 1;
  // Newest release any partition targets.
  string frontier = 2;
  // Assigned partitions only; unassigned buckets are omitted.
  repeated Partition partitions = 3;
}

message Partition {
  // Bucket index, 0..=255.
  uint32 bucket = 1;
  string release = 2;
}

// One verified, signed release tag.
message Release {
  string semver = 1;
  // Unpeeled tag object id.
  string tag_oid = 2;
  string commit_oid = 3;
  // Base64 SSH wire blob of the trusted key that signed the tag.
  string signer = 4;
  // Tagger timestamp, Unix seconds.
  int64 tagged_at = 5;
}

