syntax = "proto3";
package aos.hub.v1;

// Read-path services of the registry hub (RFC-0004). Phase 1 exposes the
// verified index — registries, packages, channels, releases — to browsers,
// CLIs, and third parties over one schema. Write-path services
// (RegistryConfigurationService, PublishService, …) arrive with later phases;
// PublishService
// mints short-lived, registry-scoped upload credentials.
//
// All list RPCs paginate: pass the previous response's next_page_token to
// continue; an empty token means the listing is complete.

service RegistryService {
  rpc ListRegistries(ListRegistriesRequest) returns (ListRegistriesResponse);
  rpc GetRegistry(GetRegistryRequest) returns (GetRegistryResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc PlanCreateRegistry(PlanCreateRegistryRequest) returns (TopologyPlanResponse);
  rpc CreateRegistry(ApplyRegistryMutationRequest) returns (RegistryResponse);
  rpc PlanUpdateRegistry(PlanUpdateRegistryRequest) returns (TopologyPlanResponse);
  rpc UpdateRegistry(ApplyRegistryMutationRequest) returns (RegistryResponse);
  rpc PlanDeleteRegistry(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteRegistry(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
}

// Orgs, membership, and invitations (RFC-0004 "Tenancy and IAM").
service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (OrganizationResponse);
  rpc PlanCreateOrganization(PlanCreateOrganizationRequest) returns (TopologyPlanResponse);
  rpc CreateOrganization(ApplyOrganizationMutationRequest) returns (OrganizationResponse);
  rpc PlanUpdateOrganization(PlanUpdateOrganizationRequest) returns (TopologyPlanResponse);
  rpc UpdateOrganization(ApplyOrganizationMutationRequest) returns (OrganizationResponse);
  rpc PlanDeleteOrganization(PlanDeleteOrganizationRequest) returns (TopologyPlanResponse);
  rpc DeleteOrganization(ApplyOrganizationMutationRequest) returns (DeleteTopologyResourceResponse);
}

// Immutable signing-key generations and typed surface usage bindings. Private
// key bytes are never accepted or returned by this API.
service SigningKeyService {
  rpc ListSigningKeys(ListSigningKeysRequest) returns (ListSigningKeysResponse);
  rpc GetSigningKey(GetSigningKeyRequest) returns (SigningKeyResponse);
  rpc GetSigningKeyUsage(GetSigningKeyUsageRequest) returns (SigningKeyUsageResponse);
  rpc PlanEnrollSigningKey(PlanSigningKeyMutationRequest) returns (TopologyPlanResponse);
  rpc EnrollSigningKey(ApplyTopologyPlanRequest) returns (SigningKeyResponse);
  rpc PlanRotateSigningKey(PlanSigningKeyMutationRequest) returns (TopologyPlanResponse);
  rpc RotateSigningKey(ApplyTopologyPlanRequest) returns (SigningKeyResponse);
  rpc PlanRetireSigningKey(PlanRetireSigningKeyRequest) returns (TopologyPlanResponse);
  rpc RetireSigningKey(ApplyTopologyPlanRequest) returns (SigningKeyResponse);
  rpc PlanSetSigningKeyUsage(PlanSigningKeyUsageRequest) returns (TopologyPlanResponse);
  rpc SetSigningKeyUsage(ApplyTopologyPlanRequest) returns (SigningKeyUsageResponse);
}

// Project-tree CRUD (RFC-0004 "Tenancy and IAM").
service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (ProjectResponse);
  rpc PlanCreateProject(PlanCreateProjectRequest) returns (TopologyPlanResponse);
  rpc CreateProject(ApplyProjectMutationRequest) returns (ProjectResponse);
  rpc PlanDeleteProject(PlanDeleteProjectRequest) returns (TopologyPlanResponse);
  rpc DeleteProject(ApplyProjectMutationRequest) returns (DeleteTopologyResourceResponse);
}

// Bindings (RFC-0004 "Storage: Binding and shared buckets").
service BindingService {
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse);
  rpc PlanCreateBinding(PlanBindingMutationRequest) returns (TopologyPlanResponse);
  rpc CreateBinding(ApplyBindingMutationRequest) returns (BindingResponse);
  rpc PlanSetBindingCredential(PlanBindingCredentialRequest) returns (TopologyPlanResponse);
  rpc SetBindingCredential(ApplyBindingCredentialRequest) returns (BindingCredentialResponse);
  rpc PlanRotateBindingCredential(PlanBindingCredentialRequest) returns (TopologyPlanResponse);
  rpc RotateBindingCredential(ApplyBindingCredentialRequest) returns (BindingCredentialResponse);
  rpc PlanValidateBindingCredential(PlanValidateBindingCredentialRequest) returns (TopologyPlanResponse);
  rpc ValidateBindingCredential(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc PlanGrantBindingScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc GrantBindingScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanRevokeBindingScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc RevokeBindingScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc ListBindingWriteRevisions(ListBindingWriteRevisionsRequest) returns (ListBindingWriteRevisionsResponse);
  rpc GetBindingWriteRevision(GetBindingWriteRevisionRequest) returns (BindingWriteRevisionResponse);
  rpc PlanDeleteBinding(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteBinding(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
  rpc GetInstanceTopologyDefaults(GetInstanceTopologyDefaultsRequest) returns (TopologyDefaultsResponse);
  rpc PlanSetInstanceTopologyDefaults(PlanSetTopologyDefaultsRequest) returns (TopologyPlanResponse);
  rpc SetInstanceTopologyDefaults(ApplySetTopologyDefaultsRequest) returns (TopologyDefaultsResponse);
  rpc GetOrganizationTopologyDefaults(GetOrganizationTopologyDefaultsRequest) returns (TopologyDefaultsResponse);
  rpc PlanSetOrganizationTopologyDefaults(PlanSetTopologyDefaultsRequest) returns (TopologyPlanResponse);
  rpc SetOrganizationTopologyDefaults(ApplySetTopologyDefaultsRequest) returns (TopologyDefaultsResponse);
}

service DomainService {
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);
  rpc GetDomain(GetTopologyResourceRequest) returns (DomainResponse);
  rpc PlanCreateDomain(PlanDomainMutationRequest) returns (TopologyPlanResponse);
  rpc CreateDomain(ApplyDomainMutationRequest) returns (DomainResponse);
  rpc PlanConfigureDomainDns(PlanDomainDnsRequest) returns (TopologyPlanResponse);
  rpc ConfigureDomainDns(ApplyDomainConfigurationRequest) returns (DomainResponse);
  rpc PlanConfigureDomainCertificate(PlanDomainCertificateRequest) returns (TopologyPlanResponse);
  rpc ConfigureDomainCertificate(ApplyDomainConfigurationRequest) returns (DomainResponse);
  rpc PlanVerifyDomain(PlanVerifyDomainRequest) returns (TopologyPlanResponse);
  rpc VerifyDomain(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc PlanDeleteDomain(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteDomain(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
}

service NetworkPolicyService {
  rpc ListNetworkPolicies(ListTopologyResourcesRequest) returns (ListNetworkPoliciesResponse);
  rpc GetNetworkPolicy(GetTopologyResourceRequest) returns (NetworkPolicyResponse);
  rpc PlanCreateNetworkPolicy(PlanNetworkPolicyMutationRequest) returns (TopologyPlanResponse);
  rpc CreateNetworkPolicy(ApplyNetworkPolicyMutationRequest) returns (NetworkPolicyResponse);
  rpc ListNetworkPolicyRevisions(ListNetworkPolicyRevisionsRequest) returns (ListNetworkPolicyRevisionsResponse);
  rpc GetNetworkPolicyRevision(GetNetworkPolicyRevisionRequest) returns (NetworkPolicyRevisionResponse);
  rpc PlanReviseNetworkPolicy(PlanNetworkPolicyRevisionRequest) returns (TopologyPlanResponse);
  rpc ReviseNetworkPolicy(ApplyNetworkPolicyRevisionRequest) returns (NetworkPolicyRevisionResponse);
  rpc PlanActivateNetworkPolicyRevision(PlanNetworkPolicyLifecycleRequest) returns (TopologyPlanResponse);
  rpc ActivateNetworkPolicyRevision(ApplyNetworkPolicyLifecycleRequest) returns (NetworkPolicyRevisionResponse);
  rpc PlanRetireNetworkPolicyRevision(PlanNetworkPolicyLifecycleRequest) returns (TopologyPlanResponse);
  rpc RetireNetworkPolicyRevision(ApplyNetworkPolicyLifecycleRequest) returns (NetworkPolicyRevisionResponse);
  rpc PlanGrantNetworkPolicyScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc GrantNetworkPolicyScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanRevokeNetworkPolicyScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc RevokeNetworkPolicyScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanDeleteNetworkPolicy(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteNetworkPolicy(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
}

service DeliveryService {
  rpc ListEndpoints(ListTopologyResourcesRequest) returns (ListEndpointsResponse);
  rpc GetEndpoint(GetTopologyResourceRequest) returns (EndpointResponse);
  rpc PlanCreateEndpoint(PlanEndpointMutationRequest) returns (TopologyPlanResponse);
  rpc CreateEndpoint(ApplyEndpointMutationRequest) returns (EndpointResponse);
  rpc ListEndpointGenerations(ListEndpointGenerationsRequest) returns (ListEndpointGenerationsResponse);
  rpc GetEndpointGeneration(GetEndpointGenerationRequest) returns (EndpointGenerationResponse);
  rpc PlanStageEndpointGeneration(PlanStageEndpointGenerationRequest) returns (TopologyPlanResponse);
  rpc StageEndpointGeneration(ApplyEndpointGenerationRequest) returns (EndpointGenerationResponse);
  rpc PlanActivateEndpointGeneration(PlanActivateEndpointGenerationRequest) returns (TopologyPlanResponse);
  rpc ActivateEndpointGeneration(ApplyEndpointGenerationRequest) returns (EndpointResponse);
  rpc PlanGrantEndpointScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc GrantEndpointScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanRevokeEndpointScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc RevokeEndpointScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanDeleteEndpoint(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteEndpoint(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);

  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  rpc GetGateway(GetTopologyResourceRequest) returns (GatewayResponse);
  rpc PlanCreateGateway(PlanGatewayMutationRequest) returns (TopologyPlanResponse);
  rpc CreateGateway(ApplyGatewayMutationRequest) returns (GatewayResponse);
  rpc PlanUpdateGateway(PlanGatewayMutationRequest) returns (TopologyPlanResponse);
  rpc UpdateGateway(ApplyGatewayMutationRequest) returns (GatewayResponse);
  rpc PlanGrantGatewayScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc GrantGatewayScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PlanRevokeGatewayScope(PlanConsumerScopeGrantRequest) returns (TopologyPlanResponse);
  rpc RevokeGatewayScope(ApplyConsumerScopeGrantRequest) returns (ConsumerScopeGrantResponse);
  rpc PreviewGatewayRoutes(GetTopologyResourceRequest) returns (GatewayRoutePreviewResponse);
  rpc PlanEnableGateway(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc EnableGateway(ApplyDeleteTopologyResourceRequest) returns (GatewayResponse);
  rpc PlanDisableGateway(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DisableGateway(ApplyDeleteTopologyResourceRequest) returns (GatewayResponse);
  rpc PlanDeleteGateway(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteGateway(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
}

service RouteService {
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc GetRoute(GetTopologyResourceRequest) returns (RouteResponse);
  rpc PlanCreateRoute(PlanRouteMutationRequest) returns (TopologyPlanResponse);
  rpc CreateRoute(ApplyRouteMutationRequest) returns (RouteResponse);
  rpc PlanUpdateRoute(PlanRouteMutationRequest) returns (TopologyPlanResponse);
  rpc UpdateRoute(ApplyRouteMutationRequest) returns (RouteResponse);
  rpc PlanReplaceRoute(PlanReplaceRouteRequest) returns (TopologyPlanResponse);
  rpc ReplaceRoute(ApplyRouteMutationRequest) returns (RouteResponse);
  rpc PlanEnableRoute(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc EnableRoute(ApplyDeleteTopologyResourceRequest) returns (RouteResponse);
  rpc PlanDisableRoute(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DisableRoute(ApplyDeleteTopologyResourceRequest) returns (RouteResponse);
  rpc PlanDeleteRoute(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteRoute(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
  rpc PlanSetRouteAdvertisement(PlanRouteAdvertisementRequest) returns (TopologyPlanResponse);
  rpc SetRouteAdvertisement(ApplyRouteAdvertisementRequest) returns (RouteAdvertisementResponse);
  rpc ExplainRoute(ExplainRouteRequest) returns (ExplainRouteResponse);
}

// Topology inventory and placement lifecycle management for registry and
// binary-cache surfaces. Desired placement configuration, controller
// observations, and single-writer authority are separate resources.
// Placement identities are stable names within a typed surface; database ids
// are deliberately not public.
// All placement writes temporarily require storage.manage on the owning org
// (or root iam.admin for an org-less surface) until topology.manage exists.
service TopologyService {
  rpc GetSurfaceTopology(GetSurfaceTopologyRequest) returns (GetSurfaceTopologyResponse);
  rpc ExplainSurfaceRequest(ExplainSurfaceRequestRequest) returns (ExplainSurfaceRequestResponse);
  rpc ListPlacements(ListPlacementsRequest) returns (ListPlacementsResponse);
  rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse);
  rpc PlanCreatePlacement(PlanCreatePlacementRequest) returns (TopologyPlanResponse);
  rpc CreatePlacement(ApplyTopologyPlanRequest) returns (PlacementResponse);
  rpc PlanUpdatePlacement(PlanUpdatePlacementRequest) returns (TopologyPlanResponse);
  rpc UpdatePlacement(ApplyTopologyPlanRequest) returns (PlacementResponse);
  rpc GetWriteAuthority(GetWriteAuthorityRequest) returns (GetWriteAuthorityResponse);
  rpc PlanPromotePlacement(PlacementMutationRequest) returns (TopologyPlanResponse);
  rpc PromotePlacement(ApplyTopologyPlanRequest) returns (GetWriteAuthorityResponse);
  rpc PlanCancelPlacementPromotion(SurfaceMutationRequest) returns (TopologyPlanResponse);
  rpc CancelPlacementPromotion(ApplyTopologyPlanRequest) returns (GetWriteAuthorityResponse);
  rpc PlanRemoveWriteAuthority(SurfaceMutationRequest) returns (TopologyPlanResponse);
  rpc RemoveWriteAuthority(ApplyTopologyPlanRequest) returns (RemoveWriteAuthorityResponse);
  rpc PlanDrainPlacement(PlacementMutationRequest) returns (TopologyPlanResponse);
  rpc DrainPlacement(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc PlanCancelPlacementDrain(PlacementMutationRequest) returns (TopologyPlanResponse);
  rpc CancelPlacementDrain(ApplyTopologyPlanRequest) returns (PlacementResponse);
  rpc PlanDeletePlacement(PlacementMutationRequest) returns (TopologyPlanResponse);
  rpc DeletePlacement(ApplyTopologyPlanRequest) returns (DeleteTopologyResourceResponse);
  rpc PlanScanPlacement(PlanScanPlacementRequest) returns (TopologyPlanResponse);
  rpc ScanPlacement(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc PlanReplicatePlacement(PlanReplicatePlacementRequest) returns (TopologyPlanResponse);
  rpc ReplicatePlacement(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc PlanRepairPlacement(PlanRepairPlacementRequest) returns (TopologyPlanResponse);
  rpc RepairPlacement(ApplyTopologyPlanRequest) returns (OperationResponse);
  rpc ListObjectPresence(ListObjectPresenceRequest) returns (ListObjectPresenceResponse);

  rpc ListPlacementPolicies(SurfaceListRequest) returns (ListPlacementPoliciesResponse);
  rpc GetPlacementPolicy(GetPlacementPolicyRequest) returns (PlacementPolicyResponse);
  rpc ListPlacementPolicyRevisions(ListPlacementPolicyRevisionsRequest) returns (ListPlacementPolicyRevisionsResponse);
  rpc GetPlacementPolicyRevision(GetPlacementPolicyRevisionRequest) returns (PlacementPolicyRevisionResponse);
  rpc PlanCreatePlacementPolicy(PlanPlacementPolicyMutationRequest) returns (TopologyPlanResponse);
  rpc CreatePlacementPolicy(ApplyTopologyPlanRequest) returns (PlacementPolicyResponse);
  rpc PlanRevisePlacementPolicy(PlanPlacementPolicyMutationRequest) returns (TopologyPlanResponse);
  rpc RevisePlacementPolicy(ApplyTopologyPlanRequest) returns (PlacementPolicyRevisionResponse);
  rpc TestPlacementPolicyRevision(TestPlacementPolicyRevisionRequest) returns (TestPlacementPolicyRevisionResponse);

  rpc ListPlacementEquivalences(SurfaceListRequest) returns (ListPlacementEquivalencesResponse);
  rpc PlanConfirmPlacementEquivalence(PlanPlacementEquivalenceRequest) returns (TopologyPlanResponse);
  rpc ConfirmPlacementEquivalence(ApplyTopologyPlanRequest) returns (PlacementEquivalenceResponse);
  rpc PlanDeletePlacementEquivalence(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeletePlacementEquivalence(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
}

service RegistryMirrorService {
  rpc GetRegistryMirror(GetRegistryMirrorRequest) returns (RegistryMirrorResponse);
  rpc PlanSetRegistryMirror(PlanRegistryMirrorMutationRequest) returns (TopologyPlanResponse);
  rpc SetRegistryMirror(ApplyTopologyPlanRequest) returns (RegistryMirrorResponse);
  rpc PlanDeleteRegistryMirror(PlanDeleteTopologyResourceRequest) returns (TopologyPlanResponse);
  rpc DeleteRegistryMirror(ApplyDeleteTopologyResourceRequest) returns (DeleteTopologyResourceResponse);
  rpc PlanSyncRegistryMirror(PlanSyncRegistryMirrorRequest) returns (TopologyPlanResponse);
  rpc SyncRegistryMirror(ApplyTopologyPlanRequest) returns (OperationResponse);
}

// Fenced controller-only observations. These services are never routed through
// the public API surface. Every request identifies the held controller lease,
// fences its generation, and CASes the exact prior observation version.
service BindingControllerService {
  rpc ReportBindingWriteRevision(ReportBindingWriteRevisionRequest) returns (BindingWriteRevisionResponse);
}
service NetworkPolicyControllerService {
  rpc CompleteNetworkPolicyRevisionProbe(CompleteNetworkPolicyRevisionProbeRequest) returns (NetworkPolicyRevisionResponse);
  rpc ReportNetworkPolicyRevision(ReportNetworkPolicyRevisionRequest) returns (NetworkPolicyRevisionResponse);
}
service DeliveryControllerService {
  rpc CompleteEndpointProbe(CompleteEndpointProbeRequest) returns (EndpointResponse);
  rpc ReportEndpoint(ReportEndpointRequest) returns (EndpointResponse);
  rpc ReportGateway(ReportGatewayRequest) returns (GatewayResponse);
}
service RouteControllerService {
  rpc CompleteRouteProbe(CompleteRouteProbeRequest) returns (OperationResponse);
}
service TopologyControllerService {
  rpc ReportWriteAuthority(ReportWriteAuthorityRequest) returns (WriteAuthorityObservationResponse);
}
service BinaryCacheUploadControllerService {
  rpc ReportCacheUpload(ReportCacheUploadRequest) returns (CacheUploadObservationResponse);
  rpc ReportCacheNarinfos(ReportCacheNarinfosRequest) returns (CacheNarinfoRegistrationResponse);
}

// Append-only audit log queries (RFC-0004 "Tenancy and IAM" / "Access
// matrix"). Reads require audit.read (admin+) on the queried scope.
service AuditService {
  // List recent audit entries at a scope, newest first. Requires a bearer
  // JWT with audit.read on the scope.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
}

// Deployment-wide instance settings (RFC-0004 "Instance administration"):
// branding, footer/legal links, identity policy, and serving defaults. The
// same key/value surface the `/-/instance` console edits and the `aos hub
// instance` CLI drives. Reads require iam.admin at the instance root; updates
// likewise.
service InstanceService {
  // Read the full editable instance-settings bundle. Requires iam.admin at the
  // instance root.
  rpc GetInstanceSettings(GetInstanceSettingsRequest)
      returns (GetInstanceSettingsResponse);
  // Persist an immutable, exact-version plan for replacing instance settings.
  // Requires iam.admin at the instance root.
  rpc PlanSetInstanceSettings(PlanSetInstanceSettingsRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed instance-settings plan exactly once.
  rpc SetInstanceSettings(ApplyTopologyPlanRequest)
      returns (GetInstanceSettingsResponse);
}

// SQL-backed configuration change-sets (RFC-0004 "Configuration
// management"): the append-only revision log over orgs, projects, members,
// roles, tokens, visibility, and bindings. Reads require audit.read on the
// scope. Durable configuration changes use the retained change-request API;
// this service is intentionally read-only.
service RegistryConfigurationService {
  // List change-sets at a scope, newest first. Requires audit.read.
  rpc ListChangesets(ListChangesetsRequest) returns (ListChangesetsResponse);
  // Load one change-set's revisions and their semantic field diffs (the
  // terraform-plan review view). Requires audit.read.
  rpc GetChangeset(GetChangesetRequest) returns (GetChangesetResponse);
}

service PackageService {
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  rpc GetPackage(GetPackageRequest) returns (GetPackageResponse);
}

// Authenticated package documentation and tooling schema. Canonical document
// bytes remain sourced from the signed Nix object; search rows are disposable
// projections rebuilt by registry indexing.
service DocumentationService {
  rpc GetPackageDocumentation(GetPackageDocumentationRequest) returns (GetPackageDocumentationResponse);
  rpc SearchPackageDocumentation(SearchPackageDocumentationRequest) returns (SearchPackageDocumentationResponse);
  rpc ListPackageOptions(ListPackageOptionsRequest) returns (ListPackageOptionsResponse);
  rpc GetPackageOption(GetPackageOptionRequest) returns (GetPackageOptionResponse);
  rpc ComparePackageDocumentation(ComparePackageDocumentationRequest) returns (ComparePackageDocumentationResponse);
  rpc GetDocumentationArtifact(GetDocumentationArtifactRequest) returns (GetPackageDocumentationResponse);
  rpc GetPackageDocumentationSchema(GetPackageDocumentationSchemaRequest) returns (GetPackageDocumentationSchemaResponse);
}

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
}

// End-user AOS system-image discovery. Every result is derived from direct
// delivery metadata inside an authenticated signed sysroot catalog. The
// service exposes exact disk-image bytes, never a NAR or store directory.
service ImageService {
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  rpc ResolveImage(ResolveImageRequest) returns (GetImageResponse);
}

// The managed, placement-aware registry publication path. Producers declare an
// exact manifest, upload bytes through object-id URLs, and commit only after
// every required placement has verified every immutable object and mutable
// pointer. No resource-slug upload facade exists.
service PublishService {
  rpc BeginRegistryPublication(BeginRegistryPublicationRequest)
      returns (RegistryPublication);
  rpc BeginRegistryPublicationManifest(
      BeginRegistryPublicationManifestRequest)
      returns (RegistryPublicationManifestSession);
  rpc AppendRegistryPublicationManifest(
      AppendRegistryPublicationManifestRequest)
      returns (RegistryPublicationManifestSession);
  rpc SealRegistryPublicationManifest(SealRegistryPublicationManifestRequest)
      returns (RegistryPublication);
  rpc BeginRegistryPublicationMultipartUpload(
      BeginRegistryPublicationMultipartUploadRequest)
      returns (BeginRegistryPublicationMultipartUploadResponse);
  rpc CompleteRegistryPublicationMultipartUpload(
      CompleteRegistryPublicationMultipartUploadRequest)
      returns (RegistryPublicationMultipartUploadResponse);
  rpc AbortRegistryPublicationMultipartUpload(
      AbortRegistryPublicationMultipartUploadRequest)
      returns (RegistryPublicationMultipartUploadResponse);
  rpc ListRegistryPublications(ListRegistryPublicationsRequest)
      returns (ListRegistryPublicationsResponse);
  rpc GetRegistryPublication(GetRegistryPublicationRequest)
      returns (RegistryPublication);
  rpc CommitRegistryPublication(CommitRegistryPublicationRequest)
      returns (RegistryPublication);
  rpc AbortRegistryPublication(AbortRegistryPublicationRequest)
      returns (RegistryPublication);
  rpc BeginReleasePublication(BeginReleasePublicationRequest)
      returns (ReleasePublicationState);
  rpc CommitReleasePublication(CommitReleasePublicationRequest)
      returns (ReleaseReceipt);
  rpc RecordReleaseQualification(RecordReleaseQualificationRequest)
      returns (ReleaseQualificationState);
  rpc PromoteReleasePublication(PromoteReleasePublicationRequest)
      returns (ReleaseReceipt);
  rpc GetReleaseReceipt(GetReleaseReceiptRequest)
      returns (ReleaseReceipt);
  rpc PublishReleaseTimestamp(PublishReleaseTimestampRequest)
      returns (ReleaseTimestampState);
  rpc AdvanceReleaseChannel(AdvanceReleaseChannelRequest)
      returns (ReleaseReceipt);
}

// Git read API for the UI and remote `apr` (RFC-0012 "API: aos.hub.v1"
// GitService; "Configuration management" git-backed change requests). Reads of
// the committed history and config diffs require `read` (or `audit.read` for the
// change-request list) on the registry's scope, following registry visibility.
service GitService {
  // The committed commit log of a registry's tracked branch, newest first.
  // Requires `read` on the registry scope.
  rpc GitLog(GitLogRequest) returns (GitLogResponse);
  // A textual unified-ish diff of the committed config files (registry.toml,
  // keys.toml, packages/) between two commits. Requires `read`.
  rpc GitDiff(GitDiffRequest) returns (GitDiffResponse);
  // The registry's draft git-backed change requests with their file diffs and
  // the `apr change merge` command that promotes each. Requires `audit.read`.
  rpc ListChangeRequests(ListChangeRequestsRequest)
      returns (ListChangeRequestsResponse);
}

// Outbound webhook subscriptions (RFC-0004 phase 4 "webhooks/notifications").
// An org subscribes an HTTP endpoint to a set of registry event types; the hub
// HMAC-signs and delivers each matching event. Every RPC is admin-only:
// they require members.manage on the org scope (managing notification
// endpoints is an org-administration surface, alongside member and token
// management).
service WebhookService {
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc PlanCreateWebhook(PlanCreateWebhookRequest) returns (TopologyPlanResponse);
  rpc CreateWebhook(ApplyWebhookMutationRequest) returns (CreateWebhookResponse);
  rpc PlanDeleteWebhook(PlanDeleteWebhookRequest) returns (TopologyPlanResponse);
  rpc DeleteWebhook(ApplyWebhookMutationRequest) returns (DeleteTopologyResourceResponse);
}

message ListRegistriesRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListRegistriesResponse {
  repeated Registry registries = 1;
  string next_page_token = 2;
}

message GetRegistryRequest {
  string slug = 1;
}

message GetRegistryResponse {
  Registry registry = 1;
}

message ListReleasesRequest {
  string slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListReleasesResponse {
  repeated Release releases = 1;
  string next_page_token = 2;
}

message ListPackagesRequest {
  string slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListPackagesResponse {
  repeated PackageSummary packages = 1;
  string next_page_token = 2;
}

message GetPackageRequest {
  string slug = 1;
  string name = 2;
}

message GetPackageResponse {
  Package package = 1;
}

message GetPackageDocumentationRequest {
  string registry = 1;
  string package = 2;
  string version = 3;
  string platform = 4;
}

message PackageDocumentationIdentity {
  string registry_commit = 1;
  string package = 2;
  string version = 3;
  string platform = 4;
  string format = 5;
  string store_path = 6;
  string nar_hash = 7;
  uint64 nar_size = 8;
  string document_sha256 = 9;
  uint64 document_size = 10;
  string semantic_schema_sha256 = 11;
}

message GetPackageDocumentationResponse {
  PackageDocumentationIdentity identity = 1;
  bytes canonical_json = 2;
  string etag = 3;
}

message SearchPackageDocumentationRequest {
  string registry = 1;
  string query = 2;
  string kind = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message PackageDocumentationSearchResult {
  string package = 1;
  string version = 2;
  string platform = 3;
  string kind = 4;
  string key = 5;
  string title = 6;
  string summary = 7;
  uint64 score = 8;
}

message SearchPackageDocumentationResponse {
  repeated PackageDocumentationSearchResult results = 1;
  string next_page_token = 2;
}

message DocumentationPathSegment {
  oneof segment {
    string literal = 1;
    string wildcard = 2;
  }
}

message ListPackageOptionsRequest {
  string registry = 1;
  string package = 2;
  string version = 3;
  string platform = 4;
  string prefix = 5;
  string owner = 6;
  string type = 7;
  optional bool contributable = 8;
  uint32 page_size = 9;
  string page_token = 10;
}

message PackageOptionView {
  PackageDocumentationIdentity identity = 1;
  repeated DocumentationPathSegment path = 2;
  string display_path = 3;
  string type = 4;
  string owner_package = 5;
  string owner_root = 6;
  bool contributable = 7;
  bytes canonical_option_json = 8;
}

message ListPackageOptionsResponse {
  repeated PackageOptionView options = 1;
  string next_page_token = 2;
}

message GetPackageOptionRequest {
  string registry = 1;
  string package = 2;
  string version = 3;
  string platform = 4;
  repeated DocumentationPathSegment path = 5;
}

message GetPackageOptionResponse { PackageOptionView option = 1; }

message ComparePackageDocumentationRequest {
  string registry = 1;
  string package = 2;
  string from_version = 3;
  string to_version = 4;
  string platform = 5;
}

message ComparePackageDocumentationResponse {
  PackageDocumentationIdentity from = 1;
  PackageDocumentationIdentity to = 2;
  bytes canonical_comparison_json = 3;
}

message GetDocumentationArtifactRequest {
  string registry = 1;
  string document_sha256 = 2;
}

message GetPackageDocumentationSchemaRequest {}

message GetPackageDocumentationSchemaResponse {
  string schema = 1;
  string media_type = 2;
  bytes json_schema = 3;
}

message ListChannelsRequest {
  string slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListChannelsResponse {
