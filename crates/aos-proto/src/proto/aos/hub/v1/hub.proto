message BinaryCache {
  string stable_id = 1;
  string slug = 2;
  string name = 3;
  string owner_scope_key = 4;
  string visibility = 5;
  uint32 nix_priority = 6;
  string compression = 7;
  bool want_mass_query = 8;
  bool signed = 9;
  string resource_version = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  uint64 used_bytes = 13;
  uint64 object_count = 14;
  uint64 placement_count = 15;
  uint64 retention_root_count = 16;
  // Exact immutable scope used to authorize cache-local operations.
  string authorization_scope_key = 17;
}

message BinaryCacheSpec {
  string slug = 1;
  string name = 2;
  string owner_scope_key = 3;
  string visibility = 4;
  uint32 nix_priority = 5;
  string compression = 6;
  bool want_mass_query = 7;
}

message PlanBinaryCacheMutationRequest {
  string stable_id = 1;
  BinaryCacheSpec desired = 2;
  repeated string update_mask = 3;
  string expected_resource_version = 4;
  string idempotency_key = 5;
}

message ApplyBinaryCacheMutationRequest {
  string plan_id = 1;
  string idempotency_key = 2;
  string confirmation_hash = 3;
}

message GetBinaryCacheRequest { string cache_id = 1; }
message BinaryCacheResponse { BinaryCache cache = 1; }
message ListBinaryCachesRequest {
  string owner_scope_key = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListBinaryCachesResponse {
  repeated BinaryCache caches = 1;
  string next_page_token = 2;
}

message OperationRef {
  string operation_id = 1;
  string kind = 2;
  string state = 3;
  int64 created_at = 4;
}
message OperationResponse { OperationRef operation = 1; }
message OperationResourceRef {
  oneof target {
    string registry_id = 1;
    string binary_cache_id = 2;
    string placement_id = 3;
    string domain_id = 4;
    string network_policy_id = 5;
    string endpoint_id = 6;
    string gateway_id = 7;
    string route_id = 8;
    string placement_policy_id = 9;
