  string delivery_url = 2;
  // Bounded batch to observe and publish after its NAR uploads complete.
  repeated CacheNarinfo narinfos = 3;
}

// IAM management: service accounts, scoped role grants, and access tokens
// tokens — the machine API behind the producer console's settings pages, so the
// CLI and automation administer identities over the authenticated API instead
// of direct database access (RFC-0004 ch.14 "manage everything via the API").
//
// Every method takes a bearer JWT and authorizes against the same grants the
// console enforces: `iam.admin` at the instance root, or `registry.configure`
// at the target registry/org scope. A minted token's effective permissions are
// intersected with the owning principal's grants — a token can never exceed its
// owner's authority.
service IdentityService {
  // Describe the authenticated principal, its live grants, and this access
  // token's authority. The response contains no token secret.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // List an organization's service accounts.
  rpc ListServiceAccounts(ListServiceAccountsRequest)
      returns (ListServiceAccountsResponse);
  // Inspect one organization-owned service account.
  rpc GetServiceAccount(GetServiceAccountRequest)
      returns (ServiceAccountResponse);
  // Plan creation of an org-owned service account.
  rpc PlanCreateServiceAccount(PlanCreateServiceAccountRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed service-account creation plan exactly once.
  rpc CreateServiceAccount(ApplyTopologyPlanRequest)
      returns (ServiceAccountResponse);
  // Plan renaming one service account without changing its stable identity.
  rpc PlanUpdateServiceAccount(PlanUpdateServiceAccountRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed service-account update plan exactly once.
  rpc UpdateServiceAccount(ApplyTopologyPlanRequest)
      returns (ServiceAccountResponse);
  // Plan deletion of one service account and its direct memberships.
  rpc PlanDeleteServiceAccount(PlanDeleteServiceAccountRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed service-account deletion plan exactly once.
  rpc DeleteServiceAccount(ApplyTopologyPlanRequest)
      returns (DeleteTopologyResourceResponse);
  // Read one direct membership grant and its exact resource version.
  rpc GetMembership(GetMembershipRequest) returns (MembershipResponse);
  // Plan an exact membership replacement. An empty role removes the grant.
  rpc PlanSetMembership(PlanSetMembershipRequest) returns (TopologyPlanResponse);
  // Apply one reviewed membership replacement exactly once.
  rpc SetMembership(ApplyTopologyPlanRequest) returns (MembershipResponse);
  // List invitation history for one organization.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  // Inspect one invitation without exposing its acceptance secret.
  rpc GetInvitation(GetInvitationRequest) returns (InvitationResponse);
  // Plan creation of a pending invitation.
  rpc PlanCreateInvitation(PlanCreateInvitationRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed invitation-creation plan exactly once.
  rpc CreateInvitation(ApplyTopologyPlanRequest) returns (InvitationResponse);
  // Plan cancellation of one pending invitation.
  rpc PlanCancelInvitation(PlanCancelInvitationRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed invitation cancellation exactly once.
  rpc CancelInvitation(ApplyTopologyPlanRequest) returns (InvitationResponse);
  // Accept an invitation as the authenticated user named by it.
  rpc AcceptInvitation(AcceptInvitationRequest)
      returns (AcceptInvitationResponse);
  // Inspect an organization's OIDC identity-provider configuration without
  // exposing sealed or plaintext client credentials.
  rpc GetIdentityProvider(GetIdentityProviderRequest)
      returns (IdentityProviderResponse);
  // Plan creation or exact-version replacement of one OIDC configuration.
  rpc PlanSetIdentityProvider(PlanSetIdentityProviderRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed OIDC configuration plan exactly once.
  rpc SetIdentityProvider(ApplyTopologyPlanRequest)
      returns (IdentityProviderResponse);
  // Plan removal of one exact OIDC configuration.
  rpc PlanRemoveIdentityProvider(PlanRemoveIdentityProviderRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed OIDC configuration removal exactly once.
  rpc RemoveIdentityProvider(ApplyTopologyPlanRequest)
      returns (DeleteTopologyResourceResponse);
  // List claimed email domains for one organization.
  rpc ListOrganizationDomains(ListOrganizationDomainsRequest)
      returns (ListOrganizationDomainsResponse);
  // Inspect one organization email-domain claim.
  rpc GetOrganizationDomain(GetOrganizationDomainRequest)
      returns (OrganizationDomainResponse);
  // Plan creation or challenge rotation of one email-domain claim.
  rpc PlanClaimOrganizationDomain(PlanClaimOrganizationDomainRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed email-domain claim exactly once.
  rpc ClaimOrganizationDomain(ApplyTopologyPlanRequest)
      returns (OrganizationDomainResponse);
  // Plan DNS-TXT verification of one exact domain challenge.
  rpc PlanVerifyOrganizationDomain(PlanVerifyOrganizationDomainRequest)
      returns (TopologyPlanResponse);
  // Resolve DNS and commit verified state for one reviewed challenge.
  rpc VerifyOrganizationDomain(ApplyTopologyPlanRequest)
      returns (OrganizationDomainResponse);
  // Plan release of one exact email-domain claim.
  rpc PlanReleaseOrganizationDomain(PlanReleaseOrganizationDomainRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed email-domain release exactly once.
  rpc ReleaseOrganizationDomain(ApplyTopologyPlanRequest)
      returns (DeleteTopologyResourceResponse);
  // Plan issuance of a scoped bearer token.
  rpc PlanIssueAccessToken(PlanIssueAccessTokenRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed token-issuance plan; the secret is returned once.
  rpc IssueAccessToken(ApplyTopologyPlanRequest)
      returns (AccessTokenResponse);
  // Plan retirement of one token generation.
  rpc PlanRetireAccessToken(PlanRetireAccessTokenRequest)
      returns (TopologyPlanResponse);
  // Apply one reviewed token-retirement plan exactly once.
  rpc RetireAccessToken(ApplyTopologyPlanRequest)
      returns (AccessTokenRetirementResponse);
  // List the tokens visible at a scope (metadata only — never the secret).
  rpc ListAccessTokens(ListAccessTokensRequest) returns (ListAccessTokensResponse);
}

message WhoAmIRequest {}

// Principal summary returned by the browser session-to-bearer bridge.
message BrowserSessionPrincipal {
  // Always "user"; browser sessions cannot belong to service accounts.
  string kind = 1;
  int64 id = 2;
  string email = 3;
}

// One live grant returned during browser application bootstrap.
message BrowserSessionGrant {
  string scope = 1;
  string role = 2;
}

// Non-cacheable response from POST /-/auth/session-token.
message BrowserSessionTokenResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  BrowserSessionPrincipal principal = 4;
  repeated BrowserSessionGrant grants = 5;
  // Effective live permissions on the canonical management route supplied
  // during this exchange. Empty when the route is absent or unresolved.
  repeated string route_permissions = 6;
}

// One live role grant held directly by the authenticated principal.
message IdentityGrant {
  // Canonical stable authorization scope.
  string scope = 1;
  // Role name: owner | admin | maintainer | developer | viewer.
  string role = 2;
}

message WhoAmIResponse {
  // "user" or "service_account".
  string principal_kind = 1;
  // Stable human-facing reference: email or "<org>/<service-account>".
  string principal_ref = 2;
  // User email; empty for a service account.
  string email = 3;
  // Current live role grants, ordered by canonical scope.
  repeated IdentityGrant grants = 4;
  // Canonical scope carried by this access token.
  string access_scope = 5;
  // Permission verbs carried by this access token.
  repeated string access_permissions = 6;
  // Unix seconds when this access token expires.
  int64 access_expires_at = 7;
}

