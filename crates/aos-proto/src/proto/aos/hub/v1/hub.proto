  repeated string trust_keys = 5;
  repeated string update_mask = 6;
  string expected_resource_version = 7;
  string idempotency_key = 8;
}

// The full editable instance-settings bundle. Every field carries its
// effective value (a stored override or the documented default), so a client
// reads exactly what the serving path uses. Unset optionals (the numeric
// `*_secs`/`*_bytes`) are conveyed as 0, meaning "use the built-in default".
message InstanceSettings {
  // Site title shown in the masthead and page titles; empty renders no title.
  string site_title = 1;
  // Short tagline shown beside the brand.
  string tagline = 2;
  // Global announcement banner rendered on every console page; empty for none.
  string announcement = 3;
  // Terms-of-service URL for the footer.
  string tos_url = 4;
  // Privacy-policy URL for the footer.
  string privacy_url = 5;
  // Support/contact URL for the footer.
  string support_url = 6;
  // Who may create organizations: open | invite_only.
  string signup_policy = 7;
  // Lowercased email-domain allowlist for signup; empty allows any domain.
  repeated string signup_domains = 8;
  // Whether local password login is offered (else SSO/magic-link only).
  bool password_login = 9;
  // Session absolute lifetime in seconds; 0 = the built-in default.
  int64 session_lifetime_secs = 10;
  // Default robots.txt crawl policy new registries inherit:
  // allow_all | allow_no_ai | deny_all.
  string default_crawl_policy = 11;
  // Maximum surface upload size in bytes; 0 = the built-in default.
  int64 max_upload_bytes = 12;
  // Whether cache discovery is visible to unauthenticated visitors.
  bool caches_public = 13;
}

message GetInstanceSettingsRequest {}

message GetInstanceSettingsResponse {
  // The full effective settings bundle.
  InstanceSettings settings = 1;
  // SHA-256 revision of the exact effective bundle.
  string resource_version = 2;
}

message PlanSetInstanceSettingsRequest {
  // Keys to set, by their canonical name (e.g. `site_title`, `signup_policy`,
  // `signup_domains`). A blank value clears the key to its default; values are
  // validated per key (`signup_policy`, `default_crawl_policy`, and the numeric
  // keys are checked) and an unknown key is rejected.
  map<string, string> values = 1;
  // Keys to explicitly reset to their default (equivalent to setting them
  // blank). Same key namespace as `values`.
  repeated string clear = 2;
  // Exact current settings revision observed while planning.
  string expected_resource_version = 3;
  // Idempotency key for creating or replaying this immutable plan.
  string idempotency_key = 4;
}
// -- Audit log (phase 3a) --------------------------------------------------

// One append-only audit-log entry: who did what, where, and the change-set
// and cryptographic-history cross-references.
message AuditEntry {
  // The change-set this entry ties to ("" when not change-set driven).
  string change_id = 1;
  // Human label of the actor ("alice@acme.com", "sa:acme/ci", a key
  // fingerprint, or "system").
  string actor_label = 2;
  // The action verb (e.g. "registry.visibility", "membership.grant").
  string action = 3;
  // Scope path the action targeted.
  string scope = 4;
  // Resulting git commit hash for surface-touching ops ("" otherwise).
  string result_commit = 5;
  // Resulting git tag hash for surface-touching ops ("" otherwise).
  string result_tag = 6;
  // Free-form detail (often a compact JSON object).
  string detail = 7;
  // Unix seconds the entry was recorded.
  int64 created_at = 8;
}

message ListAuditRequest {
  // Scope path to filter on; the root scope ("") lists instance-wide.
  string scope = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

// -- Configuration change-sets (phase 3a) ----------------------------------

// One configuration change-set summary.
message Changeset {
  string change_id = 1;
  // Human label of the actor that opened the change-set.
  string actor_label = 2;
  // Scope path the change-set targets.
  string scope = 3;
  // Lifecycle status: draft | applied | reverted.
  string status = 4;
  // One-line human summary.
  string summary = 5;
  // Unix seconds the change-set was created.
  int64 created_at = 6;
  // Unix seconds the change-set was applied (0 when never applied).
  int64 applied_at = 7;
  // The change-set that reverted this one ("" when not reverted).
  string reverted_by_change_id = 8;
}

// One revision within a change-set: a staged operation on one object.
message Revision {
  // The object's type (e.g. "registry", "membership", "token").
  string object_type = 1;
  // The object's stable id within its type.
  string object_id = 2;
  // The operation: create | update | delete.
  string op = 3;
  // Semantic field-level diffs of this revision.
  repeated FieldDiff diffs = 4;
}

// One field-level diff between a revision's old and new object snapshots.
message FieldDiff {
  // The field name (a JSON object key).
  string field = 1;
  // The old scalar value ("" when the field was added).
  string old = 2;
  // The new scalar value ("" when the field was removed).
  string new = 3;
}

message ListChangesetsRequest {
  // Scope path to filter on; the root scope ("") lists instance-wide.
  string scope = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListChangesetsResponse {
  repeated Changeset changesets = 1;
  string next_page_token = 2;
}

message GetChangesetRequest {
  string change_id = 1;
}

message GetChangesetResponse {
  Changeset changeset = 1;
  repeated Revision revisions = 2;
}

// -- Publish: placement-aware registry publications -----------------------

message RegistryPublicationObjectInput {
  string path = 1;
  string sha256 = 2;
  int64 byte_size = 3;
  // immutable | mutable_pointer
  string kind = 4;
  string media_type = 5;
}

message BeginRegistryPublicationRequest {
  string registry = 1;
  string generation = 2;
  string refs_digest = 3;
  string default_commit = 4;
  string parent_publication_id = 5;
  repeated RegistryPublicationObjectInput objects = 6;
}

// Starts or resumes bounded admission of one exact publication manifest.
// `manifest_digest` is the SHA-256 of the canonical sorted object tuples used
// by BeginRegistryPublication, and `object_count` is fixed for the session.
message BeginRegistryPublicationManifestRequest {
  string registry = 1;
  string generation = 2;
  string refs_digest = 3;
  string default_commit = 4;
  string parent_publication_id = 5;
  string manifest_digest = 6;
  uint32 object_count = 7;
}

// Durable progress returned after begin and every exact append retry.
message RegistryPublicationManifestSession {
  string publication_id = 1;
  string lease_token = 2;
  string manifest_digest = 3;
  uint32 object_count = 4;
  uint32 admitted_object_count = 5;
  uint32 next_chunk_index = 6;
  string state = 7;
  int64 lease_expires_at = 8;
}

// Appends one page of at most 256 objects. Pages are zero-based and strictly
// ordered. `chunk_digest` makes retry after a lost response content-exact.
message AppendRegistryPublicationManifestRequest {
  string publication_id = 1;
  string lease_token = 2;
  uint32 chunk_index = 3;
  string chunk_digest = 4;
  repeated RegistryPublicationObjectInput objects = 5;
}

// Seals a complete admitted manifest and returns its upload inventory.
message SealRegistryPublicationManifestRequest {
  string publication_id = 1;
  string lease_token = 2;
}

message ListRegistryPublicationsRequest {
  string registry = 1;
  // Optional exact lifecycle state.
  string state = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListRegistryPublicationsResponse {
  repeated RegistryPublication publications = 1;
  string next_page_token = 2;
}

message GetRegistryPublicationRequest {
  string publication_id = 1;
}

message CommitRegistryPublicationRequest {
  string publication_id = 1;
}

message AbortRegistryPublicationRequest {
  string publication_id = 1;
}

message BeginRegistryPublicationMultipartUploadRequest {
  string publication_id = 1;
  int64 object_id = 2;
}

message BeginRegistryPublicationMultipartUploadResponse {
  string upload_id = 1;
  uint64 part_size = 2;
  string part_upload_url = 3;
  string state = 4;
  // First part not yet durably accepted, or zero while completing.
  uint32 next_part_number = 5;
}

message RegistryPublicationPlacementPart {
  int64 placement_id = 1;
  string etag = 2;
}

message RegistryPublicationMultipartPart {
  uint32 part_number = 1;
  repeated RegistryPublicationPlacementPart placements = 2;
}

message CompleteRegistryPublicationMultipartUploadRequest {
  string upload_id = 1;
  repeated RegistryPublicationMultipartPart parts = 2;
}

message AbortRegistryPublicationMultipartUploadRequest {
  string upload_id = 1;
}

message RegistryPublicationMultipartUploadResponse {
  string upload_id = 1;
  string state = 2;
}

message RegistryPublicationObject {
  int64 object_id = 1;
  string path = 2;
  string sha256 = 3;
  int64 byte_size = 4;
  string kind = 5;
  string media_type = 6;
  // Exact Hub proxy URL accepting the complete object. Empty when the object
  // requires bounded multipart admission.
  string upload_url = 7;
  // True when every required placement already has exact verified bytes.
  bool verified = 8;
}

message RegistryPublicationPlacement {
  int64 placement_id = 1;
  string name = 2;
  bool required = 3;
  string state = 4;
}

message RegistryPublication {
  string publication_id = 1;
  string registry = 2;
  int64 ordinal = 3;
  string generation = 4;
  string manifest_digest = 5;
  string refs_digest = 6;
  string default_commit = 7;
  string parent_publication_id = 8;
  string state = 9;
  repeated RegistryPublicationObject objects = 10;
  repeated RegistryPublicationPlacement placements = 11;
  int64 created_at = 12;
  int64 completed_at = 13;
}

// -- Release-scoped publication continuity -------------------------------

message BeginReleasePublicationRequest {
  string registry = 1;
  string bundle_digest = 2;
  string release_id = 3;
  string manifest_digest = 4;
  string registry_base_commit = 5;
  string staging_deployment_id = 6;
  string production_deployment_id = 7;
  string backing_publication_id = 8;
}

message ReleasePublicationState {
  string registry = 1;
  string bundle_digest = 2;
  string release_id = 3;
  string manifest_digest = 4;
}

message CommitReleasePublicationRequest {
  string registry = 1;
  string bundle_digest = 2;
  // staging | production
  string environment = 3;
  string publication_id = 4;
  string expected_deployment_id = 5;
  string staging_receipt_digest = 6;
}

// Canonical signed receipt envelope produced by the deployment authority.
message ReleaseReceipt {
  string receipt_digest = 1;
  string signed_receipt_json = 2;
}

message RecordReleaseQualificationRequest {
  string registry = 1;
  string bundle_digest = 2;
  string staging_receipt_digest = 3;
  string qualification_digest = 4;
  string signed_qualification_json = 5;
  string qualification_receipt_json = 6;
}

message ReleaseQualificationState {
  string bundle_digest = 1;
  string staging_receipt_digest = 2;
  string qualification_digest = 3;
}

message PromoteReleasePublicationRequest {
  string registry = 1;
  string bundle_digest = 2;
  string publication_id = 3;
  string expected_deployment_id = 4;
  string staging_receipt_digest = 5;
  string qualification_digest = 6;
  // Exact staging envelope verified against the pinned staging deployment key.
  string signed_staging_receipt_json = 7;
  // Canonical qualification payload carried by signed_qualification_json.
  string qualification_receipt_json = 8;
  // Exact qualification envelope verified against a pinned authority key.
  string signed_qualification_json = 9;
}

message GetReleaseReceiptRequest {
  string bundle_digest = 1;
  // Public callers may read only production receipts.
  string environment = 2;
}

message PublishReleaseTimestampRequest {
  string registry = 1;
  string snapshot_digest = 2;
  int64 snapshot_version = 3;
  int64 timestamp_version = 4;
  string timestamp_digest = 5;
  string publication_id = 6;
}

message ReleaseTimestampState {
  string snapshot_digest = 1;
  int64 snapshot_version = 2;
  int64 timestamp_version = 3;
  string timestamp_digest = 4;
}

message AdvanceReleaseChannelRequest {
  string registry = 1;
  string channel = 2;
  int64 prior_generation = 3;
  int64 first_partition = 4;
  int64 last_partition = 5;
  string manifest_digest = 6;
  string production_receipt_digest = 7;
}

// -- Webhooks (phase 4) ----------------------------------------------------

// One webhook subscription. Signing material is never accepted or returned by
// this API; secret_version_ref identifies an immutable operator-managed secret
// that the delivery runtime resolves only while signing a request.
message Webhook {
  int64 id = 1;
  string org_slug = 2;
  // Destination URL each subscribed event is POSTed to.
  string url = 3;
  // Subscribed event-type strings; empty means all events.
  repeated string events = 4;
  // Whether the subscription currently receives deliveries.
  bool active = 5;
  // Unix seconds the subscription was created.
  int64 created_at = 6;
  string resource_version = 7;
  int64 updated_at = 8;
  // Immutable secret-provider reference used for delivery signing.
  string secret_version_ref = 9;
  // Required SHA-256 hex digest of the resolved secret, used to reject a
  // provider value that does not match the planned credential version.
  string credential_fingerprint = 10;
}

message PlanCreateWebhookRequest {
  string org_slug = 1;
  // Destination URL.
  string url = 2;
  // Event-type strings to subscribe to; empty subscribes to all events.
  repeated string events = 3;
  string idempotency_key = 4;
  // Immutable operator-managed secret-provider reference. Plaintext signing
  // secrets are not accepted by the Hub API and must never be placed here.
  string secret_version_ref = 5;
  // Required SHA-256 hex digest of the resolved signing secret.
  string credential_fingerprint = 6;
  string expected_resource_version = 7;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
  reserved 2;
  reserved "secret";
}

message ListWebhooksRequest {
  string org_slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  string next_page_token = 2;
  // Closed event taxonomy accepted by PlanCreateWebhook.
  repeated string supported_event_types = 3;
}

message PlanDeleteWebhookRequest {
  int64 id = 1;
  string expected_resource_version = 2;
  string idempotency_key = 3;
}

message ApplyWebhookMutationRequest {
  string plan_id = 1;
  string idempotency_key = 2;
  string confirmation_hash = 3;
}

// -- Git read API + change requests ----------------------------------------

// One commit in a registry's committed history.
message GitCommit {
  // Commit object id (64-hex sha256).
  string oid = 1;
  // Parent commit oids, in header order.
  repeated string parents = 2;
  // Commit message (full body).
  string message = 3;
  // Committer identity line ("Name <email>").
  string author = 4;
  // Committer timestamp, Unix seconds.
  int64 when = 5;
  // The AOS-Change-Id trailer when the commit carries one ("" otherwise).
  string change_id = 6;
}

message GitLogRequest {
  string slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message GitLogResponse {
  repeated GitCommit commits = 1;
  string next_page_token = 2;
}

message GitDiffRequest {
  string slug = 1;
  // Base commit oid (64-hex). Empty diffs the whole tree as additions.
  string from_oid = 2;
  // Target commit oid (64-hex). Empty defaults to the current HEAD.
  string to_oid = 3;
}

message GitDiffResponse {
  // A textual unified-ish diff of the committed config files between the two
  // commits.
  string diff = 1;
}

// One git-backed change request: a draft change-set with the hub's signed
// draft commit and ref, its file diff, and the promotion command.
message ChangeRequest {
  // The change-set id (also the AOS-Change-Id trailer and ref suffix).
  string change_id = 1;
  // The draft ref the hub wrote (refs/hub/changes/<change_id>).
  string git_ref = 2;
  // The signed draft-commit oid the ref points at.
  string git_commit = 3;
  // Lifecycle status: draft | applied | reverted.
  string status = 4;
  // One-line human summary.
  string summary = 5;
  // Human label of the actor that opened the change request.
  string actor_label = 6;
  // Unix seconds the change request was created.
  int64 created_at = 7;
  // The committed file each revision edits, with its semantic diff.
  repeated FileDiff file_diffs = 8;
  // The `apr change merge <change_id>` command a maintainer runs to promote it.
  string merge_command = 9;
}

// One edited committed file within a change request, with a unified diff.
message FileDiff {
  // The committed file path (e.g. "registry.toml").
  string path = 1;
  // A textual unified-ish diff of the file's old vs new contents.
  string diff = 2;
}

message ListChangeRequestsRequest {
  string slug = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListChangeRequestsResponse {
  repeated ChangeRequest change_requests = 1;
  string next_page_token = 2;
}

