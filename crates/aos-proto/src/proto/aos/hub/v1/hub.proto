// A typed half-open hash range in the fixed 16-bit shard space.
message HashRangeV1 {
  // Inclusive first bucket, in 0..65535.
  uint32 start = 1;
  // Exclusive last bucket, in 1..65536 and greater than start.
  uint32 end = 2;
}

// Operator-owned desired placement configuration.
message PlacementSpec {
  // complete | shard | archive.
  string kind = 1;
  // active | draining | offline.
  string desired_state = 2;
  // Whether policy selection may consider the placement for reads.
  bool desired_read_enabled = 3;
  // Lower values are preferred for ordered reads.
  int64 read_order = 4;
  // Monotonic writer-critical specification version.
  int64 write_spec_version = 5;
  // Whether this placement's writer contract needs conditional object writes.
  bool requires_conditional_writes = 6;
  // Required exactly for shard placements.
  HashRangeV1 hash_range = 7;
}

// Controller-owned placement health and inventory evidence.
message PlacementObservation {
  // provisioning | syncing | ready | degraded | offline.
  string state = 1;
  // complete | partial | unknown.
  string completeness = 2;
  int64 observed_at = 3;
  string observation_version = 4;
  // Registry-only publication fully materialized at this placement.
  string mutable_publication_id = 5;
  // Registry-only publication whose pointer update owns the watermark CAS.
  string pending_publication_id = 6;
  string watermark_resource_version = 7;
}

// Derived selection and authority facts; no field is directly mutable.
message PlacementStatus {
  // primary for the observed writer, otherwise replica, shard, or archive.
  string derived_role = 1;
  bool desired_writer = 2;
  bool observed_writer = 3;
  bool promotion_pending = 4;
  // Coarse health/topology predicate before request-specific object evidence.
  bool effective_read_enabled = 5;
  // Complete authority/capability/health predicate for writes.
  bool effective_write_enabled = 6;
}

