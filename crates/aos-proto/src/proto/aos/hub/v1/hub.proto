message CreateCacheObjectUploadsRequest {
  string cache_id = 1;
  // Single object path under the cache (e.g. `<hash>.narinfo` or `nar/<file>`).
  // Used for one upload; for bulk admission use `paths` instead.
  string path = 2;
  // Batch of at most 256 unique object paths to admit in one round-trip. When
  // non-empty, the response's `uploads` is populated (parallel to this list)
  // and the single-path `upload_url` is unused.
  repeated string paths = 3;
  // Declared byte size for `path`.
  uint64 size = 4;
  // Declared sizes parallel to `paths` for batch minting.
  repeated uint64 sizes = 5;
  // Exact configured delivery URL when the caller does not already know the
  // cache's immutable stable id. Every simultaneously active route resolves
  // to the same logical cache.
  string delivery_url = 6;
}

message CreateCacheObjectUploadsResponse {
  // Exact PUT URL. This is either a short-lived direct-origin capability or an
  // authenticated typed Hub-proxy URL. Empty only when multipart is required.
  string upload_url = 1;
  // Unix seconds the direct-origin URL expires. Zero for an authenticated Hub
  // proxy URL or when multipart is required.
  int64 expires_at = 2;
  // Batch results, one per requested `paths` entry in the same order.
  repeated CacheObjectUpload uploads = 3;
  // Durable write ticket for a direct-origin or Hub-proxy upload. Empty only
  // when multipart admission is required.
  string upload_ticket_id = 4;
}

// One exact cache-object upload admission.
message CacheObjectUpload {
  // The cache-relative object path this URL uploads to.
  string path = 1;
  // Direct-origin or typed Hub-proxy PUT URL; empty when multipart is required.
  string upload_url = 2;
  // Unix seconds the direct-origin URL expires. Zero for an authenticated Hub
  // proxy URL or when multipart is required.
  int64 expires_at = 3;
  // Durable write ticket for a direct-origin or Hub-proxy upload. Empty only
  // when multipart admission is required.
  string upload_ticket_id = 4;
}

