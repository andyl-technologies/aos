// One exact replacement target sealed into a pin-resolution plan.
message PinResolutionTarget {
  string resource_kind = 1;
  string resource_stable_id = 2;
  int64 resource_generation = 3;
  string configuration_digest = 4;
  string expected_resource_version = 5;
}
// Moves an endpoint listener pin to an already-declared endpoint generation.
message MoveEndpointPinResolution {
  PinResolutionTarget replacement_endpoint = 1;
  string expected_source_resource_version = 2;
}
// Replaces every use represented by one route pin with an exact live route.
message ReplaceRoutePinResolution {
  PinResolutionTarget replacement_route = 1;
  string expected_source_resource_version = 2;
}
// Releases the exact source target. Routes are disabled before their pins are
// released; other target kinds must be deleted under their sealed CAS.
message ReleasePinResolution {
  string expected_source_resource_version = 1;
}
// Resolves exactly one live grant or boundary pin. Plans reject missing,
// duplicate, and extra pin ids rather than accepting a partial impact set.
message PinResolution {
  string pin_id = 1;
  oneof resolution {
    MoveEndpointPinResolution move_endpoint = 2;
    ReplaceRoutePinResolution replace_route = 3;
    ReleasePinResolution release = 4;
  }
}
