syntax = "proto3";
package aos.sandbox.v1;

// A portable content-addressed object reference.
message ObjectDescriptor {
  string media_type = 1;
  bytes sha256 = 2; // Exactly 32 bytes.
  uint64 encoded_size = 3;
}

// A checked-in ownership-namespaced semantic feature.
message Feature {
  string namespace = 1;
  uint32 major = 2;
  uint32 minor = 3;
}

// A normalized wall-clock timestamp used only for audit and presentation.
message Timestamp {
  int64 seconds = 1;
  uint32 nanoseconds = 2; // Less than one billion.
}

// A bounded monotonic duration interpreted relative to receipt.
message Duration {
  uint64 nanoseconds = 1;
}

// A typed machine-readable condition with safe public detail.
message Condition {
  string code = 1;
  ConditionState state = 2;
  string safe_message = 3;
  Timestamp transition_time = 4; // The last condition-state transition time.
  repeated Feature unsatisfied_features = 5;
  uint64 desired_generation = 6;
  ConditionReason reason = 7;
  ConditionFreshness freshness = 8;
  uint64 observation_sequence = 9;
}

enum ConditionState {
  CONDITION_STATE_UNSPECIFIED = 0;
  CONDITION_STATE_TRUE = 1;
  CONDITION_STATE_FALSE = 2;
  CONDITION_STATE_UNKNOWN = 3;
}

enum ConditionReason {
  CONDITION_REASON_UNSPECIFIED = 0;
  CONDITION_REASON_VERIFIED = 1;
  CONDITION_REASON_PENDING = 2;
  CONDITION_REASON_DEPENDENCY_UNAVAILABLE = 3;
  CONDITION_REASON_CAPACITY_UNAVAILABLE = 4;
  CONDITION_REASON_POLICY_REJECTED = 5;
  CONDITION_REASON_AUTHORITY_PENDING = 6;
  CONDITION_REASON_AUTHORITY_FENCED = 7;
  CONDITION_REASON_RESIDUAL_CLEANUP = 8;
}

enum ConditionFreshness {
  CONDITION_FRESHNESS_UNSPECIFIED = 0;
  CONDITION_FRESHNESS_CURRENT = 1;
  CONDITION_FRESHNESS_STALE = 2;
}

enum DesiredLifecycle {
  DESIRED_LIFECYCLE_UNSPECIFIED = 0;
  DESIRED_LIFECYCLE_STOPPED = 1;
  DESIRED_LIFECYCLE_RUNNING = 2;
  DESIRED_LIFECYCLE_SUSPENDED_MEMORY = 3;
  DESIRED_LIFECYCLE_HIBERNATED = 4;
  DESIRED_LIFECYCLE_DELETED = 5;
}

enum SandboxPhase {
  SANDBOX_PHASE_UNSPECIFIED = 0;
  SANDBOX_PHASE_REQUESTED = 1;
  SANDBOX_PHASE_PREPARING = 2;
  SANDBOX_PHASE_STARTING = 3;
  SANDBOX_PHASE_READY = 4;
  SANDBOX_PHASE_FREEZING = 5;
  SANDBOX_PHASE_FROZEN = 6;
  SANDBOX_PHASE_STOPPING = 7;
  SANDBOX_PHASE_STOPPED = 8;
  SANDBOX_PHASE_HIBERNATED = 9;
  SANDBOX_PHASE_DELETING = 10;
  SANDBOX_PHASE_DELETED = 11;
  SANDBOX_PHASE_ERROR = 12;
  SANDBOX_PHASE_LOST = 13;
}

// Durable desired sandbox semantics.
message SandboxDesiredState {
  ObjectDescriptor specification = 1;
  ObjectDescriptor requested_policy = 2;
  DesiredLifecycle lifecycle = 3;
  uint64 generation = 4;
}

// Reconstructible sandbox realization status.
message SandboxObservedState {
  SandboxPhase phase = 1;
  bytes incarnation_id = 2; // Empty only when no active incarnation exists.
  bytes node_id = 3; // Opaque logical node ID, never an address or host path.
  uint64 assignment_epoch = 4;
  uint64 desired_generation = 5;
  uint64 observation_sequence = 6;
  repeated Condition conditions = 7;
  OwnershipStatus ownership = 8;
  GuardianStatus guardian = 9;
  uint64 capability_generation = 10;
  RealizedRootStatus realized_root = 11;
  OwnershipTransactionStatus root_transaction = 12;
  uint64 environment_generation = 13;
  AttachmentStatusSet attachments = 14;
  repeated ResourceReference active_executions = 15;
  repeated ResourceReference pinned_references = 16;
  CacheStatus cache = 17;
  DisclosureStatus disclosure = 18;
  LogicalUsageStatus logical_usage = 19;
  bytes audit_event_cursor = 20;
  Timestamp last_successful_reconciliation_time = 21;
}

enum OwnershipState {
  OWNERSHIP_STATE_UNSPECIFIED = 0;
  OWNERSHIP_STATE_UNASSIGNED = 1;
  OWNERSHIP_STATE_AWAITING = 2;
  OWNERSHIP_STATE_OWNED = 3;
  OWNERSHIP_STATE_EXPIRED = 4;
}

message OwnershipStatus {
  OwnershipState state = 1;
  bytes node_id = 2;
  uint64 assignment_epoch = 3;
  uint64 lease_generation = 4;
  Timestamp expires_at = 5;
  bytes incarnation_id = 6;
}

enum GuardianState {
  GUARDIAN_STATE_UNSPECIFIED = 0;
  GUARDIAN_STATE_DISARMED = 1;
  GUARDIAN_STATE_ARMING = 2;
  GUARDIAN_STATE_ARMED = 3;
  GUARDIAN_STATE_CONTAINED = 4;
}

message GuardianStatus {
  GuardianState state = 1;
  bytes node_id = 2;
  uint64 assignment_epoch = 3;
  uint64 guardian_generation = 4;
  uint64 lease_generation = 5;
  bytes incarnation_id = 6;
}

message RealizedRootStatus {
  uint64 generation = 1;
  ObjectDescriptor descriptor = 2;
}

enum OwnershipTransactionState {
  OWNERSHIP_TRANSACTION_STATE_UNSPECIFIED = 0;
  OWNERSHIP_TRANSACTION_STATE_ABSENT = 1;
  OWNERSHIP_TRANSACTION_STATE_PREPARED = 2;
  OWNERSHIP_TRANSACTION_STATE_COMMITTED = 3;
  OWNERSHIP_TRANSACTION_STATE_ROLLED_BACK = 4;
}

message OwnershipTransactionStatus {
  OwnershipTransactionState state = 1;
  uint64 generation = 2;
  bytes transaction_id = 3;
}

enum AttachmentHealth {
  ATTACHMENT_HEALTH_UNSPECIFIED = 0;
  ATTACHMENT_HEALTH_READY = 1;
  ATTACHMENT_HEALTH_DEGRADED = 2;
  ATTACHMENT_HEALTH_BLOCKED = 3;
}

message AttachmentStatus {
  ResourceReference attachment = 1;
  uint64 generation = 2;
  AttachmentHealth health = 3;
}

message AttachmentStatusSet {
  repeated AttachmentStatus attachments = 1;
}

message CacheStatus {
  bytes domain_id = 1;
  uint64 admitted_bytes = 2;
  uint64 pinned_bytes = 3;
  uint32 pinned_objects = 4;
}

message DisclosureStatus {
  bytes domain_id = 1;
  uint32 visible_resources = 2;
  uint32 redacted_resources = 3;
}

message LogicalUsageStatus {
  uint64 cpu_nanoseconds = 1;
  uint64 memory_bytes = 2;
  uint64 storage_bytes = 3;
  uint32 process_count = 4;
}

// A durable generic sandbox resource.
message Sandbox {
  bytes sandbox_id = 1; // Exactly 16 bytes.
  bytes project_id = 2; // Exactly 16 bytes.
  bytes parent_sandbox_id = 3; // Empty for a root sandbox.
  bytes resource_version = 4;
  SandboxDesiredState desired = 5;
  SandboxObservedState observed = 6;
  ObjectDescriptor effective_policy = 7;
  Timestamp created_at = 8;
  Timestamp updated_at = 9;
}

enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_PHASE_REQUESTED = 1;
  EXECUTION_PHASE_ADMITTED = 2;
  EXECUTION_PHASE_STARTING = 3;
  EXECUTION_PHASE_RUNNING = 4;
  EXECUTION_PHASE_EXITED = 5;
  EXECUTION_PHASE_CANCELED = 6;
  EXECUTION_PHASE_FAILED = 7;
  EXECUTION_PHASE_LOST = 8;
}

// Portable command semantics. Values are data, not shell source.
message Command {
  repeated bytes arguments = 1;
  repeated EnvironmentVariable environment = 2;
  bytes working_directory = 3; // Slash-separated relative path bytes.
  bool allocate_terminal = 4;
  bytes sandbox_shell = 5; // Mutually exclusive with arguments.
  Duration execution_timeout = 6;
  ExecutionIoMode io_mode = 7;
  uint32 terminal_rows = 8;
  uint32 terminal_columns = 9;
  uint64 detached_capture_bytes = 10;
  repeated Feature stream_features = 11;
}

enum ExecutionIoMode {
  EXECUTION_IO_MODE_UNSPECIFIED = 0;
  EXECUTION_IO_MODE_STREAM = 1;
  EXECUTION_IO_MODE_PTY = 2;
  EXECUTION_IO_MODE_DETACHED_CAPTURE = 3;
}

message EnvironmentVariable {
  string name = 1;
  bytes value = 2;
}

// Holder-bound short-lived OpenSSH execution access.
message OpenSshAccessEndpoint {
  string host = 1;
  uint32 port = 2;
  string user = 3;
  bytes host_public_key = 4;
  bytes client_certificate = 5;
  Timestamp expires_at = 6;
  bytes execution_id = 7;
  bytes sandbox_incarnation_id = 8;
  bytes principal_id = 9;
  bytes audit_id = 10;
  repeated Feature stream_features = 11;
}

message ExecutionResult {
  int32 exit_code = 1;
  string termination_reason = 2;
  Timestamp exited_at = 3;
  ExecutionTerminationKind termination_kind = 4;
  ExecutionSignal signal = 5;
}

enum ExecutionTerminationKind {
  EXECUTION_TERMINATION_KIND_UNSPECIFIED = 0;
  EXECUTION_TERMINATION_KIND_EXIT_CODE = 1;
  EXECUTION_TERMINATION_KIND_SIGNAL = 2;
  EXECUTION_TERMINATION_KIND_LOST = 3;
}

message Execution {
  bytes execution_id = 1;
  bytes sandbox_id = 2;
  bytes sandbox_incarnation_id = 3;
  bytes resource_version = 4;
  Command command = 5;
  ExecutionPhase phase = 6;
  OpenSshAccessEndpoint access = 7;
  ExecutionResult result = 8;
  repeated Condition conditions = 9;
  bytes audit_id = 10;
  uint64 desired_generation = 11;
  uint64 observation_sequence = 12;
  uint64 assignment_epoch = 13;
  Timestamp last_successful_reconciliation_time = 14;
}

enum ViewPhase {
  VIEW_PHASE_UNSPECIFIED = 0;
  VIEW_PHASE_REQUESTED = 1;
  VIEW_PHASE_VALIDATING = 2;
  VIEW_PHASE_INDEXING = 3;
  VIEW_PHASE_READY = 4;
  VIEW_PHASE_DEGRADED = 5;
  VIEW_PHASE_RELEASING = 6;
  VIEW_PHASE_RELEASED = 7;
  VIEW_PHASE_ERROR = 8;
}

message FilesystemView {
  bytes view_id = 1;
  bytes project_id = 2;
  bytes resource_version = 3;
  ObjectDescriptor revision = 4;
  ViewPhase phase = 5;
  repeated Condition conditions = 6;
  uint64 active_attachment_count = 7;
  uint64 desired_generation = 8;
  uint64 observation_sequence = 9;
  Timestamp last_successful_reconciliation_time = 10;
}

enum ViewMutation {
  VIEW_MUTATION_UNSPECIFIED = 0;
  VIEW_MUTATION_READ_ONLY = 1;
  VIEW_MUTATION_READ_WRITE = 2;
  VIEW_MUTATION_PRIVATE_COW = 3;
  VIEW_MUTATION_APPEND_ONLY = 4;
  VIEW_MUTATION_SERVICE = 5;
}

enum AttachmentPhase {
  ATTACHMENT_PHASE_UNSPECIFIED = 0;
  ATTACHMENT_PHASE_REQUESTED = 1;
  ATTACHMENT_PHASE_PREPARING = 2;
  ATTACHMENT_PHASE_READY = 3;
  ATTACHMENT_PHASE_REPLACING = 4;
  ATTACHMENT_PHASE_DETACHING = 5;
  ATTACHMENT_PHASE_RELEASED = 6;
  ATTACHMENT_PHASE_ERROR = 7;
  ATTACHMENT_PHASE_REVOKED = 8;
}

message Attachment {
  bytes attachment_id = 1;
  bytes sandbox_id = 2;
  bytes destination_slot_id = 3;
  bytes resource_version = 4;
  ObjectDescriptor view_revision = 5;
  ViewMutation mutation = 6;
  AttachmentPhase phase = 7;
  uint64 desired_generation = 8;
  uint64 source_generation = 9;
  repeated Condition conditions = 10;
  uint64 observation_sequence = 11;
  uint64 assignment_epoch = 12;
  Timestamp last_successful_reconciliation_time = 13;
}

enum SnapshotPhase {
  SNAPSHOT_PHASE_UNSPECIFIED = 0;
  SNAPSHOT_PHASE_REQUESTED = 1;
  SNAPSHOT_PHASE_PREPARING = 2;
  SNAPSHOT_PHASE_QUIESCING = 3;
  SNAPSHOT_PHASE_CAPTURING = 4;
  SNAPSHOT_PHASE_COMMITTING = 5;
  SNAPSHOT_PHASE_READY = 6;
  SNAPSHOT_PHASE_DELETING = 7;
  SNAPSHOT_PHASE_DELETED = 8;
  SNAPSHOT_PHASE_ERROR = 9;
}

enum SnapshotAvailability {
  SNAPSHOT_AVAILABILITY_UNSPECIFIED = 0;
  SNAPSHOT_AVAILABILITY_SELF_CONTAINED = 1;
  SNAPSHOT_AVAILABILITY_EXTERNAL_DEPENDENCIES = 2;
  SNAPSHOT_AVAILABILITY_DEGRADED = 3;
}

message Snapshot {
  bytes snapshot_id = 1;
  bytes source_sandbox_id = 2;
  bytes project_id = 3;
  bytes resource_version = 4;
  ObjectDescriptor manifest = 5;
  SnapshotPhase phase = 6;
  SnapshotAvailability availability = 7;
  repeated Condition conditions = 8;
  Timestamp created_at = 9;
  uint64 desired_generation = 10;
  uint64 observation_sequence = 11;
  Timestamp last_successful_reconciliation_time = 12;
}

// A non-secret online capability summary. This is a lifetime record, not a
// placed reconciled resource: validity is expressed by not_before/expires_at
// and revocation rather than assignment epoch or reconciliation time. The
// bearer handle is returned only by issuance operations and is never included
// in list or event resources.
message Capability {
  bytes capability_id = 1;
  bytes project_id = 2;
  bytes sandbox_id = 3;
  bytes holder_principal_id = 4;
  bytes resource_version = 5;
  Timestamp not_before = 6;
  Timestamp expires_at = 7;
  uint32 remaining_delegation_depth = 8;
  uint32 maximum_fanout = 9;
  bool revoked = 10;
  ObjectDescriptor effective_policy = 11;
}

enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_ACCEPTED = 1;
  OPERATION_PHASE_PREPARING = 2;
  OPERATION_PHASE_COMMITTING = 3;
  OPERATION_PHASE_COMMITTED = 4;
  OPERATION_PHASE_SUCCEEDED = 5;
  OPERATION_PHASE_FAILED_BEFORE_COMMIT = 6;
  OPERATION_PHASE_CANCELED_BEFORE_COMMIT = 7;
  OPERATION_PHASE_COMMITTED_WITH_RESIDUAL_CLEANUP = 8;
  OPERATION_PHASE_PERMANENTLY_BLOCKED = 9;
}

enum RetryClass {
  RETRY_CLASS_UNSPECIFIED = 0;
  RETRY_CLASS_NEVER = 1;
  RETRY_CLASS_SAME_REQUEST = 2;
  RETRY_CLASS_AFTER_STATE_CHANGE = 3;
  RETRY_CLASS_RESYNC_REQUIRED = 4;
}

message OperationProgress {
  string milestone = 1;
  uint32 completed_units = 2;
  uint32 total_units = 3;
}

message ResourceReference {
  string resource_type = 1;
  bytes resource_id = 2;
  bytes resource_version = 3;
}

message Operation {
  bytes operation_id = 1;
  bytes resource_version = 2;
  string method = 3;
  OperationPhase phase = 4;
  uint64 accepted_generation = 5;
  OperationProgress progress = 6;
  RetryClass retry_class = 7;
  repeated Condition conditions = 8;
  repeated ResourceReference results = 9;
  bytes audit_id = 10;
  Timestamp accepted_at = 11;
  Timestamp completed_at = 12;
  bool cancelable = 13;
  uint64 observation_sequence = 14;
  Timestamp last_successful_reconciliation_time = 15;
}

// A pure policy-plan result; applying it still requires current authority and
// every named resource version.
message PolicyPlan {
  ObjectDescriptor requested_policy = 1;
  ObjectDescriptor effective_policy = 2;
  repeated ObjectDescriptor input_commitments = 3;
  repeated Feature required_features = 4;
  repeated PolicyReason reasons = 5;
  bytes plan_digest = 6;
}

message PolicyReason {
  string code = 1;
  ObjectDescriptor source = 2;
  string safe_message = 3;
  PolicyReasonCode reason_code = 4;
}

enum PolicyReasonCode {
  POLICY_REASON_CODE_UNSPECIFIED = 0;
  POLICY_REASON_CODE_REQUEST_ACCEPTED = 1;
  POLICY_REASON_CODE_REQUEST_ATTENUATED = 2;
  POLICY_REASON_CODE_REQUIRED_FEATURE = 3;
  POLICY_REASON_CODE_RESOURCE_CONFLICT = 4;
  POLICY_REASON_CODE_POLICY_CONFLICT = 5;
  POLICY_REASON_CODE_PARENT_CONSTRAINT = 6;
  POLICY_REASON_CODE_BACKEND_UNAVAILABLE = 7;
}

message PublicFeatureDefinition {
  Feature feature = 1;
  string safe_description = 2;
  bytes conformance_fixture_digest = 3;
}

message PublicFeatureRegistry {
  uint32 schema_version = 1;
  repeated PublicFeatureDefinition features = 2;
  bytes registry_digest = 3;
}

message GetPublicFeatureRegistryRequest {}
message GetPublicFeatureRegistryResponse { PublicFeatureRegistry registry = 1; }

message GetCacheStatusRequest {
  bytes project_id = 1;
  bytes sandbox_id = 2;
}

message GetCacheStatusResponse { CacheStatus status = 1; }

message PinCacheObjectRequest {
  ObjectDescriptor object = 1;
  MutationContext mutation = 2;
}

message PinCacheObjectResponse { Operation operation = 1; }

message UnpinCacheObjectRequest {
  ObjectDescriptor object = 1;
  MutationContext mutation = 2;
}

message UnpinCacheObjectResponse { Operation operation = 1; }

message SandboxTreeNode {
  Sandbox sandbox = 1;
  uint32 depth = 2; // Relative to the requested root; descendants start at 1.
  bytes parent_sandbox_id = 3;
}

// Exact preorder continuation state before or after one descendant page.
message SandboxTreePreorderState {
  // Root at index zero followed by the still-open emitted ancestor path.
  repeated bytes open_path = 1;
  uint64 emitted_nodes = 2;
  bytes prefix_digest = 3; // SHA-256 commitment to the emitted preorder prefix.
}

message SemanticCapability {
  Feature feature = 1;
  bool available = 2;
  string unavailable_reason = 3;
  bytes conformance_fixture_digest = 4;
}

// A sampled node capability inventory. This is neither a placed resource nor
// a lifecycle reconciliation status; observed_at timestamps the exact sample.
message NodeCapabilities {
  bytes node_id = 1;
  bytes resource_version = 2;
  uint64 capability_generation = 3;
  repeated SemanticCapability capabilities = 4;
  Timestamp observed_at = 5;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_RESOURCE_CREATED = 1;
  EVENT_KIND_RESOURCE_UPDATED = 2;
  EVENT_KIND_RESOURCE_DELETED = 3;
  EVENT_KIND_OPERATION_UPDATED = 4;
  EVENT_KIND_AUDIT = 5;
  EVENT_KIND_SNAPSHOT_COMPLETE = 6;
}

enum AuditDecision {
  AUDIT_DECISION_UNSPECIFIED = 0;
  AUDIT_DECISION_ALLOWED = 1;
  AUDIT_DECISION_DENIED = 2;
  AUDIT_DECISION_COMPLETED = 3;
  AUDIT_DECISION_FAILED = 4;
  AUDIT_DECISION_EXPIRED = 5;
  AUDIT_DECISION_REVOKED = 6;
  AUDIT_DECISION_CONTAINED = 7;
}

enum AuditCategory {
  AUDIT_CATEGORY_UNSPECIFIED = 0;
  AUDIT_CATEGORY_CAPABILITY = 1;
  AUDIT_CATEGORY_OWNERSHIP = 2;
  AUDIT_CATEGORY_LIFECYCLE = 3;
  AUDIT_CATEGORY_EXECUTION = 4;
  AUDIT_CATEGORY_FILESYSTEM_VIEW = 5;
  AUDIT_CATEGORY_SNAPSHOT = 6;
  AUDIT_CATEGORY_CACHE = 7;
  AUDIT_CATEGORY_BACKEND_POLICY = 8;
  AUDIT_CATEGORY_BROKER = 9;
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_CAPABILITY_ISSUE = 1;
  AUDIT_ACTION_CAPABILITY_ATTENUATE = 2;
  AUDIT_ACTION_CAPABILITY_USE = 3;
  AUDIT_ACTION_CAPABILITY_EXPIRE = 4;
  AUDIT_ACTION_CAPABILITY_REVOKE = 5;
  AUDIT_ACTION_OWNERSHIP_LEASE_ISSUE = 6;
  AUDIT_ACTION_OWNERSHIP_LEASE_RENEW = 7;
  AUDIT_ACTION_OWNERSHIP_LEASE_EXPIRE = 8;
  AUDIT_ACTION_BROKER_PLAN_ACCEPT = 9;
  AUDIT_ACTION_GUARDIAN_CONTAIN = 10;
  AUDIT_ACTION_SANDBOX_CREATE = 11;
  AUDIT_ACTION_SANDBOX_PLACE = 12;
  AUDIT_ACTION_SANDBOX_START = 13;
  AUDIT_ACTION_SANDBOX_STOP = 14;
  AUDIT_ACTION_SANDBOX_SUSPEND = 15;
  AUDIT_ACTION_SANDBOX_RESUME = 16;
  AUDIT_ACTION_SANDBOX_FORK = 17;
  AUDIT_ACTION_SANDBOX_RESTORE = 18;
  AUDIT_ACTION_SANDBOX_DELETE = 19;
  AUDIT_ACTION_EXECUTION_ADMIT = 20;
  AUDIT_ACTION_EXECUTION_ATTACH = 21;
  AUDIT_ACTION_EXECUTION_EXIT = 22;
  AUDIT_ACTION_EXECUTION_CANCEL = 23;
  AUDIT_ACTION_VIEW_PUBLISH = 24;
  AUDIT_ACTION_VIEW_REPLACE = 25;
  AUDIT_ACTION_VIEW_DETACH = 26;
  AUDIT_ACTION_VIEW_REVOKE = 27;
  AUDIT_ACTION_SNAPSHOT_BARRIER = 28;
  AUDIT_ACTION_CACHE_ADMIT = 29;
  AUDIT_ACTION_CACHE_CROSS_DOMAIN_DENY = 30;
  AUDIT_ACTION_CACHE_PIN = 31;
  AUDIT_ACTION_CACHE_EVICT = 32;
  AUDIT_ACTION_BACKEND_CAPABILITY_DRIFT = 33;
  AUDIT_ACTION_POLICY_DRIFT = 34;
  AUDIT_ACTION_BROKER_REQUEST = 35;
  AUDIT_ACTION_EXECUTION_DATA_CHANNEL_PRINCIPAL = 36;
  AUDIT_ACTION_SNAPSHOT_EXTERNAL_DEPENDENCY = 37;
}

// One bounded observation extension. Required unknown extensions terminate the
// stream; authority-bearing requests never use this envelope.
message ObservationExtension {
  string type_url = 1;
  uint32 schema_version = 2;
  bool required = 3;
  bytes payload = 4;
  bool safe_for_opaque_display = 5;
}

message Event {
  bytes event_id = 1;
  uint64 sequence = 2;
  EventKind kind = 3;
  ResourceReference resource = 4;
  bytes operation_id = 5;
  Timestamp observed_at = 6;
  repeated Condition conditions = 7;
  repeated ObservationExtension extensions = 8;
  bytes resume_cursor = 9;
  bytes bootstrap_watermark = 10; // Present on snapshot-complete events.
  bytes resource_version = 11;
  bytes actor = 12;
  bytes authenticated_transport_identity = 13;
  AuditDecision decision = 14;
  ObjectDescriptor policy_revision = 15;
  uint64 node_epoch = 16;
  bytes causal_predecessor = 17;
  AuditCategory audit_category = 18;
  AuditAction audit_action = 19;
}

message PageInfo {
  bytes next_page_token = 1;
  bytes immutable_list_revision = 2;
}

message WatchCursor {
  bytes opaque_cursor = 1;
}

// Closed public error detail. Backend diagnostics never cross this boundary.
message ErrorDetail {
  ErrorReason reason = 1;
  repeated FieldViolation field_violations = 2;
  Conflict conflict = 3;
  ResourceExhaustion resource_exhaustion = 4;
  Feature unsatisfied_feature = 5;
  RetryAdvice retry = 6;
  PolicyReason policy_reason = 7;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_FIELD = 1;
  ERROR_REASON_RESOURCE_VERSION_CONFLICT = 2;
  ERROR_REASON_GENERATION_CONFLICT = 3;
  ERROR_REASON_ASSIGNMENT_CONFLICT = 4;
  ERROR_REASON_INVALID_LIFECYCLE_TRANSITION = 5;
  ERROR_REASON_UNMET_DEPENDENCY = 6;
  ERROR_REASON_RESOURCE_EXHAUSTED = 7;
  ERROR_REASON_REQUIRED_FEATURE_UNAVAILABLE = 8;
  ERROR_REASON_RESYNC_REQUIRED = 9;
  ERROR_REASON_OPERATION_NOT_CANCELABLE = 10;
  ERROR_REASON_POLICY_REJECTED = 11;
}

message FieldViolation {
  string field = 1;
  string description = 2;
}

message Conflict {
  bytes expected = 1;
  bytes actual = 2;
}

message ResourceExhaustion {
  string dimension = 1;
  uint64 effective_limit = 2;
  uint64 requested = 3;
}

message RetryAdvice {
  RetryClass retry_class = 1;
  Duration minimum_delay = 2;
}

// Common acceptance fields for every mutating public RPC.
message MutationContext {
  bytes idempotency_key = 1;
  bytes expected_resource_version = 2;
  bytes expected_incarnation_id = 3;
  Duration operation_timeout = 4;
  repeated Feature required_features = 5;
}

message CreateSandboxRequest {
  bytes project_id = 1;
  bytes parent_sandbox_id = 2;
  bytes expected_parent_resource_version = 3;
  bytes expected_project_resource_version = 4;
  ObjectDescriptor specification = 5;
  ObjectDescriptor requested_policy = 6;
  bytes idempotency_key = 7;
  Duration operation_timeout = 8;
  repeated Feature required_features = 9;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
  Operation operation = 2;
}

// Pure create validation and policy resolution. This request has no mutation
// context and cannot be dispatched through CreateSandbox.
message PlanCreateSandboxRequest {
  bytes project_id = 1;
  bytes parent_sandbox_id = 2;
  bytes expected_parent_resource_version = 3;
  bytes expected_project_resource_version = 4;
  ObjectDescriptor specification = 5;
  ObjectDescriptor requested_policy = 6;
  repeated Feature required_features = 7;
}

message PlanCreateSandboxResponse { PolicyPlan plan = 1; }

message GetSandboxRequest { bytes sandbox_id = 1; }
message GetSandboxResponse { Sandbox sandbox = 1; }

message ListSandboxesRequest {
  bytes project_id = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
  PageInfo page = 2;
}

message ListChildrenRequest {
  bytes parent_sandbox_id = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListChildrenResponse {
  repeated Sandbox children = 1;
  PageInfo page = 2;
}

message ListAncestorsRequest {
  bytes sandbox_id = 1;
  uint32 bounded_depth = 2;
  uint32 page_size = 3;
  bytes page_token = 4;
}

message ListAncestorsResponse {
  repeated Sandbox ancestors = 1;
  PageInfo page = 2;
}

message ListDescendantsRequest {
  bytes sandbox_id = 1;
  uint32 maximum_depth = 2;
  uint32 page_size = 3;
  // Server-authenticated and bound to field 5 plus fields 1-3.
  bytes page_token = 4;
  SandboxTreePreorderState expected_preorder_before = 5;
}

message ListDescendantsResponse {
  repeated Sandbox descendants = 1 [deprecated = true];
  PageInfo page = 2;
  repeated SandboxTreeNode nodes = 3;
  SandboxTreePreorderState preorder_before = 4;
  // The server binds this state into a nonempty next_page_token.
  SandboxTreePreorderState preorder_after = 5;
}

message PlanSandboxPolicyRequest {
  bytes sandbox_id = 1;
  bytes expected_resource_version = 2;
  ObjectDescriptor requested_policy = 3;
}

message PlanSandboxPolicyResponse { PolicyPlan plan = 1; }

message UpdateSandboxPolicyRequest {
  bytes sandbox_id = 1;
  ObjectDescriptor requested_policy = 2;
  bytes expected_plan_digest = 3;
  MutationContext mutation = 4;
}

message UpdateSandboxPolicyResponse {
  Operation operation = 1;
  Sandbox sandbox = 2; // Accepted desired-state projection for bounded-wait output.
}

message SandboxLifecycleRequest {
  bytes sandbox_id = 1;
  MutationContext mutation = 2;
}

message SandboxLifecycleResponse {
  Operation operation = 1;
  Sandbox sandbox = 2; // Accepted desired-state projection for bounded-wait output.
}

message DeleteSandboxRequest {
  bytes sandbox_id = 1;
  bool cascade = 2;
  bytes expected_plan_digest = 3;
  MutationContext mutation = 4;
  bool force = 5;
}

message DeleteSandboxResponse {
  Operation operation = 1;
  Sandbox sandbox = 2; // Authorized deletion/tombstone projection.
}

service SandboxService {
  rpc PlanCreate(PlanCreateSandboxRequest) returns (PlanCreateSandboxResponse);
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
  rpc ListAncestors(ListAncestorsRequest) returns (ListAncestorsResponse);
  rpc ListDescendants(ListDescendantsRequest) returns (ListDescendantsResponse);
  rpc PlanPolicy(PlanSandboxPolicyRequest) returns (PlanSandboxPolicyResponse);
  rpc UpdatePolicy(UpdateSandboxPolicyRequest) returns (UpdateSandboxPolicyResponse);
  rpc Start(SandboxLifecycleRequest) returns (SandboxLifecycleResponse);
  rpc Stop(SandboxLifecycleRequest) returns (SandboxLifecycleResponse);
  rpc Suspend(SandboxLifecycleRequest) returns (SandboxLifecycleResponse);
  rpc Resume(SandboxLifecycleRequest) returns (SandboxLifecycleResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
}

message CreateExecutionRequest {
  bytes sandbox_id = 1;
  Command command = 2;
  bytes client_public_key = 3;
  bytes proof_of_possession = 4;
  MutationContext mutation = 5;
}

message CreateExecutionResponse {
  Execution execution = 1;
  Operation operation = 2;
}

message GetExecutionRequest { bytes execution_id = 1; }
message GetExecutionResponse { Execution execution = 1; }

message ListExecutionsRequest {
  bytes sandbox_id = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListExecutionsResponse {
  repeated Execution executions = 1;
  PageInfo page = 2;
}

message CancelExecutionRequest {
  bytes execution_id = 1;
  MutationContext mutation = 2;
}

message CancelExecutionResponse { Operation operation = 1; }

enum ExecutionControlAction {
  EXECUTION_CONTROL_ACTION_UNSPECIFIED = 0;
  EXECUTION_CONTROL_ACTION_ATTACH = 1;
  EXECUTION_CONTROL_ACTION_RESIZE = 2;
  EXECUTION_CONTROL_ACTION_SIGNAL = 3;
}

enum ExecutionSignal {
  EXECUTION_SIGNAL_UNSPECIFIED = 0;
  EXECUTION_SIGNAL_HANGUP = 1;
  EXECUTION_SIGNAL_INTERRUPT = 2;
  EXECUTION_SIGNAL_QUIT = 3;
  EXECUTION_SIGNAL_TERMINATE = 4;
  EXECUTION_SIGNAL_KILL = 5;
  EXECUTION_SIGNAL_USER_1 = 6;
  EXECUTION_SIGNAL_USER_2 = 7;
}

message ExecutionControlRequest {
  bytes execution_id = 1;
  ExecutionControlAction action = 2;
  uint32 terminal_rows = 3;
  uint32 terminal_columns = 4;
  ExecutionSignal signal = 5;
  MutationContext mutation = 6;
}

message ExecutionControlResult {
  bytes execution_id = 1;
  ExecutionControlAction action = 2;
  bool accepted = 3;
  Operation operation = 4;
}

service ExecutionService {
  rpc CreateExecution(CreateExecutionRequest) returns (CreateExecutionResponse);
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  rpc ControlExecution(ExecutionControlRequest) returns (ExecutionControlResult);
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
}

message CreateViewRequest {
  bytes project_id = 1;
  ObjectDescriptor revision = 2;
  bytes expected_project_resource_version = 3;
  bytes idempotency_key = 4;
  repeated Feature required_features = 5;
  Duration operation_timeout = 6;
}

message CreateViewResponse {
  FilesystemView view = 1;
  Operation operation = 2;
}

message GetViewRequest { bytes view_id = 1; }
message GetViewResponse { FilesystemView view = 1; }

message GetAttachmentRequest { bytes attachment_id = 1; }
message GetAttachmentResponse { Attachment attachment = 1; }

message ListViewsRequest {
  bytes project_id = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListViewsResponse {
  repeated FilesystemView views = 1;
  PageInfo page = 2;
}

message AttachViewRequest {
  bytes sandbox_id = 1;
  bytes view_id = 2;
  ObjectDescriptor view_revision = 3;
  bytes destination_slot_id = 4;
  ViewMutation mutation_mode = 5;
  MutationContext mutation = 6;
  bool noexec = 7;
}

message AttachViewResponse {
  Attachment attachment = 1;
  Operation operation = 2;
}

message ReplaceAttachmentRequest {
  bytes attachment_id = 1;
  bytes new_view_id = 2;
  ObjectDescriptor new_view_revision = 3;
  MutationContext mutation = 4;
}

message ReplaceAttachmentResponse {
  Operation operation = 1;
  Attachment attachment = 2;
}

message DetachViewRequest {
  bytes attachment_id = 1;
  MutationContext mutation = 2;
}

message DetachViewResponse {
  Operation operation = 1;
  Attachment attachment = 2; // Authorized detachment/tombstone projection.
}

message ReleaseViewRequest {
  bytes view_id = 1;
  MutationContext mutation = 2;
}

message ReleaseViewResponse {
  Operation operation = 1;
  FilesystemView view = 2; // Authorized release/tombstone projection.
}

service FilesystemViewService {
  rpc CreateView(CreateViewRequest) returns (CreateViewResponse);
  rpc GetView(GetViewRequest) returns (GetViewResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse);
  rpc AttachView(AttachViewRequest) returns (AttachViewResponse);
  rpc ReplaceAttachment(ReplaceAttachmentRequest) returns (ReplaceAttachmentResponse);
  rpc DetachView(DetachViewRequest) returns (DetachViewResponse);
  rpc ReleaseView(ReleaseViewRequest) returns (ReleaseViewResponse);
}

message CreateSnapshotRequest {
  bytes sandbox_id = 1;
  SnapshotAvailability requested_availability = 2;
  MutationContext mutation = 3;
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
  Operation operation = 2;
}

message GetSnapshotRequest { bytes snapshot_id = 1; }
message GetSnapshotResponse { Snapshot snapshot = 1; }

message ListSnapshotsRequest {
  bytes project_id = 1;
  bytes sandbox_id = 2;
  uint32 page_size = 3;
  bytes page_token = 4;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
  PageInfo page = 2;
}

message RestoreSnapshotRequest {
  bytes snapshot_id = 1;
  bytes target_sandbox_id = 2;
  ObjectDescriptor requested_policy = 3;
  MutationContext mutation = 4;
}

message RestoreSnapshotResponse {
  Operation operation = 1;
  Sandbox sandbox = 2;
}

message ForkSnapshotRequest {
  bytes snapshot_id = 1;
  bytes target_project_id = 2;
  bytes parent_sandbox_id = 3;
  bytes expected_parent_resource_version = 4;
  ObjectDescriptor requested_policy = 5;
  bytes idempotency_key = 6;
  repeated Feature required_features = 7;
  bytes expected_project_resource_version = 8;
  Duration operation_timeout = 9;
}

message ForkSnapshotResponse {
  Sandbox sandbox = 1;
  Operation operation = 2;
}

message DeleteSnapshotRequest {
  bytes snapshot_id = 1;
  MutationContext mutation = 2;
}

message DeleteSnapshotResponse {
  Operation operation = 1;
  Snapshot snapshot = 2; // Authorized deletion/tombstone projection.
}

service SnapshotService {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
  rpc ForkSnapshot(ForkSnapshotRequest) returns (ForkSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
}

message AttenuateCapabilityRequest {
  bytes parent_capability_handle = 1;
  bytes attenuation = 2; // Canonical compact JSON PublicCapabilityAttenuationV1.
  bytes holder_channel_binding = 3;
  bytes idempotency_key = 4;
  bytes expected_parent_resource_version = 5;
}

message AttenuateCapabilityResponse {
  Capability capability = 1;
  bytes capability_handle = 2;
}

message InspectCapabilityRequest { bytes capability_handle = 1; }
message InspectCapabilityResponse { Capability capability = 1; }

message RenewCapabilityRequest {
  bytes capability_handle = 1;
  Timestamp requested_expiry = 2;
  MutationContext mutation = 3;
}

message RenewCapabilityResponse {
  Capability capability = 1;
  bytes capability_handle = 2;
  Operation operation = 3;
}

message RevokeCapabilityRequest {
  bytes capability_id = 1;
  MutationContext mutation = 2;
}

message RevokeCapabilityResponse {
  Operation operation = 1;
  Capability capability = 2; // Redacted revocation projection; never a bearer handle.
}

service CapabilityService {
  rpc Attenuate(AttenuateCapabilityRequest) returns (AttenuateCapabilityResponse);
  rpc Inspect(InspectCapabilityRequest) returns (InspectCapabilityResponse);
  rpc Renew(RenewCapabilityRequest) returns (RenewCapabilityResponse);
  rpc Revoke(RevokeCapabilityRequest) returns (RevokeCapabilityResponse);
}

message GetOperationRequest { bytes operation_id = 1; }
message GetOperationResponse { Operation operation = 1; }

message CancelOperationRequest {
  bytes operation_id = 1;
  MutationContext mutation = 2;
}

message CancelOperationResponse { Operation operation = 1; }

message WatchRequest {
  bytes project_id = 1;
  repeated string resource_types = 2;
  bytes resource_id = 3;
  WatchCursor resume_after = 4;
  repeated Feature observation_features = 5;
  bool audit_only = 6;
}

message GetNodeCapabilitiesRequest { bytes node_id = 1; }
message GetNodeCapabilitiesResponse { NodeCapabilities capabilities = 1; }

enum OperatorRecoveryAction {
  OPERATOR_RECOVERY_ACTION_UNSPECIFIED = 0;
  OPERATOR_RECOVERY_ACTION_RETRY = 1;
  OPERATOR_RECOVERY_ACTION_ABANDON = 2;
  OPERATOR_RECOVERY_ACTION_RECONCILE = 3;
  OPERATOR_RECOVERY_ACTION_REPAIR = 4;
}

message OperatorRecoveryRequest {
  bytes resource_id = 1;
  bytes expected_resource_version = 2;
  OperatorRecoveryAction action = 3;
  bytes idempotency_key = 4;
  ObjectDescriptor evidence = 5;
}

message OperatorRecoveryResult {
  bytes resource_id = 1;
  bytes resource_version = 2;
  OperatorRecoveryAction action = 3;
  repeated Condition conditions = 4;
}

message OperatorRecoveryResponse { Operation operation = 1; }

service CacheService {
  rpc GetStatus(GetCacheStatusRequest) returns (GetCacheStatusResponse);
  rpc PinObject(PinCacheObjectRequest) returns (PinCacheObjectResponse);
  rpc UnpinObject(UnpinCacheObjectRequest) returns (UnpinCacheObjectResponse);
}

service DiscoveryService {
  rpc GetPublicFeatureRegistry(GetPublicFeatureRegistryRequest) returns (GetPublicFeatureRegistryResponse);
  rpc GetNodeCapabilities(GetNodeCapabilitiesRequest) returns (GetNodeCapabilitiesResponse);
}

service OperatorService {
  rpc Recover(OperatorRecoveryRequest) returns (OperatorRecoveryResponse);
}

// Closed, method-preserving command envelope for in-process CLI transports.
message SandboxCommandRequest {
  oneof request {
    PlanCreateSandboxRequest plan_create = 1;
    CreateSandboxRequest create = 2;
    GetSandboxRequest get_sandbox = 3;
    GetExecutionRequest get_execution = 4;
    GetViewRequest get_view = 5;
    GetAttachmentRequest get_attachment = 6;
    GetSnapshotRequest get_snapshot = 7;
    GetOperationRequest get_operation = 8;
    ListSandboxesRequest list_sandboxes = 9;
    ListExecutionsRequest list_executions = 10;
    ListSnapshotsRequest list_snapshots = 11;
    ListDescendantsRequest list_descendants = 12;
    ListChildrenRequest list_children = 13;
    ListAncestorsRequest list_ancestors = 14;
    PlanSandboxPolicyRequest plan_policy = 15;
    UpdateSandboxPolicyRequest update_policy = 16;
    SandboxLifecycleRequest start = 17;
    SandboxLifecycleRequest stop = 18;
    SandboxLifecycleRequest suspend = 19;
    SandboxLifecycleRequest resume = 20;
    CreateExecutionRequest create_execution = 21;
    ExecutionControlRequest execution_control = 22;
    CancelExecutionRequest cancel_execution = 23;
    CancelOperationRequest cancel_operation = 24;
    CreateSnapshotRequest create_snapshot = 25;
    DeleteSnapshotRequest delete_snapshot = 26;
    RestoreSnapshotRequest restore_snapshot = 27;
    ForkSnapshotRequest fork_snapshot = 28;
    DeleteSandboxRequest delete_sandbox = 29;
    WatchRequest watch = 30;
    CreateViewRequest create_view = 31;
    AttachViewRequest attach_view = 32;
    ReplaceAttachmentRequest replace_attachment = 33;
    DetachViewRequest detach_view = 34;
    ReleaseViewRequest release_view = 35;
    ListViewsRequest list_views = 36;
    GetCacheStatusRequest cache_status = 37;
    PinCacheObjectRequest cache_pin = 38;
    UnpinCacheObjectRequest cache_unpin = 39;
    GetPublicFeatureRegistryRequest public_features = 40;
    GetNodeCapabilitiesRequest node_capabilities = 41;
    AttenuateCapabilityRequest attenuate_capability = 42;
    InspectCapabilityRequest inspect_capability = 43;
    RenewCapabilityRequest renew_capability = 44;
    RevokeCapabilityRequest revoke_capability = 45;
    OperatorRecoveryRequest operator_recovery = 46;
  }
}

service OperationService {
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
  rpc Watch(WatchRequest) returns (stream Event);
  rpc GetNodeCapabilities(GetNodeCapabilitiesRequest) returns (GetNodeCapabilitiesResponse);
}
