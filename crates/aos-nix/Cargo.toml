[package]
name = "aos-nix"
version = "0.1.0"
edition = "2024"

[features]
default = []
# RFC-0007 Candidate-C value-ABI cutover variant (task #12): forwards the
# representation feature to ratchet-value and gates the tier-1 JIT engine off by
# construction under the variant (see native/mod.rs `tier1_engine_for`).
candidate_c_value = ["ratchet-value/candidate_c_value"]

[dependencies]
anyhow = { workspace = true }
aos-nix-compat = { workspace = true }
aos-nix-syntax = { workspace = true }
ratchet-core = { workspace = true }
aos-nix-dialect = { workspace = true }
ratchet-jit = { workspace = true }
ratchet-value = { workspace = true }
ratchet-oracle = { workspace = true }
ratchet-runtime-ffi = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bzip2 = { workspace = true }
flate2 = { workspace = true }
git2 = { workspace = true }
md-5 = { workspace = true }
miette = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xxhash-rust = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
nix-compat = { workspace = true }
proptest = { workspace = true }
ratchet-core = { workspace = true, features = ["test-util"] }
