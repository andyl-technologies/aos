schema = "aos.crucible.campaign-release-acceptance-contract.v1"
gate = "gate:campaign-release-acceptance"
acceptance_state = "manual-evidence-required"
implementation_tasks = ["T-CAM-9.1", "T-CAM-9.2", "T-CAM-9.3", "T-CAM-9.4", "T-CAM-9.5", "T-CAM-9.6", "T-CAM-9.7"]

[executable_evidence]
required_gates = [
  "gate:campaign-gate-matrix",
  "gate:campaign-operational-continuity",
  "gate:campaign-replay",
  "gate:hot-fork-scaling",
  "gate:campaign-required-gates",
]
required_claim_gates = [
  "gate:campaign-model",
  "gate:campaign-component-contract",
  "gate:branch-point-model",
  "gate:typed-choice",
  "gate:typed-choice-product-checkpoint",
  "gate:campaign-replay",
  "gate:lazy-frontier",
  "gate:attempt-idempotence",
  "gate:hot-fork-equivalence",
  "gate:hot-fork-isolation",
  "gate:hot-fork-scaling",
  "gate:world-fork-atomicity",
  "gate:exact-closure-streaming",
  "gate:campaign-store-equivalence",
  "gate:campaign-store-composition",
  "gate:campaign-cold-continuity",
  "gate:campaign-statistics",
  "gate:campaign-operational-continuity",
  "gate:license-boundary",
  "gate:abi-conformance",
  "gate:control-responsiveness",
  "gate:campaign-mutation-scaling",
  "gate:campaign-rfc-traceability",
]

[manual_evidence]
required_gates = [
  "gate:campaign-operator-acceptance",
  "gate:campaign-destructive-recovery",
  "gate:campaign-dogfood",
  "gate:e2e-determinism",
]
schema = "aos.crucible.campaign-manual-evidence.v1"
required_files = [
  "manifest.env",
  "result",
  "command-journal.tsv",
  "artifact-manifest.tsv",
  "resource-audit.tsv",
]

[provenance]
required = true
fields = [
  "release_manifest_sha256",
  "release_manifest_env_sha256",
  "release_manifest_json_sha256",
  "release_acceptance_contract_sha256",
  "manual_contract_sha256",
]

[sign_offs]
namespace = "crucible-campaign-manual-evidence"
required_roles_source = "subordinate-contract"
minimum_distinct_signers = 3
distinct_signer_identities_required = true
distinct_signer_key_fingerprints_required = true
trusted_allowed_signers_input_required = true
signed_payload = "sign-offs/<role>.env"
unsigned_result = "blocked"

[binding]
release_manifest_sha256_required = true
release_manifest_env_sha256_required = true
release_manifest_json_sha256_required = true
release_acceptance_contract_sha256_required = true
manual_contract_sha256_required = true
result_sha256_required = true
command_journal_sha256_required = true
artifact_manifest_sha256_required = true
artifact_payload_sha256_required = true
structured_output_sha256_required = true
executable_gate_result_sha256_required = true
manual_evidence_result_sha256_required = true
manual_evidence_manifest_sha256_required = true
missing_or_mismatched_result = "blocked"

[normalized_evidence]
command_journal_schema = "operation,exit_status,structured_output_path,structured_output_sha256"
all_command_exit_statuses_zero = true
artifact_manifest_schema = "relative_path,sha256"
artifact_payload_digests_required = true
resource_audit_schema = "resource,status"
required_resource_status = "clean"
resource_audit_sha256_required = true
injection_record_schema = "injection,status,backend_scope,prior_state_path,prior_state_sha256,observables_path,observables_sha256,recovery_path,recovery_sha256"
required_injection_status = "pass"
injection_records_sha256_required_when_declared = true
injection_payload_digests_required = true
regular_non_symlink_files_required = true
forbidden_recovery_usage = "blocked"
unexplained_workaround = "blocked"
hidden_repair = "blocked"

[output]
schema = "aos.crucible.campaign-release-acceptance.v1"
retains_external_evidence = true
retains_manual_contracts = true
retains_executable_gate_results = true
retains_release_manifest = true
retains_release_manifest_env = true
retains_release_manifest_json = true
retains_signer_key_bindings = true
retains_release_acceptance_contract = true
ordinary_source_package_dependency = false
accepted_result = "pass"
