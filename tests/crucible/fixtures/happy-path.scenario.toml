[world.node.ready_point]
kind = "console_marker"
marker = "client ready"

[[world.node]]
id = "server"
arch = "x86_64"
memory_mib = 256
cmdline = "console=ttyS0 quiet port=8080 crucible.workload=httpd"
smp_vcpus = 1
icount_shift = 7
kernel = "blake3:fe37bad9b18652cadbc50fae4c118fa5e741731c4cf55176d48826ecad85d104"
root_image = "blake3:a79a50550e049da4dd17be2420f33b296e15a9ba83947f4293568e9561e082f0"
white_box = "disabled"

[world.node.ready_point]
kind = "console_marker"
marker = "listening on 0.0.0.0:8080"

[[world.link]]
endpoint_a = "client"
endpoint_b = "server"
latency_nanos = 5000000
jitter_nanos = 1000000
loss_millionths = 0

[plan]
id = "blake3:14c2e657cc57addfb612ed58161750fb7ed34f24a713c1e7e6487a7513d116e0"
kind = "event_graph"

[[plan.event]]
id = "pass-on-quiescence"
policy = "once"

[plan.event.trigger]
kind = "all_of"

[[plan.event.trigger.predicates]]
kind = "once"

[plan.event.trigger.predicates.predicate]
kind = "assertion_state"
name = "all-requests-succeed"
state = "satisfied"

[[plan.event.trigger.predicates]]
kind = "quiescent"

[plan.event.action]
kind = "pass"

[properties]
id = "blake3:fcff536dd7fc5fa9d761c8376f2ea18b1981bc0ce6a01560e27efd51218de58d"

[[properties.assertion]]
id = "all-requests-succeed"
message = "client observes 100 successful HTTP responses"

[properties.assertion.property]
kind = "eventually"
deadline_ticks = 60000000000

[properties.assertion.property.trigger]
kind = "once"

[properties.assertion.property.trigger.predicate]
kind = "console_match"
node = "client"
regex = '(^|\n)CLIENT_STARTED(\r?\n|$)'

[properties.assertion.property.property]
kind = "all_of"

[[properties.assertion.property.property.predicates]]
kind = "console_match"
node = "client"
regex = '(^|\n)CLIENT_RESULT requests=100 successful=100 failed=0(\r?\n|$)'

[[properties.assertion.property.property.predicates]]
kind = "node_state"
node = "client"
state = "exited"

[[properties.assertion]]
id = "no-crashes"
message = "client and server must not crash"

[properties.assertion.property]
kind = "always"

[properties.assertion.property.predicate]
kind = "not"

[properties.assertion.property.predicate.predicate]
kind = "any_of"

[[properties.assertion.property.predicate.predicate.predicates]]
kind = "node_state"
node = "client"
state = "crashed"

[[properties.assertion.property.predicate.predicate.predicates]]
kind = "node_state"
node = "server"
state = "crashed"
