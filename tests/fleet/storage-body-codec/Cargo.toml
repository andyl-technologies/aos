[package]
name = "aos-storage-body-codec"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
native-bodies = []

[dependencies]
aos-doc-model = { path = "../../../crates/aos-doc-model" }
aos-proto-types = { path = "../../../crates/aos-proto-types" }
aos-hub = { path = "../../../crates/aos-hub", features = ["test-support"] }
aos-hub-core = { path = "../../../crates/aos-hub-core" }
aos-oci-types = { path = "../../../crates/aos-oci-types" }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
