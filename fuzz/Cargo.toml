[package]
name = "aos-nix-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
aos-nix = { path = "../crates/aos-nix" }
arbitrary = "1"
libfuzzer-sys = "0.4"

[features]
# RFC-0007 Candidate-C one-word carrier variant (task #29 fuzz-parity leg):
# forwards `candidate_c_value` down to aos-nix so `cargo fuzz run <target>
# --features candidate_c_value` replays the corpus on the compressed carrier.
candidate_c_value = ["aos-nix/candidate_c_value"]

[[bin]]
name = "parity_json"
path = "fuzz_targets/parity_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "internal_diff_raw"
path = "fuzz_targets/internal_diff_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gc_tier_b_raw"
path = "fuzz_targets/gc_tier_b_raw.rs"
test = false
doc = false
bench = false
